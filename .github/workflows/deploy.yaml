name: Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/* ]

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGION: europe-west1
  GAR_LOCATION: europe-north2-docker.pkg.dev/${{ secrets.PROJECT_ID }}/app-repo
  SERVICE_NAME: lazy-chef-app
  MIGRATION_JOB_NAME: lazy-chef-db-migration
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: LINT & TEST
  # Runs on every push to feature branches and main.
  # ------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      # Testene kaller ikke Gemini, så CI trenger ingen ekte nøkkel.
      GOOGLE_API_KEY: dummy-for-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # uv installs the packages in seconds instead of the best part of a minute with pip; its cache is kept
      # between runs
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Dependencies
        run: uv pip install --system flake8 pytest -r requirements.txt

      - name: Run Linting (Flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          # A simple pytest run. Assumes 'tests/' folder exists.
          # If no tests exist yet, we echo a warning instead of failing to allow initial setup.
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "::warning::No tests/ directory found. Skipping unit tests."
          fi

  # ------------------------------------------------------------------
  # Migrations must build an empty database and match the models.
  # Catches data migrations that only work on production data.
  # ------------------------------------------------------------------
  migrations:
    name: Migrations on empty Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_BACKEND: local
      DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/postgres
      GOOGLE_API_KEY: dummy-for-tests
      SECRET_KEY: ci-only
      STORAGE_BACKEND: local
      FLASK_APP: app.py
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Upgrade an empty database and compare with the models
        run: |
          flask db upgrade
          flask db check

  # ------------------------------------------------------------------
  # STAGE 2: BUILD & SCAN, alongside the tests (push to main only)
  # The image is built while the tests run; nothing is deployed unless both pass.
  # Docker layers are cached between runs, so only what changed is rebuilt:
  # the dependencies only when requirements.txt changes, the OS packages weekly.
  # ------------------------------------------------------------------
  build:
    name: Build & Scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      # The runner has gcloud already; installing the latest took 15-20 seconds per job
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          skip_install: true

      - name: Configure Docker Auth
        run: |
          gcloud auth configure-docker europe-north2-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Daily, not weekly: a Debian fix that lands mid-week (libbrotli1, CVE-2026-111497, 24.10.2026) otherwise
      # stays out of the cached layer and Trivy blocks every deploy until the week turns
      - name: The date, to refresh the OS packages daily
        id: week
        run: echo "week=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}/${{ env.SERVICE_NAME }}:latest
          build-args: |
            APT_REFRESH=${{ steps.week.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.GAR_LOCATION }}/${{ env.SERVICE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fail on severe vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ------------------------------------------------------------------
  # STAGE 3: MIGRATE & DEPLOY (push to main only, after tests and build)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to Prod
    needs: [test, migrations, build]
    # One production deploy at a time. Two merges in quick succession used to
    # deploy in parallel: both ran the migration job at once, and the older
    # image could finish last and replace the newer one. A queued deploy
    # waits; GitHub keeps only the newest pending one, which deploys the
    # latest main anyway.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to find the last successful deploy
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history, to compare with the last deploy

      # The migration job takes over a minute and most deploys have no migration.
      # It runs when anything under migrations/ changed since the last successful
      # deploy (not just in this commit), and whenever that cannot be told.
      - name: Did the migrations change since the last deploy?
        id: migrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow deploy.yaml --branch main --event push --status success \
                   --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- migrations/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under migrations/ since the last deploy ($last): the migration job is skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Migrations changed since the last deploy (${last:-not found}), or it could not be told: running them."
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      # The runner has gcloud already; installing the latest took 15-20 seconds per job
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          skip_install: true

      - name: Update Migration Job
        if: steps.migrations.outputs.run == 'true'
        run: |
          gcloud run jobs update ${{ env.MIGRATION_JOB_NAME }} \
            --image ${{ env.GAR_LOCATION }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --command flask --args db,upgrade \
            --set-env-vars FLASK_APP=app.py,DB_BACKEND=cloudsql,INSTANCE_CONNECTION_NAME=thelazychefai-prod:europe-north2:lazy-chef-db-eu,DB_USER=${{ secrets.DB_USER }},DB_NAME=${{ secrets.DB_NAME }} \
            --set-secrets GOOGLE_API_KEY=GOOGLE_API_KEY:latest,DB_PASS=DB_PASS:latest

      - name: Execute Migration Job
        if: steps.migrations.outputs.run == 'true'
        run: |
          gcloud run jobs execute ${{ env.MIGRATION_JOB_NAME }} --region ${{ env.REGION }} --wait

      # gcloud itself rather than google-github-actions/deploy-cloudrun, which installs its own gcloud first.
      # The same as that action did: env vars and secrets merged into the service's, and its labels.
      # The timeout covers the Cloud Tasks endpoint that makes v2 recipes (about a minute, at most a few).
      # Hemmeligheter leses fra Secret Manager, ikke som klartekst i miljøvariabler.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} --quiet \
            --region ${{ env.REGION }} \
            --image ${{ env.GAR_LOCATION }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --allow-unauthenticated --timeout=600 \
            --update-labels managed-by=github-actions,commit-sha=${{ github.sha }} \
            --update-secrets GOOGLE_API_KEY=GOOGLE_API_KEY:latest,DB_PASS=DB_PASS:latest,SECRET_KEY=SECRET_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CONTENT_API_KEY=CONTENT_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest \
            --update-env-vars FLASK_APP=app.py,DB_BACKEND=cloudsql,INSTANCE_CONNECTION_NAME=thelazychefai-prod:europe-north2:lazy-chef-db-eu,DB_USER=${{ secrets.DB_USER }},DB_NAME=${{ secrets.DB_NAME }},STORAGE_BACKEND=gcs,GCS_BUCKET_NAME=thelazychef-assets,TASKS_QUEUE=recipe-generation,TASKS_LOCATION=europe-west1,TASKS_SERVICE_ACCOUNT=recipe-tasks@thelazychefai-prod.iam.gserviceaccount.com,APP_BASE_URL=https://lazy-chef-app-57buprlcwq-ew.a.run.app
