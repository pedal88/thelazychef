    const availH = page ? page[1] - (top - document.querySelector('.app').getBoundingClientRect().top) - 4
      : el.dataset.fit === 'side' ? Infinity : innerHeight - top - (document.querySelector('.bar') ? 104 : 40);
    /* På papir får tegningen også vokse til den fyller arket */
    const sc = Math.max(ui.print ? 0.6 : el.dataset.fit === 'side' ? 0.8 : 0.75, Math.min(ui.print ? 1.4 : 1, availW / natW, availH / natH));
    el.dataset.scale = sc;
    /* Til utskrift krymper zoom også plassen tegningen tar, ellers skalerer nettleseren hele arket ned. */
    if (ui.print) el.style.zoom = sc;
    else { el.style.transformOrigin = '0 0'; el.style.transform = `scale(${sc})`; el.style.marginBottom = `${-natH * (1 - sc)}px`; el.style.marginRight = `${-natW * (1 - sc)}px`; }
    el.style.marginLeft = ui.print ? `${Math.max(0, (availW - natW * sc) / 2) / sc}px` : '';
    const note = el.parentElement.querySelector('.fx-scale'); if (note) note.textContent = sc < 1 ? `vist i ${Math.round(sc * 100)} %` : '';
  });
}

/* Retningen følger formen på plassen tegningen får: bred og lav gir liggende delta, høy gir stående.
   Bryteren viser retningen som er valgt, og du kan bytte; valget ditt gjelder til du laster siden på nytt. Utskrift (#r4-sketch-0-pp / -pl) gir A4 stående eller liggende. */
function sketchHorizontal(availW = Math.min(innerWidth - 64, 1600), availH = innerHeight - 190) {
  if (ui.print) return ui.print === 'landscape';
  if (ui.skor === 'portrait' || ui.skor === 'landscape') return ui.skor === 'landscape';
  return availW / availH > 1.15;
}
const orientSeg = horiz => `<div class="seg" role="group" aria-label="Retning">${[['portrait', 'Stående'], ['landscape', 'Liggende']].map(([k, l]) => `<button data-skor="${k}" aria-pressed="${(horiz ? 'landscape' : 'portrait') === k}">${l}</button>`).join('')}</div>`;
function vSketch() {
  const r = dishOf(), horiz = sketchHorizontal();
  const n = Object.keys(state.checks).filter(k => k.startsWith(r.id + ':done:') && state.checks[k]).length;
  return `<header class="wtop sk-top"><div class="wtop-in"><button class="back" data-go="home">← Retter</button><span class="top-title">Elvedelta</span>
      <div class="sk-ctl">${orientSeg(horiz)}
      <div class="seg" role="group" aria-label="Rett">${RECIPES.map(r0 => `<button data-skdish="${r0.id}" aria-pressed="${state.dish === r0.id}">${r0.no}</button>`).join('')}</div></div></div></header>
    ${ui.printBlocked ? `<div class="pblock"><p><b>Utskrift er blokkert her.</b> Artefakten kjører i en ramme som ikke får åpne utskriftsdialogen. Slik ser arket ut på A4 ${ui.print === 'landscape' ? 'liggende' : 'stående'}.</p><button class="btn" data-printback>← Tilbake</button></div>` : ''}
    <main class="app sk"${ui.print ? ` style="width:${PAGE[ui.print][0]}px"` : ''}><div class="sk-head"><h1 class="hand">${esc(r.title)}</h1><p>${horiz ? 'Liggende' : 'Stående'} · trykk på et nummer for å markere steget som ferdig${n ? ` · ${n} ferdig · <button class="lnk" data-skreset>nullstill</button>` : ''}</p></div>
      <div class="sk-paper ${horiz ? 'wide' : 'tall'}"><span class="fx-scale hand"></span>${skFit(r, horiz)}</div></main>`;
}

/* ---------- tegning, tid og hendelser ---------- */
const root = document.getElementById('root');
function render() {
  if (ui.screen === 'plan') ui.screen = 'overview';
  document.body.classList.toggle('is-wide', wide());
  root.innerHTML = (wide() ? { home: vHome, overview: vOverviewWide, mise: vMiseWide, cook: vCookWide, done: vDone, sketch: vSketch }
    : { home: vHome, overview: vOverview, mise: vMiseScreen, cook: vCook, done: vDone, sketch: vSketch })[ui.screen]();
  const top = document.getElementById('top'), st = document.getElementById('status');
  if (st && top) st.style.top = `calc(env(safe-area-inset-top,0px) + ${top.offsetHeight}px)`;
  wake(ui.screen === 'cook');
  if (document.querySelector('.skv')) { const go = () => { fitSketches(); fitBoth(); drawArrows(); toCurNode(); }; go(); document.fonts?.ready.then(go); setTimeout(go, 400); }
  const ts = document.querySelector('.tside'), tc = ts && ts.querySelector('.ts.cur');
  if (tc) ts.scrollLeft = Math.max(0, tc.offsetLeft - 170);
  save();
}
/* Sidekolonnen ruller elvedeltaet slik at steget du er på, står midt i synet */
function toCurNode() {
  const w = document.querySelector('.dl-wrap.side'), n = w?.querySelector('.g2-node.cur'); if (!n) return;
  const W = w.getBoundingClientRect(), N = n.getBoundingClientRect();
  w.scrollLeft += (N.left + N.width / 2) - (W.left + W.width / 2); w.scrollTop += (N.top + N.height / 2) - (W.top + W.height / 2);
}
/* På stor skjerm står kortet midt i listen: rull det frem. På telefonen er kortet øverst. */
function toCard() { if (wide()) document.getElementById('card')?.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); else scrollTo(0, 0); }
function go(screen) { ui.screen = screen; ui.menu = false; if (screen !== 'cook') ui.list = false; render(); scrollTo(0, 0); }

let rid = Date.now();
function startRun(r, s) {
  if (runOf(r, s.id)) return;
  ui.running.push({ id: ++rid, r: r.id, s: s.id, label: s.short, done: s.done || '', end: Date.now() + (s.timer || s.passive) * 60e3, rang: false });
}
let actx = null;
function beep(prime) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (prime) return;
    [0, 0.35, 0.7].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d + 0.3); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.3); });
  } catch (e) { /* lyd er valgfritt */ }
}
setInterval(() => {
  ui.running.forEach(t => {
    document.querySelectorAll(`[data-tid="${t.id}"]`).forEach(b => { const sp = b.querySelector('span'); if (sp) sp.textContent = fmtLeft(t); b.classList.toggle('fin', Date.now() >= t.end); });
    if (!t.rang && Date.now() >= t.end) { t.rang = true; beep(false); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { /* ikke støttet */ } if (ui.screen === 'cook') render(); else save(); }
  });
}, 1000);

let lock = null;
async function wake(on) {
  try {
    if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; /* skjermlås kan bli avslått; prototypen virker uten */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(ui.screen === 'cook'); });

function step(d) {
  const steps = cookSteps(dishOf());
  if (d > 0 && ui.idx >= steps.length - 1) return go('done');
  ui.idx = Math.max(0, Math.min(steps.length - 1, ui.idx + d)); ui.openRun = null; delete ui.tl[dishOf().id]; render(); toCard();
}
/* Hovedknappen: har steget passiv tid, settes det i gang i «Pågår» før du går videre. Et ferdig aktivt steg fjerner sitt eget løp. */
function setPrint(orient) {
  ui.print = orient; document.body.classList.toggle('printmode', !!orient);
  let st = document.getElementById('pagesize'); if (!st) { st = document.createElement('style'); st.id = 'pagesize'; document.head.appendChild(st); }
  st.textContent = orient ? `@page{size:A4 ${orient};margin:10mm}` : '';
}
function printDelta(orient) {
  const back = ui.screen; setPrint(orient); ui.screen = 'sketch'; render();
  let over = false, opened = false; const seen = () => { opened = true; };
  const done = () => { if (over) return; over = true; removeEventListener('afterprint', done); removeEventListener('beforeprint', seen); setPrint(null); ui.screen = back; ui.printBlocked = false; render(); };
  ui.printBack = done; addEventListener('beforeprint', seen); addEventListener('afterprint', done);
  /* print() venter til dialogen er lukket. En innebygd ramme uten tillatelse til dialoger ignorerer kallet:
     da kommer beforeprint aldri, og arket blir stående med en melding og en vei tilbake. */
  setTimeout(() => { try { print(); } catch { /* blokkert */ } setTimeout(() => { if (opened) done(); else { ui.printBlocked = true; render(); } }, 300); }, 600);
}
function advance() {
  const r = dishOf(), s = cookSteps(r)[ui.idx];
  state.checks[`${r.id}:done:${s.id}`] = true;
  if ((s.timer || s.passive) && ui.idx < cookSteps(r).length - 1) startRun(r, s);
  step(1);
}
root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const r = dishOf(), d = b.dataset;
  if (d.go) { if (d.go === 'cook') beep(true); return go(d.go); }
  if (d.dish) { if (state.dish !== d.dish) { state.dish = d.dish; ui.idx = 0; ui.running = []; ui.sel = null; ui.tl = {}; ui.showDone = false; } return go('overview'); }
  if (d.serv) { state.serv = Math.max(1, Math.min(12, state.serv + +d.serv)); return render(); }
  if (d.plan) { state.plan = d.plan; ui.idx = 0; return render(); }
  if (d.alt) { state.alt[r.id] = d.alt === 'bought'; ui.idx = 0; return render(); }
  if ('menu' in d) { ui.menu = !ui.menu; return render(); }
  if (d.tick) { state.checks[d.tick] = !state.checks[d.tick]; const sc = scrollY; render(); return scrollTo(0, sc); }
  if (d.advance) return advance();
  if (d.step) return step(+d.step);
  if (d.list) { ui.list = d.list === '1'; render(); if (ui.list) document.querySelector('.steplist li.cur')?.scrollIntoView({ block: 'center' }); return; }
  if (d.jump) { ui.idx = +d.jump; ui.list = false; delete ui.tl[r.id]; render(); return toCard(); }
  if (d.run) { ui.openRun = ui.openRun === +d.run ? null : +d.run; return render(); }
  if (d.rundone) { ui.running = ui.running.filter(t => t.id !== +d.rundone); ui.openRun = null; return render(); }
  if (d.side) { ui.side = d.side; return render(); }
  if (d.skdish) { state.dish = d.skdish; ui.idx = 0; return render(); }
  if (d.skor) { ui.skor = d.skor; return render(); }
  if (d.print) return printDelta(d.print);
  if ('printback' in d) return ui.printBack?.();
  if ('skreset' in d) { Object.keys(state.checks).filter(k => k.startsWith(dishOf().id + ':done:')).forEach(k => delete state.checks[k]); return render(); }
  if ('wmenu' in d) { ui.wmenu = !ui.wmenu; return render(); }
  if ('full' in d) { ui.full = !ui.full; document.body.classList.toggle('noscroll', ui.full); return render(); }
  if (d.goto) { ui.idx = +d.goto; ui.sel = null; delete ui.tl[r.id]; render(); return toCard(); }
  if ('selclear' in d) { ui.sel = null; const sc = scrollY; render(); return scrollTo(0, sc); }
  if ('tlreset' in d) { delete ui.tl[r.id]; return render(); }
  if ('showdone' in d) { ui.showDone = !ui.showDone; return render(); }
});
/* Tidslinje, metrokart og tabell: trykk på et steg for å velge det. Trykk igjen for å fjerne valget. */
function pick(e) {
  const g = e.target.closest('[data-sel]'); if (!g) return false;
  ui.sel = ui.sel === g.dataset.sel ? null : g.dataset.sel;
  const sc = scrollY; render(); scrollTo(0, sc); return true;
}
root.addEventListener('click', e => { pick(e); }, true);
root.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-sel]') && !e.target.closest('button')) { e.preventDefault(); pick(e); } });
/* Menyen lukkes når du trykker utenfor den. Klikket gjør likevel det det skulle. */
document.addEventListener('click', e => { if (ui.wmenu && !e.target.closest('.wmenu')) { ui.wmenu = false; render(); } }, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (ui.full) { ui.full = false; document.body.classList.remove('noscroll'); render(); } else if (ui.wmenu) { ui.wmenu = false; render(); }
});
/* Håndtaket mellom kolonnene i «Lag mat»: dra med mus eller finger, eller bruk piltastene. */
let drag = null;
root.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-split]'); if (!h) return;
  const cols = h.parentElement, box = cols.getBoundingClientRect();
  drag = { cols, right: box.right, max: box.width * 0.62 }; h.setPointerCapture(e.pointerId); h.classList.add('on'); e.preventDefault();
});
root.addEventListener('pointermove', e => {
  if (!drag) return;
  ui.asideW = Math.round(Math.max(320, Math.min(drag.max, drag.right - e.clientX - 10)));
  drag.cols.style.gridTemplateColumns = `minmax(0,1fr) 20px ${ui.asideW}px`;
});
root.addEventListener('pointerup', () => { if (!drag) return; drag = null; save(); render(); });
root.addEventListener('keydown', e => {
  if (!e.target.closest('[data-split]') || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  ui.asideW = asideW() + (e.key === 'ArrowLeft' ? 24 : -24); save(); render(); document.querySelector('[data-split]')?.focus();
});
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if ((wide() && ui.screen !== 'home') || ui.screen === 'sketch') render(); }, 150); });
root.addEventListener('input', e => {
  const x = e.target; if (!x.dataset || !x.dataset.tl) return;
  const r = dishOf(), m = +x.value; ui.tl[r.id] = m;
  document.getElementById('tln-' + r.id)?.style.setProperty('--x', m / r.sch.T);
  const st = document.getElementById('tls-' + r.id); if (st) st.innerHTML = tlStatus(r, m);
});
WIDE.addEventListener('change', () => render());
root.addEventListener('change', e => {
  const el = e.target;
  if ('skip' in el.dataset) { const s = cookSteps(dishOf())[ui.idx]; ui.skipAhead = el.checked; const k = cookSteps(dishOf()).indexOf(s); ui.idx = k < 0 ? 0 : k; render(); }
});
/* Sveip på kortet: venstre = som hovedknappen, høyre = forrige. */
let sx = null, sy = null;
root.addEventListener('touchstart', e => { if (!e.target.closest('#card')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
root.addEventListener('touchend', e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { if (dx < 0) advance(); else step(-1); }
}, { passive: true });
document.addEventListener('keydown', e => { if (ui.screen !== 'cook' || ui.list || e.target.closest?.('[data-split]')) return; if (e.key === 'ArrowRight') advance(); if (e.key === 'ArrowLeft') step(-1); });

load();
/* Lenke rett til en visning: #r7-cook-4 = biff og brokkoli (rett 6), Lag mat, steg 5. */
{ const [d, sc, i, pm] = location.hash.slice(1).split('-');
  if (RECIPES.some(r => r.id === d)) { if (state.dish !== d) { ui.running = []; ui.idx = 0; } state.dish = d; if (sc) ui.screen = sc; if (i) ui.idx = +i; }
  /* Utskriftsmodus for A4: -pp stående, -pl liggende. Uten toppfelt og ramme, med riktig @page. */
  if (pm === 'pp' || pm === 'pl') setPrint(pm === 'pl' ? 'landscape' : 'portrait'); }
render();
</script>
</body>
</html>
