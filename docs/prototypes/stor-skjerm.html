<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazy Chef på stor skjerm</title>
<!-- Prototype for stor skjerm (RECIPE_VISUALIZATIONS.md 9.15, steg 7c). Bygget på telefon.html: under 1024 px er
     flyten den samme som på telefonen. Fra 1024 px får hver fane en kolonne ved siden av, og fanen «Plan» viser
     tidslinjen, metrokartet og tabellmetoden (tegnekoden er hentet fra fem-retter.html). Rett 6 og 7 er skrevet
     av Claude som tester av elvedeltaet. Denne fila er kilden. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=GFS+Didot&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: én telefonspalte (maks 480 px) med fast toppfelt og stor tommelknapp nederst. Prep = oliven, cook = glo, serve = Egeerhavet, som prototypen. */
:root{
  --paper:#F9FAF6; --card:#FFFFFF; --ink:#1D2320; --muted:#5C655F; --line:#DCE0D5; --line-strong:#B9BFB2; --soft:#EFF1EA;
  --prep:#5A7A3A; --prep-bg:#E5ECD8; --prep-ink:#2E441E;
  --cook:#C2561C; --cook-bg:#F7E2D3; --cook-ink:#76300E;
  --serve:#1E5A8A; --serve-bg:#DFEAF4; --serve-ink:#123A5B;
  --now:#B3261E;
  --c-kjott:#B5523B; --c-meieri:#3E6FA3; --c-gront:#4F7A35; --c-krydder:#B0841A; --c-korn:#9A7B4F; --c-annet:#6E756F;
  --display:"GFS Didot","Didot","Bodoni 72",Georgia,serif;
  --body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bar-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141714; --card:#1C201C; --ink:#E9ECE4; --muted:#A2AA9F; --line:#2F352F; --line-strong:#4A5249; --soft:#232823;
  --prep:#93B86C; --prep-bg:#25321C; --prep-ink:#CFE2B6;
  --cook:#E8814A; --cook-bg:#3A2316; --cook-ink:#F5C8A8;
  --serve:#7DB4E4; --serve-bg:#17293A; --serve-ink:#C4DDF3;
  --now:#FF7A6E;
  --c-kjott:#E08A72; --c-meieri:#86B3E3; --c-gront:#93B86C; --c-krydder:#E0B755; --c-korn:#CDB08A; --c-annet:#A2AA9F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141714; --card:#1C201C; --ink:#E9ECE4; --muted:#A2AA9F; --line:#2F352F; --line-strong:#4A5249; --soft:#232823;
  --prep:#93B86C; --prep-bg:#25321C; --prep-ink:#CFE2B6;
  --cook:#E8814A; --cook-bg:#3A2316; --cook-ink:#F5C8A8;
  --serve:#7DB4E4; --serve-bg:#17293A; --serve-ink:#C4DDF3;
  --now:#FF7A6E;
  --c-kjott:#E08A72; --c-meieri:#86B3E3; --c-gront:#93B86C; --c-krydder:#E0B755; --c-korn:#CDB08A; --c-annet:#A2AA9F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px));min-height:100%}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--serve);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.tab-nums{font-variant-numeric:tabular-nums}

/* toppfelt: flyten i tre steg */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px max(16px,calc((100% - 448px)/2)) 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px;min-height:36px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-size:15px;color:var(--muted);flex:none}
.top-title{font:600 15px/1.25 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.flow button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 4px;font-size:13px;line-height:1.2;color:var(--muted)}
.flow button[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flow button.done{color:var(--ink)}
.flow button.done::before{content:"✓ ";color:var(--prep)}

/* bunnfelt med tommelknapp */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:14px;min-height:56px;padding:8px 14px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{flex:1;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.prep.primary{background:var(--prep);border-color:var(--prep);color:#fff}
.btn.cook.primary{background:var(--cook);border-color:var(--cook);color:#fff}
.btn.serve.primary{background:var(--serve);border-color:var(--serve);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}
.btn.sq{width:56px;flex:none;padding:0}

/* velg rett */
.home h1{font:400 40px/1.05 var(--display);margin:28px 0 6px}
.home .lead{margin:0 0 20px;color:var(--muted)}
.dishes{display:grid;gap:12px}
.dish{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px}
.dish .no{grid-row:span 2;font:400 34px/1 var(--display);color:var(--line-strong);width:28px}
.dish b{font-size:17px;font-weight:600;line-height:1.3}
.dish small{color:var(--muted);font-size:14px}

/* oversikt */
.ov h1{font:400 34px/1.08 var(--display);margin:20px 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.fact{background:var(--soft);border-radius:12px;padding:8px 10px}
.fact b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.ctl{display:grid;gap:12px;margin:0 0 18px}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;background:var(--card)}
.stepper button{border:0;background:none;width:44px;height:40px;font-size:20px}
.stepper span{min-width:84px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 0}
.parts{margin:0 0 18px;font-size:15px}
.parts span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:4px 6px 0 0;background:var(--card)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font:400 24px/1.2 var(--display)}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings .nm{min-width:0}
.ings .nm em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.ings .amt{font:500 15px/1.2 var(--mono);text-align:right;white-space:nowrap}
.comp-h{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.eqchips{display:flex;flex-wrap:wrap;gap:6px}
.eqchips span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--card)}

/* gjør klart */
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.meter span{display:block;height:100%;background:var(--prep);transition:width .25s}
.mise h1{font:400 30px/1.1 var(--display);margin:20px 0 4px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--prep)}
.chk span{min-width:0}
.chk em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.chk:has(input:checked) > span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.bowl{border:1.5px solid var(--prep);border-radius:18px;background:var(--card);padding:12px 14px 4px;margin:10px 0}
.bowl.cook{border-color:var(--cook)}.bowl.serve{border-color:var(--serve)}
.bowl-h{display:flex;align-items:center;gap:10px}
.bno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 12px/1 var(--body);flex:none}
.bowl.cook .bno{background:var(--cook)}.bowl.serve .bno{background:var(--serve)}.bowl.prep .bno{background:var(--prep)}
.bowl-h b{font-size:17px}
.bowl small{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
.bowl .pics{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.bowl .chk{border-bottom:0;padding:6px 0}
.later{border:1px dashed var(--line-strong);border-radius:14px;padding:4px 14px;margin:14px 0}
.later summary{cursor:pointer;padding:10px 0;font-weight:600}
.later summary small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.bench{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px}
.bench span{display:inline-flex;align-items:center;gap:6px}

/* lag mat */
.status{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:4;background:var(--paper);margin-inline:-16px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.prog{display:flex;gap:3px;margin:0 0 8px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.prep.on{background:var(--prep)}.prog i.cook.on{background:var(--cook)}.prog i.serve.on{background:var(--serve)}
.prog i.cur{outline:2px solid var(--ink);outline-offset:1px}
.now{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;align-items:center}
.now .lbl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tm{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--cook-bg);color:var(--cook-ink);border:0;font-size:14px;font-variant-numeric:tabular-nums}
.tm.est{background:var(--soft);color:var(--ink)}
.tm.fin{background:var(--now);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.card{border-radius:22px;padding:18px 18px 16px;margin:14px 0 0;background:var(--prep-bg);color:var(--prep-ink);touch-action:pan-y}
.card.cook{background:var(--cook-bg);color:var(--cook-ink)}.card.serve{background:var(--serve-bg);color:var(--serve-ink)}
.card .meta{font:500 12px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.card .while{display:inline-block;margin-top:6px;font:600 13px/1.3 var(--body);text-transform:none;letter-spacing:0;background:color-mix(in srgb,currentColor 12%,transparent);border-radius:999px;padding:3px 10px}
.card h2{font:400 34px/1.08 var(--display);margin:10px 0 8px;color:var(--ink)}
.card .eqline{font-size:15px;font-weight:600;margin:0 0 8px}
.card p.txt{font-size:20px;line-height:1.5;margin:0 0 12px;color:var(--ink)}
.card p.txt b{font-weight:700}
.card p.txt .ref{text-decoration:underline dotted;text-underline-offset:3px}
.uses{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.uses span{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:12px;padding:4px 10px 4px 4px;font-size:15px}
.donebox{border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:10px;font-size:16px;color:var(--ink)}
.donebox b{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:inherit}
.timerbtn{width:100%;margin-top:12px;border:2px solid currentColor;background:var(--card);color:var(--ink);border-radius:14px;min-height:52px;font-weight:600;font-variant-numeric:tabular-nums}
.timerbtn.fin{background:var(--now);border-color:var(--now);color:#fff}
.swipehint{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0}
.steplist{list-style:none;margin:12px 0 0;padding:0}
.steplist li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.steplist li button{all:unset;cursor:pointer;display:contents}
.steplist .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:600 13px/1 var(--body);background:var(--prep-bg);color:var(--prep-ink)}
.steplist li.cook .n{background:var(--cook-bg);color:var(--cook-ink)}.steplist li.serve .n{background:var(--serve-bg);color:var(--serve-ink)}
.steplist li.past{opacity:.5}
.steplist li.cur{background:var(--soft);margin-inline:-16px;padding-inline:16px;border-radius:0}
.steplist .m{font:500 12px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.steplist p{margin:2px 0 0;font-size:16px}
.steplist .pill{background:var(--soft);border-radius:6px;padding:0 5px;font-weight:600;white-space:nowrap}
.steplist li.cur .pill{background:var(--card)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.toggle-row label{display:flex;gap:8px;align-items:center}

/* ferdig */
.fin-s{text-align:center;padding-top:60px}
.fin-s h1{font:400 44px/1.05 var(--display);margin:0 0 10px}

.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* versjon 2: fliser, skåler som knapper, «du trenger», pågår */
.eq-img{flex:none;width:var(--s);height:var(--s);border-radius:28%;display:inline-grid;place-items:center;border:1.5px dashed var(--line-strong);color:var(--muted);background:var(--card)}
.eq-img svg{width:62%;height:62%}
.tile{display:grid;justify-items:center;align-content:start;gap:2px;width:84px;text-align:center;border:0;background:none;padding:0;color:inherit;font:inherit}
.tile .ing-img{margin-bottom:2px}
.tile .ta{font:600 15px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .tn{font-size:13px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.tile .tn em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.tiles{display:flex;flex-wrap:wrap;gap:12px 8px;margin:6px 0 10px}
.eqtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 6px;margin:4px 0}
.tile.eq{border-radius:14px;padding:8px 2px;cursor:pointer}
.tile.eq.ok{background:var(--prep-bg)}
.tile.eq.ok .eq-img{border-style:solid;border-color:var(--prep);color:var(--prep)}
.eqlist{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:14px}
.eqlist span{display:inline-flex;align-items:center;gap:6px}
button.bowl{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bowl .state{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.bowl.ok{background:var(--soft);border-style:solid;opacity:.62}
.bowl.ok .bno{background:var(--prep)}
.bowl.ok .state{color:var(--prep);font-weight:600}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px;margin:6px 0;color:inherit;font:inherit}
.task em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.task.ok{opacity:.6;background:var(--soft)}
.card .eqline{display:flex;align-items:center;gap:8px}
.needs{display:flex;flex-wrap:wrap;gap:12px 8px;align-items:flex-start;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:16px;padding:10px;margin:0 0 12px;color:var(--ink)}
.needs .eyebrow{flex-basis:100%}
.needbowl,.needres{display:flex;gap:8px;align-items:flex-start;flex-basis:100%;font-size:15px}
.needbowl em,.needres em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.needbowl .mini{display:flex;gap:4px;margin:4px 0 2px}
.needres .arrow{display:inline-grid;place-items:center;width:24px;height:24px;font-weight:700}
.waitbox{margin:8px 0 0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--now);font-weight:600;font-size:15px;border:1.5px solid var(--now)}
.passbox{margin-top:12px;font-size:15px;color:var(--ink);border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:10px}
.runbox{display:grid;gap:4px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:15px}
.runbox .btn{min-height:44px;margin-top:4px}

/* versjon 3: meny, handleliste, symbol i pillene, ta frem som rutenett */
.menu-btn{flex:none;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;width:44px;height:40px;font-size:20px;line-height:1}
.menu-btn[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:grid;gap:12px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 12%,transparent)}
.sheet .ctl{margin:0}
.sheet .btn{min-height:44px}
.facts .fact b{font-size:18px}
.steplist .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 2px;vertical-align:middle;line-height:1.3}
.steplist .pill .ing-img{border-radius:6px}
.prep{color:var(--muted);font-weight:400}
.card p.txt .prep{color:inherit;opacity:.75}
.fetchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 6px;margin:6px 0 10px}
.ftile{border-radius:14px;padding:8px 2px;cursor:pointer}
.ftile.ok{background:var(--prep-bg)}
.ftile.ok .ing-img{outline:2px solid var(--prep);outline-offset:1px}
.btn.sq.txt{font-size:14px;width:64px}

.ing-img{position:relative;flex:none;width:var(--s);height:var(--s);border-radius:28%;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,var(--card));border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);color:var(--cc);font:600 calc(var(--s)*.42)/1 var(--body)}
.ing-img img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
.ing-img .mark{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink)}
.ing-img .mark svg{width:10px;height:10px}
.cat-kjøtt{--cc:var(--c-kjott)}.cat-meieri{--cc:var(--c-meieri)}.cat-grønt{--cc:var(--c-gront)}.cat-krydder{--cc:var(--c-krydder)}.cat-korn{--cc:var(--c-korn)}.cat-annet,.ing-img.more{--cc:var(--c-annet)}

/* ---------- stor skjerm: planvisningene (fra fem-retter.html) og to kolonner fra 1024 px ---------- */
:root{--l1:#1E5A8A;--l2:#5A7A3A;--l3:#8B4C7C;--l4:#B0841A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--l1:#7DB4E4;--l2:#93B86C;--l3:#D08DC0;--l4:#E0B755}}
:root[data-theme="dark"]{--l1:#7DB4E4;--l2:#93B86C;--l3:#D08DC0;--l4:#E0B755}
.ph-prep{--ph:var(--prep);--ph-bg:var(--prep-bg);--ph-ink:var(--prep-ink)}
.ph-cook{--ph:var(--cook);--ph-bg:var(--cook-bg);--ph-ink:var(--cook-ink)}
.ph-serve{--ph:var(--serve);--ph-bg:var(--serve-bg);--ph-ink:var(--serve-ink)}
.tl-scroll{overflow-x:auto}
.tl{--lw:190px;position:relative;min-width:620px;padding-top:16px}
.tl.compact{--lw:132px;min-width:0;padding-top:12px}
.tl-row{display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;min-height:32px;border-bottom:1px solid var(--soft)}
.tl.compact .tl-row{min-height:25px}
.tl-row.cur{background:var(--soft);box-shadow:inset 3px 0 0 var(--ph)}
.tl-row.cur .tl-l span{font-weight:700}
.tl-l{display:grid;font-size:13px;line-height:1.25;padding:0 10px 0 6px;min-width:0}
.tl-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-l small{font-size:11.5px;color:var(--muted)}
.tl-t{position:relative;height:14px}
.tb{position:absolute;top:0;height:14px;border-radius:3px;display:block}
.tb.a{background:var(--ph)}
.tb.p{background:repeating-linear-gradient(135deg,var(--ph) 0 2px,transparent 2px 6px);border:1px solid var(--ph)}
.tb.h{background:transparent;border:1.5px dotted var(--ph);border-left:0;border-radius:0 3px 3px 0;opacity:.7}
.tb.h.over{border-color:var(--now);opacity:1}
.tl-me{--ph:var(--ink)}
.tb.me{background:var(--ink)}
.tb.free{background:var(--soft);border:1px dashed var(--line-strong);display:grid;place-items:center;overflow:hidden}
.tb.free b{font:500 10px var(--mono);color:var(--muted);white-space:nowrap}
.tl-axis{display:grid;grid-template-columns:var(--lw) 1fr;height:22px}
.tl-axis div{position:relative;font:11px var(--mono);color:var(--muted)}
.tl-axis span{position:absolute;top:4px;transform:translateX(-50%)}
.nowline{position:absolute;top:0;bottom:22px;width:2px;background:var(--now);left:calc(var(--lw) + (100% - var(--lw)) * var(--x));pointer-events:none}
.phline{position:absolute;top:0;bottom:22px;width:0;border-left:1px dashed var(--line-strong);left:calc(var(--lw) + (100% - var(--lw)) * var(--x));pointer-events:none}
.phline span{position:absolute;top:0;left:4px;font:500 9.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:var(--card);padding:0 2px}
.phline.r span{left:auto;right:4px}
.tl-ctl{display:grid;gap:8px;margin-top:12px}
.tl-ctl label{display:flex;gap:12px;align-items:center;font-size:14px}
.tl-ctl input{flex:1;accent-color:var(--now)}
.tl-status{font-size:15px;margin:0;min-height:3em}
.m-scroll{overflow-x:auto}
.m-svg{display:block;height:auto}
.m-line{fill:none;stroke-width:5;stroke-linecap:round}
.m-st circle{fill:var(--card);stroke:var(--ph);stroke-width:3}
.m-st.ph-cook circle{fill:var(--ph)}
.m-st.ph-serve circle{fill:var(--ink);stroke:var(--ink)}
.m-lbl{font:11.5px var(--body);fill:var(--ink)}
.m-lane{font:500 11px var(--mono);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.m-guide{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:2 4}
.m-tick{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:1 3}
.m-ax{font:500 10.5px var(--mono);fill:var(--muted)}
.m-phase{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:5 5}
.m-zone{font:500 10.5px var(--mono);fill:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.m-note{font-size:13px;margin:10px 0 0;color:var(--muted)}
.tscroll{overflow-x:auto}
.tgrid{display:grid;gap:3px;font-size:13px}
.tc{padding:6px 9px;border-radius:4px;line-height:1.3}
.th{background:var(--soft);font-style:italic}
.ti{background:var(--soft);display:grid;align-content:center}
.ti small{font-size:11.5px;color:var(--muted)}
.ti b{font:500 12.5px var(--mono)}
.ts{background:var(--ph-bg);color:var(--ph-ink);display:grid;align-content:center;justify-items:center;text-align:center;gap:2px}
.ts b{font-weight:600}
.ts small{font-size:11.5px;font-family:var(--mono)}
.ts b,.ti span{overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;background:var(--ph)}
.sw.pas{background:repeating-linear-gradient(135deg,var(--cook) 0 2px,transparent 2px 5px);border:1px solid var(--cook)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 20px 18px;margin:0 0 18px;min-width:0}
.panel .sec{margin:16px 0 8px}
.lnk{border:0;background:none;padding:10px 0 0;font-weight:600;color:var(--serve)}
button.shopi{all:unset;display:contents;cursor:pointer}
.shop li{cursor:pointer}
.shop li.ok .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.shop li.ok .ing-img{opacity:.45}
.shop li.ok .amt{color:var(--muted)}
.nextline{margin:12px 0 0;font-size:15px}
.nextline .eyebrow{margin-right:6px}

/* Lag mat på stor skjerm: listen med det åpne kortet */
.wsteps{list-style:none;margin:0;padding:0}
.wsteps li.row{border-bottom:1px solid var(--line)}
.wsteps li.row button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 8px;width:100%;border-radius:10px}
.wsteps li.row button:hover{background:var(--soft)}
.wsteps li.row button:focus-visible{outline:3px solid var(--serve)}
.wsteps li.past{opacity:.5}
.wsteps .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:600 13px/1 var(--body);background:var(--ph-bg);color:var(--ph-ink)}
.wsteps .m{font:500 12px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wsteps p{margin:2px 0 0;font-size:15px}
.wsteps .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 2px;vertical-align:middle;line-height:1.3;background:var(--soft);border-radius:6px;font-weight:600;white-space:nowrap}
.wsteps .pill .ing-img{border-radius:6px}
.wcur{border-radius:22px;padding:18px 22px 18px;margin:12px 0;background:var(--ph-bg);color:var(--ph-ink);scroll-margin-top:140px}
.wcur .meta{font:500 12px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.wcur .while{display:inline-block;margin-top:6px;font:600 13px/1.3 var(--body);background:color-mix(in srgb,currentColor 12%,transparent);border-radius:999px;padding:3px 10px}
.wcur h2{font:400 34px/1.08 var(--display);margin:10px 0 8px;color:var(--ink)}
.wcur .eqline{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0 0 10px}
.wcur-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.wcur .txt{font-size:20px;line-height:1.5;margin:0;color:var(--ink)}
.wcur .txt .prep{color:inherit;opacity:.75}
.wcur .needs{margin:0}

@media (min-width:1024px) and (orientation:landscape){
  body{font-size:16px}
  .app{max-width:1280px;padding-inline:32px}
  .wtop{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 32px 10px}
  .wtop-in{max-width:1216px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 18px}
  .wtop .top-title{font:400 26px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wtop .flow{grid-column:1/-1;display:flex;gap:6px;margin:0}
  .wtop .flow button{padding:7px 18px;font-size:14px}
  .wtop .flow .planbtn{margin-left:14px;border-style:dashed}
  .wtop .flow .planbtn[aria-current="step"]{border-style:solid}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tools .stepper button{height:36px}
  .tools .seg button{min-height:32px;padding:4px 12px;font-size:13.5px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start;margin-top:22px}
  .main{min-width:0}
  .aside{position:sticky;top:128px}
  .wfacts{grid-template-columns:repeat(4,1fr)}
  .bar-in{max-width:1216px;justify-content:flex-end}
  .bar .btn.primary{flex:0 1 380px}
  .home{max-width:1100px}
  .dishes{grid-template-columns:repeat(3,1fr)}
  .bowlgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;align-items:start}
  .eqtiles,.fetchgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .planv .planhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:24px 0 4px}
  .planv h1{font:400 34px/1.08 var(--display)}
  .planv .legend{margin:0 0 16px}
  .cookw .toggle-row{font-size:14px}
}
@media (min-width:1024px) and (max-width:1279px) and (orientation:landscape){
  .cols{grid-template-columns:minmax(0,1fr) 340px}
}

/* ---------- v1 for liggende nettbrett og laptop (MacBook 13": ca. 1470 × 830 i nettleseren) ----------
   Én rad i toppfeltet, alt fungerer med trykk, og kortet i «Lag mat» står øverst uten rulling. */
.m-st{cursor:pointer;outline:none}
.m-st .hit{fill:transparent;stroke:none}
.m-st.sel circle:not(.hit){stroke:var(--now);stroke-width:4}
.m-st:focus-visible circle:not(.hit){stroke:var(--serve);stroke-width:4}
button.tc{font:inherit;border:0;cursor:pointer;min-height:44px}
.ts.sel{outline:3px solid var(--now);outline-offset:-1px}
.m-detail{margin:12px 0 0;border-radius:14px;padding:12px 14px;background:var(--ph-bg,var(--soft));color:var(--ink)}
.m-detail.empty{background:none;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;padding:10px 14px}
.m-detail-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.m-detail-h b{font-size:17px}
.m-detail p{margin:6px 0 0;font-size:15px}
.m-detail .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 2px;vertical-align:middle;line-height:1.3;background:var(--card);border-radius:6px;font-weight:600;white-space:nowrap}
.plansel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--card);padding:0 4px 0 14px;min-height:44px;font-size:14px}
.plansel span{color:var(--muted)}
.plansel select{font:600 14px/1 var(--body);color:var(--ink);background:none;border:0;min-height:42px;padding:0 6px;cursor:pointer}
.donefold{list-style:none;margin:0 0 4px}
.donefold > button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;min-height:44px;font-size:14px;color:var(--muted)}
.donefold .wsteps{margin-top:6px}
.skiprow{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;min-height:44px;border-top:1px solid var(--line);padding-top:8px}
.skiprow input{width:22px;height:22px;accent-color:var(--prep)}
@media (min-width:1024px) and (orientation:landscape){
  .wtop{padding:8px 32px}
  .wtop-in{grid-template-columns:auto minmax(120px,1fr) auto auto;gap:14px}
  .wtop .flow{grid-column:auto}
  .wtop .flow button{min-height:44px;padding:0 18px;font-size:15px}
  .wtop .flow .planbtn{margin-left:8px}
  .wtop .top-title{font-size:22px}
  .tools .stepper button{height:42px;width:42px}
  .tools .stepper span{min-width:64px}
  .aside{top:84px}
  .cols{margin-top:18px}
  .wcur{margin:0 0 12px;padding:16px 22px}
  .wcur h2{font-size:32px;margin:6px 0 6px}
  .wcur .txt{font-size:19px}
  .wsteps li.row button{min-height:44px}
  .seg button{min-height:40px}
  .planv .planhead{margin-top:18px}
}
@media (min-width:1024px) and (max-width:1279px) and (orientation:landscape){
  .wtop{padding:8px 20px}
  .app{padding-inline:20px}
  .wtop-in{gap:10px}
  .wtop .flow button{padding:0 12px;font-size:14px}
  .wtop .top-title{font-size:19px}
  .back{font-size:14px}
}

/* «Du trenger» i kortet på stor skjerm: kompakte rader, så kortet får plass i høyden. Mengdene står også i teksten. */
@media (min-width:1024px) and (orientation:landscape){
  .wcur .needs{display:grid;gap:4px;padding:10px 12px}
  .wcur .needs .tile{width:auto;display:grid;grid-template-columns:34px auto 1fr;align-items:center;gap:0 10px;text-align:left;justify-items:start}
  .wcur .needs .tile .ing-img{width:34px!important;height:34px!important;margin:0;font-size:14px}
  .wcur .needs .tile .ta{font-size:14px;white-space:nowrap}
  .wcur .needs .tile .tn{font-size:14px}
  .wcur .needs .tile .tn em{display:inline;margin-left:6px}
  .wcur .needbowl,.wcur .needres{font-size:14px}
  .wcur .needbowl .mini{display:none}
  .wcur .donebox{padding-top:8px;font-size:15px}
  .wcur .passbox{font-size:14px;padding-top:8px;margin-top:8px}
}

/* ---------- v2: Oversikt med fakta og ingredienser, Gjør klart i full bredde, visningsvalg i Lag mat ---------- */
.m-st circle.hit{fill:transparent!important;stroke:none!important}
.ts.cur{box-shadow:inset 0 0 0 3px var(--ink)}
.mv-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:4px 0 8px}
.mv-key span{display:inline-flex;align-items:center;gap:6px}
.mv-key i{width:14px;height:5px;border-radius:3px}
.mv-svg{display:block;width:100%;height:auto}
.mv-row{cursor:pointer;outline:none}
.mv-row rect{fill:transparent}
.mv-row:hover rect{fill:var(--soft)}
.mv-row.cur rect{fill:var(--soft);stroke:var(--line-strong)}
.mv-row.sel rect{stroke:var(--now);stroke-width:1.5}
.mv-row:focus-visible rect{stroke:var(--serve);stroke-width:2}
.mv-min{font:500 11px var(--mono);fill:var(--muted)}
.mv-lbl{font:14px var(--body);fill:var(--ink)}
.mv-row.cur .mv-lbl{font-weight:700}
.m-st.cur circle{stroke:var(--now);stroke-width:3.5}
.sidetabs{display:flex;width:100%;margin:14px 0 12px}
.sidetabs button{flex:1;min-height:40px;padding:4px 6px;font-size:13.5px}
.pside .tgrid{font-size:12px}
.pside .tscroll{margin:0 -4px}
.pnow .sec{margin:12px 0 6px}
.pnow .sec .eyebrow{text-align:right}
.cookw .skiprow{border-top:0;margin-top:6px}
.ovw .meta-col h1{font:400 38px/1.06 var(--display);margin:0 0 16px}
.mfacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.mfact{background:var(--soft);border-radius:12px;padding:10px 12px}
.mfact b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.mrow{border-top:1px solid var(--line);padding:12px 0}
.mrow p{margin:4px 0 0;font-size:15px}
.mrow .parts{margin:2px 0 0}
@media (min-width:1024px) and (orientation:landscape){
  .ovw .cols{grid-template-columns:360px minmax(0,1fr);gap:40px;margin-top:24px}
  .ovw .meta-col{position:sticky;top:84px}
  .ings2{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .ings2 li:last-child{border-bottom:1px solid var(--line)}
  .misew{max-width:1280px}
  .misew .bowlgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cookw .cols{grid-template-columns:minmax(0,1fr) 440px}
}
@media (min-width:1024px) and (max-width:1279px) and (orientation:landscape){
  .ovw .cols{grid-template-columns:300px minmax(0,1fr);gap:28px}
  .misew .bowlgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cookw .cols{grid-template-columns:minmax(0,1fr) 380px}
}

.tside .ti{position:sticky;left:0;z-index:1;box-shadow:4px 0 0 var(--card)}
.tside .th{position:sticky;left:0}

/* ---------- v3: «På benken» som fliser, og ett valgt steg på tvers av visningene ---------- */
.btile{background:var(--soft);border:1.5px dashed var(--line-strong)}
.btile .ta{color:var(--muted)}
.btile.ok{background:var(--prep-bg);border-style:solid;border-color:var(--prep)}
.pbox{display:none}
.pair section{min-width:0}
.tl-row[data-sel]{cursor:pointer}
.tl-row[data-sel]:hover{background:var(--soft)}
.tl-row.sel{outline:2px solid var(--now);outline-offset:-2px;border-radius:4px}
.tl-no{display:inline-block;min-width:1.6em;font:600 11px var(--mono);color:var(--muted)}
.ts .no{font:600 11px var(--mono);opacity:.7}
.mv-no{font:600 11px var(--mono);fill:var(--muted)}
.wsteps li.sel > button{outline:2px solid var(--now);outline-offset:-2px}
.wcur.sel{outline:2px solid var(--now);outline-offset:2px}
.m-detail .eyebrow{display:block;margin:4px 0 0}
.m-detail-h{align-items:center}
.sno{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 12px/1 var(--mono)}
.xbtn{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;width:44px;height:44px;color:var(--muted)}
.m-detail-a{margin-top:10px;display:flex;align-items:center;gap:10px}
.gobtn{min-height:44px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (min-width:1024px) and (orientation:landscape){
  .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 32px;align-items:start}
}
/* Utskrift (A4, stående): ingen faner eller knapper, og en tom rute på hver flis til å krysse av med penn. */
@media print{
  @page{size:A4;margin:12mm}
  :root{--paper:#fff;--card:#fff;color-scheme:light}
  body{background:#fff;font-size:10.5pt}
  .top,.wtop,.bar,.meter,.mise .hint[aria-live],.bowl .state{display:none!important}
  .app{max-width:none;padding:0}
  .mise h1{font-size:22pt;margin:0 0 4mm}
  .sec{margin:5mm 0 2mm}
  .sec h2{font-size:15pt}
  .bowlgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 4mm;align-items:start}
  .bowl{break-inside:avoid;margin:2mm 0;padding:3mm}
  .pair section{break-inside:avoid}
  .fetchgrid,.eqtiles{grid-template-columns:repeat(7,minmax(0,1fr));gap:3mm 2mm}
  .fetchgrid .tile,.eqtiles .tile{width:auto}
  .bowl .tile{width:72px}
  .ftile,.btile,.tile.eq{position:relative;padding-top:2mm}
  .pbox{display:block;position:absolute;top:0;right:1mm;width:3.5mm;height:3.5mm;border:.8pt solid #78716c;border-radius:.8mm}
  .btile{border-width:.8pt}
}

/* ---------- v4: meny oppe til høyre, ingredienser i kolonner, Gjør klart på én skjerm, justerbare kolonner og fullskjerm ---------- */
.wmenu{position:relative;justify-self:end}
.wmenu-btn{border:1px solid transparent;background:none;border-radius:12px;width:44px;height:44px;font-size:20px;color:var(--muted);line-height:1}
.wmenu-btn:hover,.wmenu-btn[aria-expanded="true"]{border-color:var(--line-strong);background:var(--card);color:var(--ink)}
.wsheet{position:absolute;right:0;top:52px;z-index:8;width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px 14px;box-shadow:0 12px 32px color-mix(in srgb,var(--ink) 16%,transparent)}
.ws-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ws-row:last-child{border-bottom:0}
.ws-row.col{display:block}
.ws-row.col .seg{margin-top:8px;display:flex}
.ws-row.col .seg button{flex:1}
.ings2{grid-auto-flow:column}
.ings2 li,.ings2 li:last-child{border-bottom:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start;margin-top:12px}
.mhead{margin-top:6px}
.mleft .meter{margin-top:0}
.mleft .bowlgrid{margin-top:10px}
.mright .sec{margin:12px 0 6px}
.mright section:first-child .sec{margin-top:6px}
.mright .fetchgrid,.mright .eqtiles{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px 4px}
.mright .tile{width:auto}
.mright .tile .ing-img{width:40px!important;height:40px!important}
.mright .eq-img{width:34px!important;height:34px!important}
.mright .tile .ta{font-size:13px}
.mright .tile .tn{font-size:12px}
.mright .ftile,.mright .tile.eq{padding:6px 2px}
.misew .bowl{padding:10px 12px 2px;margin:0 0 12px}
.misew .bowl small{margin:2px 0 4px}
.misew .bowl .tiles{gap:8px;margin:4px 0 8px}
.misew .bowl .tile{width:76px}
.misew .bowl .tile .ing-img{width:42px!important;height:42px!important}
.splitter{cursor:col-resize;display:grid;place-items:center;align-self:stretch;touch-action:none;border-radius:8px;outline:none}
.splitter span{width:4px;height:56px;border-radius:2px;background:var(--line-strong);position:sticky;top:45vh}
.splitter:hover span,.splitter.on span,.splitter:focus-visible span{background:var(--ink)}
.side-h{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.side-h .sidetabs{margin:0;flex:1}
.fsbtn{flex:none;width:44px;height:44px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);font-size:18px}
.fsv{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;grid-template-rows:auto 1fr}
.fsv-h{display:flex;align-items:center;gap:16px;padding:10px 32px;border-bottom:1px solid var(--line)}
.fsv-h .sidetabs{flex:0 1 420px;margin:0}
.fsv-at{flex:1;font-size:15px;color:var(--muted)}
.fsv-at b{color:var(--ink)}
.fsv-b{overflow:auto;padding:16px 32px 32px}
.fsv-b .legend{margin:0 0 12px}
.fsv-b .tl{min-width:0}
.fsv-b .m-detail{max-width:720px}
body.noscroll{overflow:hidden}
.m-lbl.cur{font-weight:700}
.m-st.cur circle:not(.hit){stroke:var(--now);stroke-width:4}
@media (min-width:1024px) and (orientation:landscape){
  .cookw .cols{gap:0}
  .cookw .aside{max-height:calc(100vh - 84px - var(--bar-h) - 12px);overflow:auto;padding-bottom:4px}
}
@media (min-width:1024px) and (max-width:1279px) and (orientation:landscape){
  .mgrid{grid-template-columns:minmax(0,1fr) 300px;gap:20px}
}

/* v4, runde 2: skålene som kompakte rader på liggende skjerm, så «Gjør klart» får plass på én skjerm */
@media (min-width:1024px) and (orientation:landscape){
  .misew .bowl .state{display:none}
  .misew .bowl.ok .state{display:inline}
  .misew .bowl .tiles{display:grid;gap:4px;margin:4px 0 8px}
  .misew .bowl .tile{width:auto;display:grid;grid-template-columns:36px auto 1fr;align-items:center;gap:0 10px;text-align:left;justify-items:start}
  .misew .bowl .tile .ing-img{width:36px!important;height:36px!important;margin:0}
  .misew .bowl .tile .ta{font-size:14px;white-space:nowrap}
  .misew .bowl .tile .tn{font-size:14px}
  .misew .bowl .tile .tn em{display:inline;margin-left:6px}
  .misew .bowl-h b{font-size:16px}
  .misew .bowlgrid{gap:0 12px}
}
.m-st.cur circle:not(.hit){stroke:var(--ink);stroke-width:4}
.m-st.sel circle:not(.hit){stroke:var(--now);stroke-width:4}
.wsheet{width:380px}
.ws-row.col .seg button{white-space:nowrap;font-size:13.5px}

/* ---------- skisser: bildekort med tegnede piler ---------- */
:root{--pencil:#4B4F49;--hand:"Caveat","Bradley Hand","Segoe Print",cursive}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pencil:#C9CEC4}}
:root[data-theme="dark"]{--pencil:#C9CEC4}
.hand{font-family:var(--hand);font-weight:700;letter-spacing:.01em}
.sk-top .wtop-in{grid-template-columns:auto 1fr auto}
.sk-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sk-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:18px 0 8px}
.sk-head h1{font-size:40px;line-height:1}
.sk-head p{margin:0;color:var(--muted);max-width:80ch}
.sk-paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px 36px;margin:0 auto 32px}
.sk-paper.side{max-width:460px}
.sk-paper.wide{max-width:1180px}
.skv{position:relative}
.sk-arrows{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.sk-arrows .pa{fill:none;stroke:var(--pencil);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sk-arrows .pa2{stroke-width:1.1;opacity:.35}
.sk-arrows .pl{font:700 17px var(--hand);fill:var(--pencil);paint-order:stroke;stroke:var(--card);stroke-width:5px}
.syms{display:flex;flex-wrap:wrap;gap:8px 10px}
.sk-ing{display:grid;justify-items:center;gap:1px;max-width:84px;text-align:center}
.sk-ing small{font:600 11.5px var(--mono);color:var(--ink);white-space:nowrap}
.sk-ing em{font-style:normal;font-size:11.5px;line-height:1.2;color:var(--muted)}
.kwh{font-size:19px;color:var(--ink);display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:6px;white-space:nowrap}
.chip.heat{background:color-mix(in srgb,var(--now) 14%,var(--card));color:var(--now)}
.chip.time{background:color-mix(in srgb,var(--serve) 14%,var(--card));color:var(--serve)}
.chip.wait{background:var(--soft);color:var(--muted)}
.sk-pile{position:relative;display:inline-flex;align-items:flex-end;min-height:44px}
.sk-pile .pl + .pl{margin-left:-14px}
.sk-pile .eq-img + .pl{margin-left:-10px}
/* B1 */
.b1-row{display:flex;flex-wrap:wrap;gap:22px 40px;margin:0 0 40px;align-items:flex-start}
.b1-row.zig{padding-left:64px}
.b1-card{flex:0 1 auto;max-width:100%}
.b1-row:last-child{margin-bottom:0}
.b1-card{position:relative;z-index:1;border-radius:18px 22px 16px 20px;padding:10px 14px 10px;background:var(--ph-bg);color:var(--ph-ink);transform:rotate(var(--tilt));box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.b1-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.b1-v{font-size:27px;line-height:1.05;color:var(--ink)}
.b1-grps{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
/* B2 */
.b2-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;margin-bottom:34px}
.b2-ings{display:grid;gap:12px;justify-items:start}
.b2-grp{display:flex;flex-wrap:wrap;gap:6px 10px;position:relative;z-index:1}
.b2-node{position:relative;z-index:1;justify-self:start;border:2px solid var(--ph);border-radius:20px 16px 22px 18px;padding:10px 14px;background:var(--card);display:grid;gap:4px;justify-items:start}
.b2-v{font-size:25px;line-height:1.05;color:var(--ink)}
.sk-paper.side .b2-row{gap:40px}
/* B3 */
.b3{display:grid;column-gap:0;row-gap:0}
.b3-h{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 14px}
.b3-h:nth-child(n+3),.b3-cell:not(.ings){border-left:1.5px dashed var(--line)}
.b3-cell{padding:10px 12px 22px;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.b3-cell.ings{justify-content:flex-start;flex-direction:column;gap:8px}
.b3-grp{display:flex;flex-wrap:wrap;gap:6px 8px;position:relative;z-index:1}
.b3-node{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;text-align:center}
.b3-v{font-size:21px;line-height:1.05;color:var(--ink)}
.b3-node .chips{justify-content:center}
.sk-paper.side .b3-v{font-size:17px}
.sk-paper.side .b3-cell{padding:8px 4px 18px}


/* sporoppsett for skissene */
.lanes{display:grid;column-gap:28px;row-gap:42px;align-items:start}
.ln-h{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1.5px dashed var(--line);margin-bottom:-18px}
.ln-c{min-width:0;display:flex;justify-content:center}
.lanes .b1-card{width:100%}
.b2-cell,.b3-cell2{display:flex;align-items:center;gap:44px;justify-content:center;width:100%}
.b2-ings,.b3-ings{display:grid;gap:10px;justify-items:end;flex:0 1 auto;min-width:0}
.b2-grp,.b3-grp{display:grid;justify-items:end;gap:2px;position:relative;z-index:1}
.b2-grp .syms,.b3-grp .syms{justify-content:flex-end;gap:6px 8px}
.b2-grp .kwh,.b3-grp .kwh{font-size:18px;margin:0}
.lanes .b2-node{flex:none;justify-self:auto}
.sk-paper.side .lanes{column-gap:14px}
.sk-paper.side .b2-v{font-size:21px}
.b3 .ln-h{text-align:center}

.chip.at{background:none;border:1px solid var(--line-strong);color:var(--muted)}
.b2-ings.many,.b3-ings.many{grid-template-columns:repeat(2,auto);column-gap:16px}

/* smale spor: ingrediensene over steget, til venstre, så pilen nedover har en fri gate langs høyre kant */
.lanes.stack .b2-cell,.lanes.stack .b3-cell2{flex-direction:column;align-items:stretch;gap:26px}
.lanes.stack .b2-ings,.lanes.stack .b3-ings{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px 12px;max-width:72%}
.lanes.stack .b2-grp,.lanes.stack .b3-grp{justify-items:start}
.lanes.stack .b2-grp .syms,.lanes.stack .b3-grp .syms{justify-content:flex-start}
.lanes.stack .b2-node,.lanes.stack .b3-node{width:100%;box-sizing:border-box}
.lanes.stack .b3-node{justify-items:start;text-align:left}
.lanes.stack .b3-node .chips{justify-content:flex-start}
.lanes.stack .sk-ing{max-width:70px}
.lanes.stack .sk-ing em{font-size:10.5px}

/* sidekolonnen: mindre bilder og steg, og ingen ingrediensnavn, så to spor får plass i 440 px */
.sk-paper.side{padding:18px 14px 28px}
.sk-paper.side .lanes{column-gap:12px;row-gap:34px}
.sk-paper.side .ln-c,.sk-paper.side .b2-cell,.sk-paper.side .b3-cell2,.sk-paper.side .b1-card{min-width:0}
.sk-paper.side .sk-ing em{display:none}
.sk-paper.side .sk-ing .ing-img{width:32px!important;height:32px!important}
.sk-paper.side .sk-ing small{font-size:10.5px}
.sk-paper.side .kwh{font-size:15px}
.sk-paper.side .b2-node,.sk-paper.side .b3-node{padding:7px 9px;min-width:0}
.sk-paper.side .b2-v,.sk-paper.side .b3-v,.sk-paper.side .b1-v{font-size:17px;overflow-wrap:anywhere}
.sk-paper.side .chip{font-size:10px;padding:3px 5px}
.sk-paper.side .sk-pile .ing-img{width:24px!important;height:24px!important}
.sk-paper.side .sk-pile .eq-img{width:28px!important;height:28px!important}
.sk-paper.side .b1-card{padding:8px 10px}
.sk-paper.side .ln-h{font-size:10.5px;letter-spacing:.06em}

/* stamme med greiner */
.trunk{display:grid;row-gap:30px}
.tr-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);column-gap:30px;align-items:start}
.tr-left{display:grid;gap:10px;justify-items:end;align-content:start;padding-top:6px}
.tr-br{position:relative;z-index:1;display:grid;justify-items:end;gap:2px;text-align:right}
.tr-brv{font-size:16px;color:var(--muted)}
.tr-br .syms{justify-content:flex-end;gap:4px 6px}
.tr-br .kwh{font-size:15px}
.tr-rem{font-size:12.5px;line-height:1.3;color:var(--ink);background:color-mix(in srgb,var(--now) 9%,var(--card));border:1.5px dashed color-mix(in srgb,var(--now) 45%,transparent);border-radius:10px 12px 10px 14px;padding:6px 8px;text-align:right;transform:rotate(-1deg)}
.tr-rem b{font:600 11px var(--mono);color:var(--now);display:block}
.tr-rem.setup{background:var(--soft);border-color:var(--line-strong)}
.tr-rem.setup b{color:var(--muted)}
.tr-node{position:relative;z-index:1;border:2px solid var(--ph);border-radius:16px 20px 14px 18px;padding:8px 10px 8px;background:var(--card);display:grid;gap:3px;min-width:0}
.tr-node.card{background:var(--ph-bg);border:0;transform:rotate(-.5deg)}
.tr-node.moved{border-style:dashed}
.tr-h{display:flex;align-items:center;gap:6px}
.tr-no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ph);color:#fff;font:600 11px var(--mono);flex:none}
.tr-v{font-size:20px;line-height:1.05;color:var(--ink)}
.tr-grp{display:grid;gap:1px}
.tr-grp .kwh{font-size:15px}
.tr-node .syms{gap:4px 6px}
.tr-in{font-size:12px;color:var(--muted)}
.tr-in b{font:600 11px var(--mono);color:var(--ink)}
.chip.moved{background:color-mix(in srgb,var(--now) 12%,var(--card));color:var(--now)}
.sk-arrows .pa.seq{stroke-dasharray:2 5;stroke-width:1.6;opacity:.6}
.trunk .sk-ing em{display:none}
.trunk .sk-ing small{font-size:10.5px}
.trunk .sk-pile .ing-img{width:22px!important;height:22px!important}
.trunk .sk-pile .eq-img{width:26px!important;height:26px!important}
.sk-paper.wide .trunk{max-width:640px;margin:0 auto}

/* ---------- minimalisme ---------- */
.mn-v{font-size:24px;line-height:1;color:var(--ink)}
.mn-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn-syms{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px}
.mn-ing{display:grid;justify-items:center;gap:1px}
.mn-ing small{font:500 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.mn-ing .ing-img{border:0;background:none}
.mn-heat{display:inline-flex;gap:1px;align-self:center}
.mn-heat svg{width:8px;height:11px;fill:var(--cook)}
.mn-temp,.mn-wait{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.mn-wait{color:var(--serve)}
.mn-from{font:500 11px var(--mono);color:var(--muted)}
.mn-no{font:500 11px var(--mono);color:var(--line-strong)}
.mn-br{display:grid;gap:4px;justify-items:end;position:relative;z-index:1}
.mn-bg{display:grid;justify-items:end;gap:0}
.mn-kw{font-size:16px;color:var(--muted);line-height:1}
.mn-br .mn-syms{justify-content:flex-end;gap:4px 6px}
.mn-rem{font:500 11.5px var(--body);color:var(--now);text-align:right}
.mn-rem.setup{color:var(--muted)}
.sk-arrows .pa.thread{stroke-width:2.2;opacity:.75}
/* M1 */
.m1{display:grid;row-gap:26px}
.m1-row{display:grid;grid-template-columns:minmax(0,120px) 26px minmax(0,1fr);column-gap:12px;align-items:start}
.m1-left{display:grid;gap:8px;justify-items:end}
.m1-dot{position:relative;z-index:1;display:grid;justify-items:center;padding-top:6px}
.m1-dot i{width:13px;height:13px;border-radius:50%;background:var(--ph);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--ph)}
.m1-dot.ph-prep i{background:var(--card)}
.m1-dot.parked i{background:var(--card);box-shadow:0 0 0 1.5px var(--serve)}
.m1-dot small{font:500 10px var(--mono);color:var(--line-strong);margin-top:2px}
/* M2 */
.m2{display:grid;row-gap:28px}
.m2-row{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);column-gap:26px;align-items:start}
.m2-left{display:grid;gap:10px;justify-items:end}
.m2-bowl{position:relative;z-index:1;display:grid;justify-items:center;text-align:center;padding:0 6px}
.m2-bowl .mn-head{justify-content:center}
.m2-bowl .mn-syms{justify-content:center;margin-top:6px}
.mn-bowl{display:block;width:100%;height:14px;margin-top:-2px}
.mn-bowl path{fill:none;stroke:var(--ph,var(--pencil));stroke-width:2;stroke-linecap:round}
.m2-sb{justify-items:center}
.m2-sb .mn-bowl{width:90%;height:10px}
.m2-sb .mn-bowl path{stroke:var(--line-strong)}
.m2-bowl.parked .mn-bowl path{stroke-dasharray:4 4}
.mn-empty{display:block;height:8px}
/* M3 */
.m3{display:grid}
.m3-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:14px;align-items:start;margin-top:-6px}
.m3-row.r{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.m3-row + .m3-row{margin-top:18px}
.m3-item{position:relative;z-index:1;padding:4px 2px}
.m3-row.r .m3-item{text-align:right}
.m3-row.r .m3-item .mn-head,.m3-row.r .m3-item .mn-syms{justify-content:flex-end}
.m3-extra{display:grid;gap:8px;align-content:start;padding-top:22px}
.m3-row.l .m3-extra{justify-items:start}
.m3-row.l .m3-extra .mn-br,.m3-row.l .m3-extra .mn-bg{justify-items:start}
.m3-row.l .m3-extra .mn-syms{justify-content:flex-start}
.m3-row.l .m3-extra .mn-rem{text-align:left}

.m3-row,.m3-row + .m3-row{margin-top:0}
.m3{row-gap:26px}
.m3-item{justify-self:start;max-width:100%}
.m3-row.r .m3-item{justify-self:end}

/* T1–T3 */
.t-row{display:grid;grid-template-columns:minmax(0,120px) 26px minmax(0,1fr);column-gap:calc(12px + var(--gut));align-items:start}
.t-row.nob{grid-template-columns:26px minmax(0,1fr);column-gap:calc(14px + var(--gut))}
.t-remtop{grid-column:2;grid-row:1;justify-self:start;margin:-14px 0 2px}
.t-row.nob .t-remtop{grid-column:2}
.t-row.nob .m1-dot{grid-column:1;grid-row:1 / span 2}
.t-row.nob .m1-body{grid-column:2}
.tn-in{display:grid;justify-items:center;gap:0;opacity:.55;filter:grayscale(.35)}
.tn-in small{font-size:13px;color:var(--muted);line-height:1}
.mn-ing em{font-style:normal;font-size:14px;color:var(--muted);line-height:1}
.sk-arrows .pa.track{stroke-width:1.5;opacity:.55;stroke-linejoin:round}
.m1 .m1-dot small{display:none}

/* ---------- T1/T3 runde 2: grener med fast oppsett, ett ikonspråk i blyant, ord for innløp ---------- */
.t-row{grid-template-columns:minmax(0,150px) 22px minmax(0,1fr);column-gap:28px}
.t-row.nob{grid-template-columns:22px minmax(0,1fr);column-gap:16px}
.m1-left{justify-items:end}
.brn{display:grid;gap:6px;justify-items:start;position:relative;z-index:1}
.brn-g{display:grid;gap:1px;justify-items:start}
.brn-kw{font-size:16px;line-height:1.05;color:var(--muted)}
.brn-pics{display:grid;grid-template-columns:repeat(3,auto);gap:4px 8px;justify-content:start}
.brn.big .brn-pics{grid-template-columns:repeat(4,auto);gap:2px 5px}
.brn.big .mn-ing small{font-size:9.5px}
/* faser vises med formen på punktet, ikke farge */
.m1-dot i{width:12px;height:12px;border-radius:50%;box-shadow:none;border:2px solid var(--pencil);background:var(--card)}
.m1-dot.ph-cook i{background:var(--pencil)}
.m1-dot.ph-serve i{background:var(--card);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--pencil)}
.m1-dot.ph-prep i{background:var(--card)}
.m1-dot.parked i{border-style:dashed}
.sk-arrows .pa.thread{stroke:var(--pencil);opacity:.65}
.mn-heat{display:inline-flex;align-self:center;margin-left:2px}
.ic-heat{width:22px;height:17px;fill:none;stroke-linecap:round;stroke-width:2}
.ic-heat .on{stroke:var(--cook)}
.ic-heat .off{stroke:var(--line-strong);opacity:.6}
.ic-heat .pl-ring{stroke:var(--pencil)}
.ic-glass{width:11px;height:14px;fill:none;stroke:var(--pencil);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.mn-wait{display:inline-flex;align-items:center;gap:3px;color:var(--pencil);font:inherit}
.mn-wait .hand,.mn-temp{font-size:16px;color:var(--pencil);font-family:var(--hand);font-weight:700}
.mn-rem{display:inline-flex;align-items:center;gap:5px;color:var(--pencil);font-size:15px;text-align:right}
.mn-rem .hand{font-size:15px}
.mn-rem.setup{color:var(--muted)}
.tn-word{font-size:15px;color:var(--muted);white-space:nowrap}
.mn-head{column-gap:10px}

.m1-dot.parked i{box-shadow:none;border-style:solid;outline:1.5px dashed var(--pencil);outline-offset:2px}
.m1-dot.ph-cook.parked i{background:var(--pencil)}
.mn-heat .ic-heat{width:22px;height:17px;fill:none}

/* G1 */
.g1-row{grid-template-columns:minmax(0,170px) 22px minmax(0,1fr)}
.chn{display:grid;gap:8px;position:relative;z-index:1;justify-items:end;padding-right:2px}
.chn::after{content:"";position:absolute;right:6px;top:12px;bottom:12px;width:2px;background:var(--pencil);opacity:.5;border-radius:1px;z-index:-1}
.chn-step{display:grid;grid-template-columns:minmax(0,1fr) 14px;column-gap:8px;align-items:start}
.chn-b{display:grid;justify-items:end;text-align:right}
.chn-h{display:flex;align-items:baseline;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.chn-v{font-size:17px;line-height:1.05;color:var(--ink)}
.chn-pics{display:flex;flex-wrap:wrap;gap:3px 6px;justify-content:flex-end;max-width:140px}
.chn-pics .mn-ing small{font-size:9.5px}
.chn-pics .mn-ing em{font-size:12px}
.chn-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--pencil);background:var(--card);margin-top:5px;justify-self:center}
.chn-dot.ph-cook{background:var(--pencil)}
.g1 .m1-left{gap:14px}
/* G2 */
.g2{display:grid;column-gap:14px;row-gap:46px;align-items:end;overflow-x:auto;padding:4px 2px 8px}
.g2-cell{display:flex;justify-content:center;min-width:0}
.g2-node{position:relative;z-index:1;display:grid;justify-items:center;text-align:center;gap:2px;padding:4px 6px}
.g2-node .mn-head{justify-content:center}
.g2-node.main .mn-v{font-size:27px}
.g2-pics{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;max-width:190px}
.g2-pics .mn-ing em{font-size:13px}
.g2-note{font-size:14px;color:var(--muted)}
.sk-paper.wide:has(.g2){max-width:1280px}

/* G2-varianter */
.g2-no{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;border:1.3px solid var(--pencil);font:600 10.5px/1 var(--mono);color:var(--pencil);align-self:center;margin-right:2px}
.g2.compact{display:grid;row-gap:46px;align-items:end;overflow:visible}
.g2-cell.abs{grid-column:1;justify-self:start;display:flex;justify-content:center}
.g2.compact .g2-pics{max-width:160px}

/* +F */
.fx.horiz{display:grid;column-gap:44px;width:max-content;row-gap:16px;align-items:center;justify-items:center;padding:4px}
.fx.vert{row-gap:40px}
.fx-head{flex-wrap:wrap;justify-content:center;row-gap:0}
.fx-arrow{font-family:var(--hand);color:var(--muted);font-size:18px}
.fx.horiz .g2-pics{max-width:170px}
.fx .mn-v{font-size:22px}
.fx .g2-node.main .mn-v{font-size:24px}
.fx-scale{position:absolute;right:20px;top:10px;font-size:15px;color:var(--muted)}
.sk-paper{position:relative}
.sk-paper.wide:has(.fx.horiz){max-width:none;padding:18px 20px 22px;overflow:hidden}

/* rekkefølgenumre og ferdig-markering */
.fx-seg{display:inline-flex;align-items:baseline;gap:6px;transition:opacity .2s}
.fx-no{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 2px;border-radius:50%;border:1.2px solid var(--line-strong);font:600 10px/1 var(--mono);color:var(--muted);align-self:center;box-sizing:border-box}
.fx-no:hover{border-color:var(--pencil);color:var(--ink)}
.fx-no:focus-visible{outline:2px solid var(--serve);outline-offset:2px}
.fx-no.ok{background:var(--pencil);border-color:var(--pencil);color:var(--card);font-size:10px}
.fx-no::before{content:"";position:absolute;inset:-12px}
.fx-no{position:relative}
.fx-seg.done .mn-v{text-decoration:line-through;text-decoration-color:var(--line-strong);color:var(--muted)}
.g2-node.done{opacity:.38}
.g2-node.done .fx-no{opacity:1}
.sk-paper.tall{max-width:980px}
.sk-head .lnk{padding:0;font-size:inherit}
/* utskrift */
body.printmode .sk-top,body.printmode .sk-head p,body.printmode .fx-scale{display:none}
body.printmode .sk-head{margin:0 0 4px}
body.printmode .sk-head h1{font-size:30px}
body.printmode .app{padding:0;max-width:none;margin:0}
body.printmode .sk-paper{border:0;padding:0;margin:0;max-width:none;border-radius:0;background:none}
@media print{.sk-paper,.dl-wrap{overflow:hidden!important}.sk-top,.sk-head p,.fx-scale{display:none!important}.sk-paper{border:0!important;padding:0!important;margin:0!important}.fx-no{border-color:#999}}

/* Elvedeltaet på nettbrett og A4 stående: hele bredden, ikke mobilkolonnen */
@media (min-width:700px){
  .app.sk{max-width:1280px;padding-inline:28px}
  .sk-top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 28px}
  .sk-top .wtop-in{max-width:1216px;margin:0 auto;display:grid;align-items:center;gap:10px 18px}
  .sk-top .top-title{font:400 24px/1.15 var(--display);white-space:nowrap}
  .sk-paper.tall{max-width:none}
}
.fx-seg .fx-arrow{margin-right:2px}
.fx .fx-seg .mn-v{white-space:nowrap}

/* en brettet blanding står samlet i et felt */
.fx-bowl{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px 5px;margin:0 2px 4px;max-width:262px;position:relative}
/* Felt: en svak, avrundet flate bak det som er blandet sammen */
.fx-bowl{background:color-mix(in srgb,var(--pencil) 8%,transparent);border-radius:14px;padding:6px 10px 5px}
@media (prefers-color-scheme: light){.fx-bowl img{mix-blend-mode:multiply}}
.fx-bowl .mn-ing small{font-size:10px}
.fx.horiz .g2-pics:has(.fx-bowl){max-width:220px}
/* kjeden brytes mellom stegene, aldri inne i et steg */
.fx.horiz .fx-head{max-width:200px;min-width:min-content}
.fx-seg{flex-shrink:0}

/* elvedeltaet i oversikten og i sidekolonnen */
.dl-wrap{position:relative;overflow:hidden;padding:4px 0}
.ovw .sec .seg button{min-height:30px;padding:3px 12px;font-size:13px}
.dl-wrap.side{overflow:auto;max-height:calc(100vh - 380px);min-height:320px;margin:0 -8px;padding:4px 8px;overscroll-behavior:contain}
.ovw-delta{margin:20px 0 8px}
.ovw-delta .sec{margin:0 0 6px}
.ovw-delta h2{font:400 30px/1.1 var(--display)}
@media (prefers-color-scheme: light){.g2-node.cur img{mix-blend-mode:multiply}}
.dl-wrap .fx-scale{right:0;top:-2px}
.prow{display:flex;gap:6px;align-items:baseline;margin:0}
.prow .lnk{padding:0;font-size:inherit}
.fx-seg.cur .mn-v{color:var(--ink);text-decoration:underline;text-decoration-color:var(--serve);text-decoration-thickness:3px;text-underline-offset:4px}
.g2-node.cur{background:color-mix(in srgb,var(--serve) 7%,transparent);border-radius:16px;box-shadow:0 0 0 6px color-mix(in srgb,var(--serve) 7%,transparent)}
.fsv-b .dl-wrap{overflow:visible}

.pblock{position:sticky;top:0;z-index:6;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--serve-bg);color:var(--serve-ink);border-bottom:1px solid var(--line)}
.pblock p{margin:0;max-width:80ch}
@media print{.pblock{display:none!important}}
body.printmode{background:#e9e7e2}
body.printmode .app.sk{background:#fff;margin:16px auto;padding:10mm;box-sizing:content-box;box-shadow:0 1px 6px rgba(0,0,0,.12)}
@media print{body.printmode{background:#fff}body.printmode .app.sk{margin:0;padding:0;box-shadow:none}}
.fx-also{color:var(--ink)}
.fx-ref{display:inline-grid;place-items:center;min-width:15px;height:15px;border-radius:50%;border:1.2px solid var(--line-strong);font:600 9px/1 var(--mono);color:var(--muted);vertical-align:1px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- datamodell ---------- */
const I=(id,c,name,amount,unit,prep,pl,x)=>Object.assign({id,c,name,amount,unit:unit||null,prep:prep||null,pl:pl||null},x||{});
const S=o=>Object.assign({phase:'prep',uses:[],after:[],waits:[],active:0,passive:0},o);
const OVN={id:'ovn',name:'Ovnen'};
const OVEN=(temp,mode,text)=>S({id:'ov',c:'ovn',phase:'cook',setup:true,short:'Forvarm ovnen',text,active:1,passive:14,eq:'oven',temp,mode,done:'Ovnen har nådd temperaturen'});

const carbonara=()=>({id:'r1',no:1,title:'Spaghetti carbonara',base:4,
 why:'Kort rett der alt avgjøres de siste to minuttene. Tester ingrediensformer (egg og eggeplommer), en ingrediens som deles mellom to steg (pecorino) og et biprodukt som brukes senere (pastavannet).',
 comps:[{id:'c1',name:'Carbonara'}],
 ings:[
  I('sp','c1','spaghetti',400,'g'),
  I('gu','c1','guanciale eller pancetta',150,'g','i staver'),
  I('eg','c1','egg',2,'stk','hele','egg'),
  I('ey','c1','eggeplomme',4,'stk',null,'eggeplommer',{buy:['egg','egg',1,'eggehvite','eggehviter']}),
  I('pe1','c1','pecorino romano',60,'g','finrevet'),
  I('pe2','c1','pecorino romano',20,'g','finrevet'),
  I('pp','c1','sort pepper',1.5,'ts','grovkvernet'),
  I('va','c1','vann',3,'l'),
  I('sa','c1','salt',1,'ss','til kokevannet')],
 steps:[
  S({id:'w',c:'c1',phase:'cook',setup:true,short:'Kok opp vann',text:'Kok opp {va} i en stor kjele og tilsett {sa}.',uses:['va','sa'],active:1,passive:10,eq:'large_pot',mode:'high',done:'Vannet fosskoker',out:'det kokende vannet',hold:30}),
  S({id:'e2',tools:['bowl','whisk','grater'],c:'c1',short:'Pisk eggeblandingen',text:'Pisk sammen {eg}, {ey}, {pe1} og {pp} i en bolle til en tykk krem.',uses:['eg','ey','pe1','pp'],active:3,done:'Tykk og jevn, uten klumper av ost',out:'eggeblandingen',hold:30}),
  S({id:'g1',c:'c1',short:'Skjær guancialen',text:'Skjær {gu} i staver på ca. 1 cm.',uses:['gu'],active:3,out:'guancialen',hold:120}),
  S({id:'g2',c:'c1',phase:'cook',short:'Stek guancialen',text:'Legg {g1} i en kald, stor stekepanne og stek på middels varme til fettet har smeltet. Ta panna av varmen.',after:['g1'],active:4,passive:6,eq:'frying_pan',mode:'medium',done:'Bitene er gylne og sprø, og det ligger blankt fett i panna',out:'guancialen og fettet',hold:10}),
  S({id:'p1',c:'c1',phase:'cook',short:'Kok pastaen',text:'Kok {sp} i {w}, ett minutt kortere enn pakken sier.',uses:['sp'],after:['w'],active:1,passive:9,timer:9,eq:'large_pot',mode:'high',done:'Al dente: myk ytterst, fast kjerne',out:'pastaen',hold:1}),
  S({id:'p2',tools:['ladle','colander'],c:'c1',phase:'cook',short:'Ta av pastavann',text:'Øs opp 2 dl av vannet pastaen har kokt i, og hell av resten.',after:['p1'],active:1,out:'pastavannet',hold:10}),
  S({id:'t1',c:'c1',phase:'cook',short:'Vend pastaen i fettet',text:'Ha {p1} rett over i panna med {g2}. Vend den rundt utenfor varmen i et halvt minutt, så panna kjøler seg litt.',after:['p2','g2'],active:1,eq:'frying_pan',mode:'off',out:'pastaen'}),
  S({id:'t2',tools:['tongs'],c:'c1',phase:'cook',short:'Rør inn eggeblandingen',text:'Hell {e2} over {t1} og rør raskt. Spe med {p2}, en skvett om gangen, til sausen er kremet.',after:['t1','e2'],active:2,eq:'frying_pan',mode:'off',done:'Sausen er blank og legger seg rundt pastaen. Blir den kornete, var panna for varm',out:'carbonaraen',hold:2}),
  S({id:'end',c:'c1',phase:'serve',short:'Server',text:'Server {t2} med en gang, toppet med {pe2} og mer pepper.',uses:['pe2'],after:['t2'],active:1})]});

const brownies=()=>({id:'r2',no:2,title:'Brownies',base:1,fixed:'Én form på 20 × 20 cm, 16 biter. Skaleres ikke.',
 why:'Baking med nøyaktige gram og én lang steking, og retten tabellmetoden ble laget for. Smeltingen er cook, så prep kommer både før og etter varme.',
 comps:[{id:'c1',name:'Brownies'},OVN],
 ings:[
  I('sm','c1','smør',150,'g','i terninger'),
  I('sj','c1','mørk sjokolade',200,'g','grovhakket'),
  I('su','c1','sukker',250,'g'),
  I('va','c1','vaniljesukker',1,'ts'),
  I('eg','c1','egg',3,'stk',null,'egg'),
  I('me','c1','hvetemel',100,'g'),
  I('ka','c1','kakao',30,'g'),
  I('sa','c1','salt',0.25,'ts'),
  I('no','c1','valnøtter',75,'g','grovhakket')],
 steps:[
  OVEN(175,'top_bottom','Sett ovnen på 175 °C over- og undervarme, med rist midt i ovnen.'),
  S({id:'f0',tools:['form_20x20'],c:'c1',short:'Kle formen',text:'Kle en form på 20 × 20 cm med bakepapir.',active:2,hold:1440}),
  S({id:'d1',tools:['sieve','bowl'],c:'c1',short:'Sikt det tørre',text:'Sikt sammen {me}, {ka} og {sa} i en bolle.',uses:['me','ka','sa'],active:2,out:'melblandingen',hold:1440}),
  S({id:'n1',c:'c1',short:'Hakk nøttene',text:'Grovhakk {no}.',uses:['no'],active:2,out:'nøttene',hold:1440}),
  S({id:'s1',c:'c1',phase:'cook',short:'Smelt smør og sjokolade',text:'Smelt {sm} og {sj} i en kjele på lav varme. Rør til blandingen er blank, ta den av varmen og la den kjøle seg i 5 minutter.',uses:['sm','sj'],active:5,passive:5,eq:'saucepan',mode:'low',done:'Blank og jevn, og lunken når du kjenner på kjelen',out:'sjokoladesmøret',hold:20}),
  S({id:'s2',tools:['whisk'],c:'c1',short:'Pisk inn sukker og egg',text:'Pisk {su} og {va} inn i {s1}. Pisk så inn {eg}, ett om gangen.',uses:['su','va','eg'],after:['s1'],active:4,done:'Røren er blank og slipper kanten av kjelen',out:'sjokoladerøren',hold:15}),
  S({id:'s3',tools:['spatula'],c:'c1',short:'Vend inn det tørre',text:'Vend {d1} og {n1} inn i {s2} med en slikkepott. Stopp så fort du ikke ser mer mel.',after:['s2','d1','n1'],active:2,done:'Ingen melstriper. Ikke rør mer enn nødvendig',out:'røren',hold:10}),
  S({id:'s4',tools:['form_20x20'],c:'c1',phase:'cook',short:'Stek',text:'Hell {s3} i formen og stek midt i ovnen i 25–30 minutter.',after:['s3'],waits:['ov','f0'],active:2,passive:27,timer:25,eq:'oven',temp:175,mode:'top_bottom',excl:true,done:'Skorpen er matt og sprukket. En pinne i midten kommer ut med fuktige smuler, ikke flytende røre',out:'brownien'}),
  S({id:'s5',tools:['rack'],c:'c1',phase:'cook',short:'Avkjøl',text:'La {s4} bli helt kald i formen, minst 1 time.',after:['s4'],passive:60,timer:60,hold:2880,done:'Formen er kald på undersiden',out:'brownien'}),
  S({id:'end',c:'c1',phase:'serve',short:'Skjær i biter',text:'Løft {s5} ut etter bakepapiret og skjær i 16 biter.',after:['s5'],active:3})]});

const tikka=()=>({id:'r3',no:3,title:'Kylling tikka masala med ris',base:4,
 why:'Marinaden skal stå minst en time og tåler et døgn. Mange krydder i små mål, og hvitløk, ingefær og krydder deles mellom marinade og saus.',
 comps:[{id:'c1',name:'Tikka masala'},{id:'ri',name:'Ris'},OVN],
 ings:[
  I('ky','c1','kyllinglårfilet',700,'g','biter à 3 cm'),
  I('yo','c1','gresk yoghurt',1.5,'dl'),
  I('si','c1','sitron',0.5,'stk','saften'),
  I('hv1','c1','hvitløk',2,'fedd','finrevet'),
  I('hv2','c1','hvitløk',3,'fedd','finrevet'),
  I('in1','c1','ingefær',2,'cm','finrevet'),
  I('in2','c1','ingefær',2,'cm','finrevet'),
  I('gm1','c1','garam masala',1,'ss'),
  I('gm2','c1','garam masala',1,'ss'),
  I('pa1','c1','paprikapulver',1,'ts'),
  I('pa2','c1','paprikapulver',1,'ts'),
  I('gu','c1','gurkemeie',1,'ts'),
  I('sp','c1','malt spisskummen',2,'ts'),
  I('ch','c1','chilipulver',0.5,'ts'),
  I('sa1','c1','salt',0.5,'ts'),
  I('sa2','c1','salt',1,'ts'),
  I('lo','c1','løk',1,'stk','finhakket','løk'),
  I('sm','c1','smør',2,'ss'),
  I('ol','c1','nøytral olje',1,'ss'),
  I('tp','c1','tomatpuré',1,'ss'),
  I('to','c1','hermetiske tomater',400,'g','knuste'),
  I('fl','c1','kremfløte',2,'dl'),
  I('sk','c1','sukker',1,'ts'),
  I('ko','c1','frisk koriander',1,'håndfull','grovhakket'),
  I('rr','ri','basmatiris',3,'dl'),
  I('va','ri','vann',4.5,'dl'),
  I('rs','ri','salt',0.5,'ts')],
 steps:[
  OVEN(250,'grill','Sett ovnen på 250 °C grillelement, med rist øverst.'),
  S({id:'m1',tools:['bowl','grater'],c:'c1',short:'Rør marinaden',text:'Rør sammen {yo}, {hv1}, {in1}, {gm1}, {pa1}, {gu}, saften av {si} og {sa1}.',uses:['yo','hv1','in1','gm1','pa1','gu','si','sa1'],active:4,out:'marinaden',hold:60}),
  S({id:'m2',c:'c1',short:'Mariner kyllingen',text:'Skjær {ky} i biter på 3 cm og vend dem i {m1}. Sett kaldt.',uses:['ky'],after:['m1'],active:6,passive:60,hold:1380,timer:60,done:'Minst 1 time, gjerne over natten',out:'kyllingen'}),
  S({id:'s1',c:'c1',short:'Hakk løken',text:'Finhakk {lo}.',uses:['lo'],active:3,out:'løken',hold:120}),
  S({id:'s0',tools:['small_bowl'],c:'c1',short:'Bland krydderet',text:'Bland {gm2}, {sp}, {pa2}, {ch} og {sa2} i en liten skål.',uses:['gm2','sp','pa2','ch','sa2'],active:2,out:'krydderblandingen',hold:1440}),
  S({id:'k1',c:'c1',short:'Hakk korianderen',text:'Grovhakk {ko}.',uses:['ko'],active:1,out:'korianderen',hold:60}),
  S({id:'r1',tools:['sieve'],c:'ri',short:'Skyll risen',text:'Skyll {rr} i kaldt vann til vannet er nesten klart.',uses:['rr'],active:2,done:'Vannet er nesten klart',out:'risen',hold:60}),
  S({id:'m3',tools:['baking_tray','rack'],c:'c1',phase:'cook',short:'Grill kyllingen',text:'Legg {m2} på en rist over et stekebrett og grill øverst i ovnen i 10–12 minutter. Snu bitene halvveis.',after:['m2'],waits:['ov'],active:3,passive:9,timer:11,eq:'oven',temp:250,mode:'grill',excl:true,done:'Svidde kanter, og 75 °C i kjernen',out:'kyllingen',hold:15}),
  S({id:'s2',c:'c1',phase:'cook',short:'Fres løken',text:'Smelt {sm} med {ol} i en vid kjele på middels varme. Fres {s1} til den er myk.',uses:['sm','ol'],after:['s1'],active:8,eq:'wide_pot',mode:'medium',done:'Myk og gyllen i kantene, ikke brun',out:'løken'}),
  S({id:'s3a',c:'c1',phase:'cook',short:'Fres hvitløk og ingefær',text:'Tilsett {hv2} og {in2} og fres i ett minutt.',uses:['hv2','in2'],after:['s2'],active:1,eq:'wide_pot',mode:'medium',done:'Det dufter, men har ikke tatt farge',out:'løken'}),
  S({id:'s3',c:'c1',phase:'cook',short:'Fres krydderet',text:'Rør inn {s0} og {tp} og fres i ett minutt.',uses:['tp'],after:['s3a','s0'],active:1,eq:'wide_pot',mode:'medium',done:'Det lukter sterkt av krydder, og bunnen er så vidt tørr',out:'krydderbasen'}),
  S({id:'s4',c:'c1',phase:'cook',short:'Kok sausen',text:'Ha i {to}, {fl} og {sk}. La sausen småkoke uten lokk i 15 minutter, og rør av og til.',uses:['to','fl','sk'],after:['s3'],active:2,passive:13,timer:15,eq:'wide_pot',mode:'low',done:'Tykk nok til å dekke baksiden av en skje',out:'sausen',hold:30}),
  S({id:'s5',c:'c1',phase:'cook',short:'Kyllingen i sausen',text:'Vend {m3} inn i {s4} og la det trekke på lav varme i 5 minutter.',after:['s4','m3'],active:1,passive:4,eq:'wide_pot',mode:'low',out:'tikka masalaen',hold:20}),
  S({id:'r2',c:'ri',phase:'cook',short:'Kok risen',text:'Kok opp {r1} med {va} og {rs} under lokk. Skru ned til laveste varme og la den stå i 12 minutter.',uses:['va','rs'],after:['r1'],active:3,passive:12,timer:12,eq:'saucepan',mode:'low',done:'Alt vannet er trukket inn',out:'risen'}),
  S({id:'r3',c:'ri',phase:'cook',short:'La risen dampe',text:'Ta kjelen av platen og la {r2} stå under lokk i 10 minutter.',after:['r2'],passive:10,timer:10,hold:20,out:'risen'}),
  S({id:'end',c:'c1',phase:'serve',short:'Server',text:'Luft {r3} med en gaffel. Server {s5} over risen, toppet med {k1}.',after:['s5','r3','k1'],active:3})]});

const lasagne=()=>({id:'r4',no:4,title:'Lasagne',base:4,
 why:'Komponentene møtes i formen, ikke på tallerkenen, og fortsetter som én ting i ovnen. Fasene kommer som cook, prep, cook, serve. Den grønne salaten viser forskjellen på planstrategiene: lages den først, eller mens lasagnen står i ovnen?',

function validate(r){
  const err=[],ids=new Set(),used={};
  [...r.ings,...r.steps].forEach(x=>{if(ids.has(x.id))err.push('dupl '+x.id);ids.add(x.id);});
  r.steps.forEach(s=>{
    s.use.forEach(u=>{if(!r.ib[u.id])err.push(s.id+' uses '+u.id);used[u.id]=(used[u.id]||0)+u.p;});
    [...s.after,...s.waits].forEach(a=>{if(!r.sb[a])err.push(s.id+' after '+a);});
    (s.text.match(/\{(\w+)\}/g)||[]).forEach(m=>{const id=m.slice(1,-1);if(!r.ib[id]&&!r.sb[id])err.push(s.id+' text '+id);if(r.ib[id]&&!(id in s.pm))err.push(s.id+' nevner '+id+' uten uses');});
    if(!r.cb[s.c])err.push(s.id+' comp '+s.c);
  });
  r.ings.forEach(i=>{if(Math.abs((used[i.id]||0)-1)>0.02)err.push(i.id+' brukt '+(used[i.id]||0));if(!r.cb[i.c])err.push(i.id+' comp '+i.c);});
  /* Mise-elementer: hver linje unntatt basisvarer har et element, hvert element brukes, og linjene møtes før de brukes. */
  const upstream=id=>{const seen=new Set();const go=x=>{if(seen.has(x))return;seen.add(x);(r.sb[x]?.after||[]).forEach(go);};go(id);return seen;};
  const usedBy={};r.steps.forEach(s=>s.uses.forEach(u=>usedBy[u]=s.id));
  r.ings.forEach(i=>{if(!i.m)err.push(i.id+' mangler mise-element');});
  r.mise.forEach(e=>{if(!r.sb[e.used])err.push(e.id+' brukes i ukjent steg '+e.used);else{const up=upstream(e.used);
    e.items.forEach(id=>{if(!r.ib[id])err.push(e.id+' ukjent linje '+id);else if(!up.has(usedBy[id]))err.push(e.id+': '+id+' når ikke '+e.used);});}});

}
/* Flytter et steg til første ledige plass. busy = kokkens aktive tid. eqb = utstyr som bare kan brukes til én ting om gangen. */
function fit(busy,eqb,r,s){
  for(let moved=true;moved;){moved=false;
    if(s.active){const a=r+s.passive,b=a+s.active;for(const[x,y]of busy){if(a<y&&x<b){r=y-s.passive;moved=true;break;}}}
    if(!moved&&s.excl){const a=r,b=r+s.active+s.passive;for(const[x,y]of(eqb[s.eq]||[])){if(a<y&&x<b){r=y;moved=true;break;}}}
  }
  return r;
}
/* Baklengs listeplanlegging. mode 'jit' = alt så sent som mulig. mode 'prep' = forhåndssteg ferdig før første cook-steg. */
function schedule(r,mode){

  const succ={};St.forEach(s=>succ[s.id]=[]);St.forEach(s=>pre(s).forEach(a=>succ[a].push(s.id)));
  const rr={};const rank=s=>rr[s.id]??=dur(s)+Math.max(0,...pre(s).map(a=>rank(by[a])));
  St.forEach(rank);
  const ah={};const ahead=s=>ah[s.id]??=(s.phase==='prep'&&pre(s).every(a=>ahead(by[a])));
  St.forEach(ahead);
  const R={},busy=[],eqb={};
  /* Rolig: et prep-steg kan legges i en fri periode inne i kokingen (ingen aktive steg, plass til steget med 2 min slingring),
     hvis resultatet brukes etter perioden. Ellers faller det tilbake til «prep først». */
  const BUF=2;
  const inWindow=(s,need,hi)=>{if(!s.active)return null;
    const iv=busy.filter(([x])=>x<hi).sort((a,b)=>a[0]-b[0]),gaps=[];let cur=0;
    for(const[x,y]of iv){if(x>cur)gaps.push([cur,x]);cur=Math.max(cur,y);}if(cur<hi)gaps.push([cur,hi]);
    let best=null;for(const[x,y]of gaps){if(y-x<s.active+2*BUF)continue;const r0=Math.max(need,x+BUF-s.passive);
      if(r0+s.passive+s.active<=y-BUF&&(s.hold==null||r0-need<=s.hold)&&(best==null||r0<best))best=r0;}
    return best;};
  const run=(ids,floor,win)=>{const left=new Set(ids);
    while(left.size){
      let best=null;
      for(const id of left){
        if(!succ[id].every(x=>R[x]))continue;const s=by[id];
        /* Forhåndssteg legges før cook-start (floor), men aldri tidligere enn resultatet tåler å stå (hold). */
        const need=Math.max(0,...succ[id].map(x=>R[x].e));let want=floor-s.passive;if(s.hold!=null)want=Math.min(want,need+s.hold);
        let r0=fit(busy,eqb,Math.max(need,want),s);if(s.hold!=null&&r0-need>s.hold)r0=fit(busy,eqb,need,s);
        if(win){const w=inWindow(s,need,win);if(w!=null&&w<r0)r0=w;}
        if(!best||r0<best.r||(r0===best.r&&rr[id]>rr[best.id]))best={id,r:r0};
      }
      if(!best)throw new Error('Syklus i '+r.id);
      const s=by[best.id];R[s.id]={r:best.r,e:best.r+dur(s)};
      if(s.active)busy.push([best.r+s.passive,best.r+s.passive+s.active]);
      if(s.excl)(eqb[s.eq]??=[]).push([best.r,best.r+dur(s)]);
      left.delete(s.id);
    }};
  const late=St.filter(s=>!ah[s.id]).map(s=>s.id),early=St.filter(s=>ah[s.id]).map(s=>s.id);
  run(late,0);
  const cs=Math.max(0,...late.filter(id=>!by[id].setup).map(id=>R[id].e));
  run(early,mode==='jit'?0:cs,mode==='calm'?cs:0);
  const T=Math.max(...Object.values(R).map(x=>x.e)),plan={};
  St.forEach(s=>{const st=T-R[s.id].e;plan[s.id]={start:st,aEnd:st+s.active,end:st+dur(s)};});
  St.forEach(s=>{if(s.active||!s.after.length)return;const p=plan[s.id],ready=Math.max(...s.after.map(a=>plan[a].end));if(ready<p.start){p.start=p.aEnd=ready;}});
  St.forEach(s=>{plan[s.id].use=succ[s.id].length?Math.min(...succ[s.id].map(x=>plan[x].start)):plan[s.id].end;});
  const order=[...St].sort((a,b)=>plan[a.id].start-plan[b.id].start||plan[a.id].aEnd-plan[b.id].aEnd);
  const act=St.filter(s=>s.active).map(s=>[plan[s.id].start,plan[s.id].aEnd]).sort((a,b)=>a[0]-b[0]);
  const me=[];act.forEach(([x,y])=>{const l=me[me.length-1];if(l&&x<=l[1])l[1]=Math.max(l[1],y);else me.push([x,y]);});

}
