const doneInMise = (r, s) => r.sch.ahead[s.id] && !r.sch.plan[s.id].during;
const cookSteps = r => r.sch.order.filter(s => !(ui.skipAhead && doneInMise(r, s)) && !(isHeader(s) && !s.eq));
const stepNo = (r, id) => { const k = cookSteps(r).findIndex(s => s.id === id); return k < 0 ? null : k + 1; };
const toStep = (r, id) => { const n = stepNo(r, id); return n ? 'til steg ' + n : 'i «Gjør klart»'; };

/* Mise: samme utledning som brettet i prototypen. kind: bowl (skål), fetch (ta frem én vare), bench (på benken). */
function miseModel(r) {
  const P = r.sch.plan;
  const prepSteps = e => { const ids = new Set(e.items); return r.sch.order.filter(s => s.phase === 'prep' && s.uses.some(u => ids.has(u)) && s.id !== e.used); };
  /* «hakkede» og «knuste» tomater er produkter, ikke forarbeid. */
  const worked = i => !!markOf(r, i) || /myk|lunken|romtemp|sammenpisket|smeltet|saften|skall|presset/.test((i.prep || '').toLowerCase());
  const small = i => ['ts', 'ss', 'klype', 'tsp', 'tbsp', 'pinch'].includes(i.unit) || (i.unit === 'g' && i.amount <= 30);
  const all = [...r.mise].sort((a, b) => P[a.used].start - P[b.used].start).map(e => {
    const lines = e.items.map(id => r.ib[id]), vis = lines.filter(i => i.amount != null), ps = prepSteps(e);
    /* Skål bare når det er en grunn (regel C): forarbeid, en blanding på tre eller flere, eller tidspress ved varmen. Ellers «ta frem». */
    const st = r.sb[e.used], rush = st.phase === 'cook' && !!st.eq && !['low', 'off'].includes(st.mode) && st.active <= 2 && vis.length >= 2;
    let kind;
    if (!vis.length) kind = 'bench';
    else if (ps.length || vis.some(worked) || vis.filter(small).length >= 3 || rush) kind = 'bowl';
    else if (vis.length === 1 && vis[0].staple) kind = 'bench';
    else kind = 'fetch';
    return { e, lines, vis, ps, kind, why: ps.length || vis.some(worked) ? 'forarbeid' : vis.filter(small).length >= 3 ? 'blanding' : rush ? 'tidspress' : '' };
  });
  const els = all.filter(x => x.kind !== 'bench');
  els.forEach(x => { x.later = x.ps.map(s => P[s.id].during).find(Boolean) || ''; });
  els.filter(x => x.kind === 'bowl').forEach((x, n) => { x.no = n + 1; });
  const seen = new Set(), bench = all.flatMap(x => (x.kind === 'bench' ? x.lines : x.lines.filter(i => i.amount == null)).map(i => ({ i, used: x.e.used })))
    .filter(b => { const k = b.i.name + '|' + (b.i.amount != null ? labelOf(b.i) : '') + '|' + b.used; if (seen.has(k)) return false; seen.add(k); return true; });
  const tasks = r.sch.order.filter(s => isHeader(s) && !s.eq);
  const first = {}; r.sch.order.forEach(s => s.equipment.forEach(q => { if (!(q in first)) first[q] = P[s.id].start; }));
  const eqs = Object.keys(first).sort((a, b) => first[a] - first[b]);
  return { all, els, bench, tasks, eqs };
}

function tplx(r, text, mode, s) {
  return esc(text).replace(/\{(\w+)\}/g, (m, id) => {
    const i = r.ib[id];
    if (i) {
      const t = esc(labelOf(i, s && s.pm[id] || 1)), prep = s && s.phase !== 'prep' && i.prep ? ` <span class="prep">(${esc(i.prep)})</span>` : '';

    }
    const st = r.sb[id]; if (st) return `<span class="ref">${esc(st.out || st.short.toLowerCase())}</span>`;
    return m;
  });
}

    <p class="note">Bygget på telefonprototypen (steg 7a). Mengdene skaleres, planen regnes ut fra grafen, og symbolene er de ekte ingrediens­symbolene. Ingredienser som mangler i pantryet, vises med forbokstav, og utstyret har plassholdere til det får egne bilder. Fremgangen lagres bare på denne enheten.</p></main>`;
}

/* Handlelisten: hver ingrediens én gang, summert. tick = kan krysses av (Gjør klart på stor skjerm). */
function shopList(r, tick) {
  return agg(r).map(e => {
    const us = Object.entries(e.u), a = us.map(([u, v]) => fmt(v, u)).join(' + ');
    const mine = r.ings.filter(x => (x.buy ? x.buy[0] : x.name) === e.name), i = mine[0];
    const many = us.length === 1 && us[0][0] === 'stk' && us[0][1] > 1;
    const inParts = [...new Set(mine.map(x => compName(r, x.c)))];
    const where = inParts.length > 1 ? inParts.join(' og ') : mine.length > 1 ? `brukes ${mine.length} ganger` : '';
    const rest = e.rest.map(([n, s1, pl]) => `${frac(n)} ${n > 1 ? pl : s1} til overs`).join(', ');
    const sub = [where, rest, e.bare && !a ? 'etter smak' : ''].filter(Boolean).join(' · ');
    const inner = `${ingImg(i, 36)}<span class="nm">${esc(many && e.pl ? e.pl : e.name)}${sub ? `<em>${esc(sub)}</em>` : ''}</span><span class="amt">${esc(a)}</span>`;
    if (!tick) return `<li>${inner}</li>`;
    const k = `${r.id}:shop:${e.name}`, ok = !!state.checks[k];
    return `<li class="${ok ? 'ok' : ''}"><button class="shopi" data-tick="${k}" aria-pressed="${ok}">${inner}</button></li>`;
  }).join('');
}

function vOverview() {
  const r = dishOf(), s = r.sch;
  const facts = `<div class="facts"><div class="fact"><span class="eyebrow">Totalt</span><b>${hm(s.T)}</b></div><div class="fact"><span class="eyebrow">Aktiv tid</span><b>${hm(s.A)}</b></div><div class="fact"><span class="eyebrow">Mengde</span><b>${r.fixed ? '1 form' : state.serv + ' pors.'}</b></div></div>`;
  const parts = r.comps.filter(c => c.id !== 'ovn');
  /* Én handleliste: hver ingrediens én gang, summert. Brukes den flere steder, står det under. */
  const lines = shopList(r, false);
  const eqs = miseModel(r).eqs;
  return `${topBar(r, r.title)}<main class="app ov"><h1>${esc(r.title)}</h1>${facts}
    ${parts.length > 1 ? `<p class="parts">Retten har ${parts.length} deler: ${parts.map(c => `<span>${esc(c.name)}</span>`).join('')}</p>` : ''}
    <div class="sec"><h2>Handleliste</h2><span class="eyebrow">${agg(r).length} varer</span></div>
    <ul class="ings">${lines}</ul>
    <div class="sec"><h2>Utstyr</h2></div><div class="eqlist">${eqs.map(q => `<span>${eqImg(q, 28)}${esc(EQ[q] || q)}</span>`).join('')}</div>
  </main>${bar(`<button class="btn primary prep" data-go="mise">Gjør klart →</button>`)}`;
}

/* Gjør klart: én trykk per skål, per vare og per utstyr. Ingen avkrysning per linje. */
function miseBody(r, wideLayout = false) {
  const m = miseModel(r), P = r.sch.plan;
  const until = x => { const st = r.sb[x.e.used]; return `Til «${esc(st.short.toLowerCase())}» etter ${P[x.e.used].start} min`; };
  const keyOf = x => `${r.id}:${x.e.id}`;
  const WHY = { forarbeid: 'forarbeid', blanding: 'blandes på forhånd', tidspress: 'går fort ved varmen' };
  const bowl = x => { const st = r.sb[x.e.used], k = keyOf(x), ok = !!state.checks[k];
    return `<button class="bowl ${st.phase} ${ok ? 'ok' : ''}" data-tick="${k}" aria-pressed="${ok}">
      <span class="bowl-h"><span class="bno">${ok ? '✓' : x.no}</span><b>${esc(x.e.name)}</b><span class="state">${ok ? 'Klar' : 'Trykk når klar'}</span></span>
      <small>${until(x)} · ${x.ps.length ? esc(x.ps.map(s => s.short.toLowerCase()).join(', ')) : WHY[x.why]}</small>
      <span class="tiles">${x.vis.map(i => ingTile(r, i)).join('')}</span></button>`; };
  const fetchTiles = xs => `<div class="fetchgrid">${xs.flatMap(x => x.vis.map(i => { const k = `${keyOf(x)}:${i.id}`, ok = !!state.checks[k];
    return `<button class="tile ftile ${ok ? 'ok' : ''}" data-tick="${k}" aria-pressed="${ok}" title="${esc(until(x))}">${ingImg(i, 48)}<span class="ta">${esc(amtOf(i))}</span><span class="tn">${esc(nameOf(i))}<em>${toStep(r, x.e.used)}</em></span><span class="pbox" aria-hidden="true"></span></button>`; })).join('')}</div>`;
  /* På benken: samme flis som «Ta frem», med stiplet kant. «etter smak» der det ikke er noen mengde. */
  const benchTiles = `<div class="fetchgrid">${m.bench.map(b => { const k = `${r.id}:bench:${b.i.id}:${b.used}`, ok = !!state.checks[k];
    return `<button class="tile ftile btile ${ok ? 'ok' : ''}" data-tick="${k}" aria-pressed="${ok}">${ingImg(b.i, 48)}<span class="ta">${esc(b.i.amount != null ? amtOf(b.i) : 'etter smak')}</span><span class="tn">${esc(nameOf(b.i))}<em>${toStep(r, b.used)}</em></span><span class="pbox" aria-hidden="true"></span></button>`; }).join('')}</div>`;
  const now = m.els.filter(x => !x.later), later = m.els.filter(x => x.later);
  const bowlsNow = now.filter(x => x.kind === 'bowl'), fetchNow = now.filter(x => x.kind === 'fetch');
  const groups = [...new Set(later.map(x => x.later))];
  /* Telleren gjelder bare skålene: det er dem du faktisk lager. Ta frem, benken og utstyret krysses av, men teller ikke. */
  const keys = m.els.filter(x => x.kind === 'bowl').map(keyOf);
  const n = keys.filter(k => state.checks[k]).length;
  const progress = `<div class="meter" aria-hidden="true"><span style="width:${(n / Math.max(1, keys.length) * 100).toFixed(1)}%"></span></div>
    <p class="hint tab-nums" style="margin:0" aria-live="polite">${keys.length && n === keys.length ? '<b>Alle skålene er klare.</b> Nå kan varmen på.' : `${n} av ${keys.length} skåler klare`}</p>`;
  const tasks = m.tasks.length ? `<div class="sec"><h2>Først</h2></div>${m.tasks.map(s => { const k = `${r.id}:${s.id}`, ok = !!state.checks[k];
      return `<button class="task ${ok ? 'ok' : ''}" data-tick="${k}" aria-pressed="${ok}">${eqImg(s.equipment[0] || 'bowl', 36)}<span><b>${ok ? '✓ ' : ''}${esc(s.short)}</b><em>${esc(s.text)}</em></span></button>`; }).join('')}` : '';
  const bowls = bowlsNow.length ? `<div class="bowlgrid">${bowlsNow.map(bowl).join('')}</div>` : '';
  const fetchSec = fetchNow.length ? `<section><div class="sec"><h2>Ta frem</h2><span class="eyebrow">måles når de brukes</span></div>${fetchTiles(fetchNow)}</section>` : '';
  const benchSec = m.bench.length ? `<section><div class="sec"><h2>På benken</h2><span class="eyebrow">står fremme</span></div>${benchTiles}</section>` : '';
  const laterSec = groups.map(g => { const xs = later.filter(x => x.later === g), w = r.sb[g], bw = xs.filter(x => x.kind === 'bowl'), ft = xs.filter(x => x.kind === 'fetch');
      return `<details class="later"><summary>Senere, mens ${esc(resultOf(w))} står<small>Du får dem i matlagingen når tiden er inne. Planen «${PLANS[state.plan][0]}» legger dem i ventetiden.</small></summary>${bw.map(bowl).join('')}${ft.length ? fetchTiles(ft) : ''}</details>`; }).join('');
  const eqSec = `<section><div class="sec"><h2>Utstyr</h2><span class="eyebrow">i bruksrekkefølge</span></div><div class="eqtiles">${m.eqs.map(q => eqTile(q, `${r.id}:eq:${q}`)).join('')}</div></section>`;
  if (wideLayout) return `<div class="mgrid"><div class="mleft"><div class="sec mhead"><h2>Skåler</h2><span class="eyebrow">${bowlsNow.length} · i rekkefølge</span></div>${progress}${bowls}${laterSec}</div>
    <div class="mright">${tasks}${fetchSec}${benchSec}${eqSec}</div></div>`;
  return `<h1>Gjør klart</h1>${progress}${tasks}
    ${bowlsNow.length ? `<div class="sec"><h2>Skåler</h2><span class="eyebrow">${bowlsNow.length} · i rekkefølge</span></div>${bowls}` : ''}
    ${fetchNow.length || m.bench.length ? `<div class="pair">${fetchSec}${benchSec}</div>` : ''}${laterSec}${eqSec}`;
}
const miseBar = () => bar(`<button class="btn sq" data-go="overview" aria-label="Tilbake til oversikten">←</button><button class="btn primary cook" data-go="cook">Start matlagingen →</button>`);
function vMiseScreen() {
  const r = dishOf();
  return `${topBar(r, r.title)}<main class="app mise">${miseBody(r)}</main>${miseBar()}`;
}

/* ---------- lag mat ---------- */
const runOf = (r, id) => ui.running.find(t => t.r === r.id && t.s === id);
const leftMin = t => Math.max(0, Math.ceil((t.end - Date.now()) / 60e3));
const fmtLeft = t => { const s = Math.max(0, Math.round((t.end - Date.now()) / 1000)); return s ? String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : 'sjekk'; };
/* Steget som står mens dette steget gjøres, etter planen («mens pastaen koker»). Gjelder alle faser, ikke bare prep. */
function whileOf(r, s) {
  const P = r.sch.plan, t = P[s.id].start;
  return r.sch.order.filter(x => x.passive >= 3 && x.id !== s.id && P[x.id].aEnd <= t && t < P[x.id].end).sort((a, b) => P[b.id].aEnd - P[a.id].aEnd)[0];
}
/* Det kortet trenger fra tidligere: skålene fra «Gjør klart» som helles i her, resultater fra tidligere steg, og rå ingredienser som ikke ligger i en skål. */
function needsOf(r, s, m) {
  const bowls = m.all.filter(x => x.e.used === s.id && x.kind !== 'bench');
  const inBowl = new Set(bowls.flatMap(x => x.e.items));
  const loose = s.use.filter(u => !inBowl.has(u.id));
  /* Resultater fra prep gjort i «Gjør klart» ligger allerede i en skål, så de vises ikke to ganger. */
  const results = s.after.filter(a => (!r.sb[a].setup || r.sb[a].uses.length) && !(ui.skipAhead && doneInMise(r, r.sb[a])));
  return { bowls, loose, results };
}
function vCook() {
  const r = dishOf(), steps = cookSteps(r), m = miseModel(r);
  ui.idx = Math.max(0, Math.min(ui.idx, steps.length - 1));
  const s = steps[ui.idx], P = r.sch.plan, no = id => steps.findIndex(x => x.id === id) + 1;
  const prog = steps.map((x, k) => `<i class="${x.phase} ${k <= ui.idx ? 'on' : ''} ${k === ui.idx ? 'cur' : ''}"></i>`).join('');
  const runs = ui.running.filter(t => t.r === r.id);
  const open = runs.find(t => t.id === ui.openRun);
  const status = `<div class="status" id="status"><div class="prog" aria-hidden="true">${prog}</div>
    <div class="now"><span class="lbl tab-nums">Steg ${ui.idx + 1} av ${steps.length}</span>${runs.length ? `<span class="lbl">Pågår</span>${runs.map(t => `<button class="tm ${Date.now() >= t.end ? 'fin' : ''}" data-run="${t.id}" data-tid="${t.id}" aria-expanded="${t.id === ui.openRun}">${esc(t.label)} <span>${fmtLeft(t)}</span></button>`).join('')}` : '<span class="muted">Ingenting står og går.</span>'}</div>
    ${open ? `<div class="runbox"><b>${esc(open.label)}</b>${open.done ? `<span>Ferdig når: ${esc(open.done)}</span>` : ''}<button class="btn" data-rundone="${open.id}">Ferdig, fjern</button></div>` : ''}</div>`;
  if (ui.list) {
    return `${topBar(r, r.title)}<main class="app">${status}
      <div class="toggle-row"><label><input type="checkbox" id="skipahead" data-skip ${ui.skipAhead ? 'checked' : ''}> Hopp over det som er gjort i «Gjør klart»</label></div>
      <ol class="steplist">${steps.map((x, k) => `<li class="${x.phase} ${k < ui.idx ? 'past' : ''} ${k === ui.idx ? 'cur' : ''}"><button data-jump="${k}" aria-label="Gå til steg ${k + 1}: ${esc(x.short)}"><span class="n">${k + 1}</span><span><span class="m">${PH[x.phase]} · ${esc(compName(r, x.c))}${durTxt(x) ? ' · ' + durTxt(x) : ''}</span><p>${tplx(r, x.text, 'pill', x)}</p></span></button></li>`).join('')}</ol>
    </main>${bar(`<button class="btn primary" data-list="0">Tilbake til kortet</button>`)}`;
  }
  const w = whileOf(r, s), wr = w && runOf(r, w.id);
  const wait = s.after.map(a => runOf(r, a)).filter(t => t && Date.now() < t.end);
  const need = needsOf(r, s, m);
  const needs = [
    ...need.bowls.map(x => x.kind === 'fetch' ? x.vis.map(i => ingTile(r, i)).join('') :
      `<span class="needbowl"><span class="bno">${x.no}</span><span><b>${esc(x.e.name)}</b><span class="mini">${x.vis.map(i => ingImg(i, 26)).join('')}</span><em>${esc(x.vis.map(i => labelOf(i)).join(', '))}</em></span></span>`),
    ...need.loose.map(u => ingTile(r, r.ib[u.id], u.p)),
    ...need.results.map(a => `<span class="needres"><span class="arrow">↳</span><span><b>${esc(cap(resultOf(r.sb[a])))}</b><em>${no(a) ? 'fra steg ' + no(a) : 'fra «Gjør klart»'}</em></span></span>`)].join('');
  const last = ui.idx === steps.length - 1, passive = s.timer || s.passive;
  const mine = runOf(r, s.id);
  const primary = last ? 'Ferdig' : passive ? (mine ? 'Videre →' : `Start, så videre →`) : 'Ferdig, videre →';
  return `${topBar(r, r.title)}<main class="app">${status}
    <article class="card ${s.phase}" id="card" aria-live="polite">
      <div class="meta">${PH[s.phase]} · ${esc(compName(r, s.c))} · ${durTxt(s) || 'kort'}</div>
      ${w ? `<span class="while">Mens ${esc(resultOf(w))} står${wr ? ` · ${leftMin(wr)} min igjen` : ''}</span>` : ''}
      ${wait.length ? `<div class="waitbox">Venter på ${wait.map(t => `«${esc(t.label.toLowerCase())}», ca. ${leftMin(t)} min`).join(' og ')}. Gjør klart det du kan.</div>` : ''}
      <h2>${esc(s.short)}</h2>
      ${s.eq ? `<div class="eqline">${eqImg(s.eq, 28)}${esc(eqTxt(s))}</div>` : ''}
      <p class="txt">${tplx(r, s.text, 'bold', s)}</p>
      ${needs ? `<div class="needs"><span class="eyebrow">Du trenger</span>${needs}</div>` : ''}
      ${s.done ? `<div class="donebox"><b>Ferdig når</b>${esc(s.done)}</div>` : ''}
      ${passive && !last ? `<div class="passbox">${s.active ? `Din del tar ${s.active} min. ` : ''}Så står det i ${hm(passive)} av seg selv. Trykk under når du har startet, så holder appen tiden og du kan gå videre.</div>` : ''}
    </article>
    <p class="swipehint">Sveip for neste og forrige steg</p>
  </main>${bar(`<button class="btn sq" data-step="-1" ${ui.idx === 0 ? 'disabled' : ''} aria-label="Forrige steg">←</button><button class="btn sq txt" data-list="1" aria-label="Vis alle steg">Steg</button><button class="btn primary ${s.phase}" data-advance="1">${primary}</button>`)}`;
}

function vDone() {
  const r = dishOf();
  return `<main class="app fin-s"><p class="eyebrow">${esc(r.title)}</p><h1>Maten er klar</h1><p class="muted">Planen var ${hm(r.sch.T)}, med ${hm(r.sch.A)} aktivt arbeid.</p>
    <p class="note" style="text-align:left">Hvordan gikk det? Skriv ned det som skurret mens du husker det. Det er det prototypen skal finne.</p></main>${bar(`<button class="btn primary" data-go="home">Til alle retter</button>`)}`;
}

/* ---------- stor skjerm (fra 1024 px) ----------
   Samme flyt som telefonen. Hver fane får en kolonne ved siden av, og «Plan» viser tidslinjen, metrokartet og tabellmetoden.
   Tegnekoden for de tre er hentet fra fem-retter.html. Fasefargene heter ph-* her, fordi .prep allerede brukes om klargjøringen. */
const WIDE = matchMedia('(min-width: 1024px) and (orientation: landscape)');
const wide = () => WIDE.matches;
ui.tl = {}; ui.side = 'timeline'; ui.sel = null; ui.showDone = false; ui.wmenu = false; ui.full = false;

function topBarWide(r) {
  const order = ['overview', 'mise', 'cook'], at = order.indexOf(ui.screen);
  const names = { overview: 'Oversikt', mise: 'Gjør klart', cook: 'Lag mat' };
  const serv = r.fixed ? `<span class="hint" style="margin:0">${esc(r.fixed)}</span>` :
    `<div class="stepper" role="group" aria-label="Porsjoner"><button data-serv="-1" aria-label="Færre porsjoner">−</button><span>${state.serv} pors.</span><button data-serv="1" aria-label="Flere porsjoner">+</button></div>`;
  const variant = ALT[r.id] ? `<div class="seg" role="group" aria-label="Brød">${[['home', 'Hjemmelaget'], ['bought', 'Kjøpt']].map(([k, l]) => `<button data-alt="${k}" aria-pressed="${(k === 'bought') === !!state.alt[r.id]}">${l}</button>`).join('')}</div>` : '';
  const plan = `<div class="seg" role="group" aria-label="Plan">${Object.entries(PLANS).map(([k, [l]]) => `<button data-plan="${k}" aria-pressed="${state.plan === k}">${l}</button>`).join('')}</div>`;
  return `<header class="wtop" id="top"><div class="wtop-in">
    <button class="back" data-go="home" aria-label="Til alle retter">← Retter</button><span class="top-title" title="${esc(r.title)}">${esc(r.title)}</span>
    <nav class="flow" aria-label="Steg i matlagingen">${order.map((k, n) => `<button data-go="${k}" ${k === ui.screen ? 'aria-current="step"' : ''} class="${n < at ? 'done' : ''}">${names[k]}</button>`).join('')}</nav>
    <div class="wmenu"><button class="wmenu-btn" data-wmenu aria-expanded="${!!ui.wmenu}" aria-label="Porsjoner og plan">☰</button>
      ${ui.wmenu ? `<div class="wsheet" role="dialog" aria-label="Porsjoner og plan">
        <div class="ws-row"><span class="eyebrow">Mengde</span>${serv}</div>
        ${variant ? `<div class="ws-row"><span class="eyebrow">Brød</span>${variant}</div>` : ''}
        <div class="ws-row col"><span class="eyebrow">Plan</span>${plan}<p class="hint" style="margin:6px 0 0">${PLANS[state.plan][1]}</p></div></div>` : ''}</div>
  </div></header>`;
}

/* Tidslinjen. compact = i sidekolonnen, med nålinjen på et gitt minutt (at) og steget som pågår uthevet (cur). */
function vTimelineW(r, o = {}) {
  const { plan, T, order, me, cookStart, serveStart } = r.sch, pct = m => (m / T * 100).toFixed(3) + '%';
  const m = ui.tl[r.id] ?? o.at ?? Math.round(T * 0.55);
  let du = ''; me.forEach(([x, y], k) => { du += `<i class="tb me" style="left:${pct(x)};width:${pct(y - x)}"></i>`;
    const nx = me[k + 1]; if (nx && nx[0] - y >= 4) du += `<i class="tb free" style="left:${pct(y)};width:${pct(nx[0] - y)}">${(nx[0] - y) / T > 0.09 ? `<b>fri ${nx[0] - y} min</b>` : ''}</i>`; });
  const duRow = `<div class="tl-row tl-me"><div class="tl-l"><span>Du</span>${o.compact ? '' : '<small>opptatt eller fri</small>'}</div><div class="tl-t">${du}</div></div>`;
  const rows = order.map(s => { const p = plan[s.id], w = p.use - p.end;
    return `<div class="tl-row ph-${s.phase}${s.id === o.cur ? ' cur' : ''}${o.pick && ui.sel === s.id ? ' sel' : ''}"${o.pick ? ` data-sel="${s.id}" tabindex="0" role="button" aria-label="${esc(s.short)}, minutt ${p.start}"` : ''}><div class="tl-l"><span>${o.pick ? `<b class="tl-no">${noOf(r, s.id)}</b> ` : ''}${esc(s.short)}</span>${o.compact ? '' : `<small>${esc(compName(r, s.c))}</small>`}</div><div class="tl-t">${s.active ? `<i class="tb a" style="left:${pct(p.start)};width:${pct(s.active)}"></i>` : ''}${s.passive ? `<i class="tb p" style="left:${pct(p.aEnd)};width:${pct(s.passive)}"></i>` : ''}${s.hold != null && w > 0 ? `<i class="tb h${w > s.hold ? ' over' : ''}" style="left:${pct(p.end)};width:${pct(w)}" title="Venter ${w} min. Tåler ${hm(s.hold)}."></i>` : ''}</div></div>`; }).join('');
  let ticks = ''; const st = T > 150 ? 30 : T > 70 ? 15 : 10; for (let t = 0; t <= T; t += st) ticks += `<span style="left:${pct(t)}">${t}</span>`;
  const ph = (x, l) => x > 0 && x < T ? `<div class="phline${x / T > 0.9 ? ' r' : ''}" style="--x:${x / T}"><span>${l}</span></div>` : '';
  const tl = `<div class="tl-scroll"><div class="tl${o.compact ? ' compact' : ''}">${duRow}${rows}<div class="tl-axis"><div></div><div>${ticks}</div></div>${ph(cookStart, 'cook')}${ph(serveStart, 'serve')}${o.noNow ? '' : `<div class="nowline" id="tln-${r.id}" style="--x:${m / T}"></div>`}</div></div>`;
  if (o.compact && !o.scrub) return tl;
  if (o.compact) return `${tl}<div class="tl-ctl"><label for="tl-${r.id}"><span>Spol</span><input type="range" id="tl-${r.id}" data-tl="${r.id}" min="0" max="${T}" step="1" value="${m}"></label>
    <p class="tl-status" id="tls-${r.id}" aria-live="polite">${tlStatus(r, m)}</p>${ui.tl[r.id] != null ? '<button class="lnk" data-tlreset>Tilbake til der du er</button>' : ''}</div>`;
  const ov = r.sch.over.length ? ` <b style="color:var(--now)">Rødt omriss: ${r.sch.over.map(id => esc(r.sb[id].short.toLowerCase())).join(', ')} venter lenger enn det tåler.</b>` : '';
  return `${tl}<p class="m-note">Hel stolpe er aktivt arbeid, skravert står av seg selv, og prikket omriss er ventetid som maten tåler.${ov}</p>

function tlStatus(r, m) {

  const wait = order.filter(s => s.passive && plan[s.id].aEnd <= m && m < plan[s.id].end);
  const next = order.find(s => plan[s.id].start > m);

  t += doing.length ? `Du gjør: ${doing.map(s => esc(s.short)).join(', ')}. ` : 'Du har fri akkurat nå. ';
  if (wait.length) t += `Står: ${wait.map(s => esc(s.short.toLowerCase())).join(', ')}. `;
  t += next ? `Neste: ${esc(next.short.toLowerCase())} om ${plan[next.id].start - m} min.` : 'Maten er klar.';
  return t;
}

/* Metrokartet liggende, til fullskjerm: én bane per del av retten, stasjonene fra venstre mot høyre i den rekkefølgen du begynner på dem.
   Nummeret foran navnet er steget i listen. Steget du er på har rød ring, og et trykk velger steget som i de andre visningene. */
function vMetroW(r, curId) {
  const P = r.sch.plan, by = r.sb, ns = r.sch.order.filter(s => !isHeader(s));
  const fin = ns.find(s => !ns.some(t => t.after.includes(s.id)));
  const col = {}; ns.forEach((s, k) => col[s.id] = k);
  const lanes = r.comps.filter(c => ns.some(s => s.c === c.id)).map(c => c.id);
  const LW = 170, CW = 96, LH = 96, TOP = 64, AX = 36;
  const W = LW + 30 + (ns.length - 1) * CW + 70, H = TOP + (lanes.length - 1) * LH + 48 + AX;
  const pos = s => ({ x: LW + 30 + col[s.id] * CW, y: TOP + lanes.indexOf(s.c) * LH });
  const colr = c => `var(--l${lanes.indexOf(c) % 4 + 1})`;
  let lines = '', st = '', lb = '', ax = '';
  lanes.forEach((c, li) => {
    const mine = ns.filter(s => s.c === c), p = pos(mine[0]), y = TOP + li * LH;
    lb += `<text class="m-lane" x="0" y="${y + 4}">${esc(compName(r, c).length > 24 ? compName(r, c).slice(0, 23) + '…' : compName(r, c))}</text>`;
    if (p.x - 22 > LW) lines += `<path class="m-guide" d="M${LW - 12} ${y} H${p.x - 22}"/>`;
    lines += `<path class="m-line" d="M${p.x - 22} ${y} H${p.x}" style="stroke:${colr(c)}"/>`;
    let last = null;
    mine.forEach((s, k) => { const q = pos(s);
      const out = ns.filter(t => t.after.includes(s.id) && t.c !== s.c).map(t => lanes.indexOf(t.c) - li)[0];
      const below = s === fin ? false : out < 0 ? true : out > 0 ? false : k % 2 === 1;
      const lvl = last && last.below === below && col[s.id] - last.col === 1 ? 1 - last.lvl : 0; last = { below, col: col[s.id], lvl };
      lb += `<text class="m-lbl${s.id === curId ? ' cur' : ''}" x="${q.x}" y="${below ? q.y + 26 + lvl * 14 : q.y - (s === fin ? 19 : 16) - lvl * 14}" text-anchor="middle"><tspan class="mv-no">${noOf(r, s.id)}</tspan> ${esc(s.short)}</text>`; });
  });
  ns.forEach(s => { const b = pos(s); s.after.forEach(a => { const ps = by[a]; if (isHeader(ps)) return; const A = pos(ps);
    const dx = Math.min(CW * 0.9, (b.x - A.x) / 2);
    const d = A.y === b.y ? `M${A.x} ${A.y} H${b.x}` : `M${A.x} ${A.y} H${b.x - 2 * dx} C${b.x - dx} ${A.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`;
    lines += `<path class="m-line" d="${d}" style="stroke:${colr(ps.c)}"/>`; }); });
  const ay = H - AX + 16;
  ns.forEach(s => { const p = pos(s), big = s === fin;
    st += `<g class="m-st ph-${s.phase}${ui.sel === s.id ? ' sel' : ''}${s.id === curId ? ' cur' : ''}" data-sel="${s.id}" tabindex="0" role="button" aria-label="${esc(s.short)}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="22"/><circle cx="${p.x}" cy="${p.y}" r="${big ? 11 : 8}"/></g>`;
    ax += `<path class="m-tick" d="M${p.x} ${p.y + (big ? 13 : 10)} V${ay - 12}"/><text class="m-ax" x="${p.x}" y="${ay}" text-anchor="middle">${P[s.id].start}</text>`; });
  ax += `<text class="m-lane" x="0" y="${ay}">Start, minutt</text>`;
  const X0 = LW + 30; let z0 = 0;
  const zp = ns.map((s, k) => { if (!s.setup) return s.phase; const nx = ns.slice(k + 1).find(t => !t.setup); return nx ? nx.phase : s.phase; });
  ns.forEach((s, k) => { if (k < ns.length - 1 && zp[k + 1] === zp[k]) return; const nx = ns[k + 1];
    ax += `<text class="m-zone" x="${X0 + (z0 + k) / 2 * CW}" y="12" text-anchor="middle">${PH[zp[k]]}</text>`;
    if (nx) ax += `<path class="m-phase" d="M${X0 + k * CW + CW / 2} 8 V${ay - 14}"/>`; z0 = k + 1; });
  return `<div class="m-scroll"><svg class="m-svg" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.round(W * 0.8)}px;max-width:${Math.round(W * 1.4)}px" role="img" aria-label="Metrokart for ${esc(r.title)}">${ax}${lines}${st}${lb}</svg></div>
    <p class="m-note">Tallet under er minuttet steget starter. Åpne ringer er prep, fylte er cook. Svart ring er steget du er på, og rød ring er steget du har valgt.</p>`;
}

/* Tabellmetoden: ingrediensene til venstre, stegene som celler som spenner over det de samler. */
function vTableW(r, o = {}) {
  const hdr = r.steps.filter(isHeader), ns = r.steps.filter(s => !isHeader(s));
  const refd = new Set(ns.flatMap(s => s.after)), root = ns.find(s => !refd.has(s.id)), P = r.sch.plan;
  const isIng = x => 'ing' in x;
  const kids = s => [...s.after.map(a => r.sb[a]).filter(x => !isHeader(x)).sort((a, b) => P[a.id].start - P[b.id].start), ...s.use.map(u => ({ ing: r.ib[u.id], p: u.p }))];
  const hmm = {}; const ht = x => isIng(x) ? 0 : (hmm[x.id] ??= 1 + Math.max(0, ...kids(x).map(ht)));
  const Hh = ht(root), rows = [], cells = [], seen = new Set();
  const dfs = x => { if (isIng(x)) { rows.push(x); return [rows.length - 1, rows.length - 1]; }
    if (seen.has(x.id)) return null; seen.add(x.id); let lo = 1e9, hi = -1;
    kids(x).forEach(k => { const sp = dfs(k); if (sp) { lo = Math.min(lo, sp[0]); hi = Math.max(hi, sp[1]); } });
    if (hi < 0) { rows.push(null); lo = hi = rows.length - 1; } cells.push({ s: x, lo, hi, col: ht(x) }); return [lo, hi]; };
  dfs(root);
  const late = x => !x.setup && P[x.id].start >= r.sch.cookStart;
  const col = {}; const place = (x, c) => { col[x.id] = c; kids(x).filter(k => !isIng(k)).forEach(k => { if (col[k.id] == null) place(k, late(k) ? Math.max(ht(k), c - 1) : ht(k)); }); };
  place(root, Hh); cells.forEach(c => c.col = col[c.s.id]);
  const off = hdr.length;
  const cols = o.side ? `150px repeat(${Hh},84px)` : `minmax(200px,1.6fr) repeat(${Hh},minmax(84px,1fr))`;
  let h = `<div class="tscroll${o.side ? ' tside' : ''}"><div class="tgrid" style="grid-template-columns:${cols};min-width:${o.side ? 160 + Hh * 87 : 210 + Hh * 90}px">`;
  hdr.forEach((s, i) => h += `<div class="tc th" style="grid-row:${i + 1};grid-column:1/-1">${esc(s.text)} <small>${s.active + s.passive} min</small></div>`);
  rows.forEach((x, i) => h += `<div class="tc ti" style="grid-row:${off + i + 1};grid-column:1">${x ? `<span>${amtOf(x.ing, x.p) ? `<b>${esc(amtOf(x.ing, x.p))}</b> ` : ''}${esc(nameOf(x.ing, x.p))}</span>${x.ing.prep ? `<small>${esc(x.ing.prep)}</small>` : ''}` : ''}</div>`);
  cells.forEach(c => { const s = c.s, d = s.active + s.passive, meta = [s.temp ? s.temp + '°' : '', d >= 3 ? hm(d) : ''].filter(Boolean).join(' · ');
    h += `<button class="tc ts ph-${s.phase}${ui.sel === s.id ? ' sel' : ''}${o.cur === s.id ? ' cur' : ''}" data-sel="${s.id}" style="grid-row:${off + c.lo + 1}/${off + c.hi + 2};grid-column:${c.col + 1}"><span class="no">${noOf(r, s.id)}</span><b>${esc(s.short)}</b>${meta ? `<small>${meta}</small>` : ''}</button>`; });
  return h + `</div></div><p class="m-note">Kolonnene viser rekkefølgen innenfor hver del av retten. Det som gjøres underveis, står inntil steget det brukes i.</p>`;
}
/* Det valgte steget, felles for tidslinjen, metrokartet og tabellen: hele teksten, når og hvor, og «Gå til steget».

  const next = steps[ui.idx + 1];

      ${runs.length ? `<div class="now">${runs.map(t => `<button class="tm ${Date.now() >= t.end ? 'fin' : ''}" data-run="${t.id}" data-tid="${t.id}" aria-expanded="${t.id === ui.openRun}">${esc(t.label)} <span>${fmtLeft(t)}</span></button>`).join('')}</div>` : '<p class="hint" style="margin:0">Ingenting står og går.</p>'}
      ${open ? `<div class="runbox"><b>${esc(open.label)}</b>${open.done ? `<span>Ferdig når: ${esc(open.done)}</span>` : ''}<button class="btn" data-rundone="${open.id}">Ferdig, fjern</button></div>` : ''}</section>`;
  const v = SIDE_VIEWS[ui.side] ? ui.side : 'timeline';
  const body = ui.full ? '<p class="hint" style="margin:0">Vises i fullskjerm.</p>' : v === 'timeline' ? `<p class="hint" style="margin:0 0 4px">Den røde streken er der du er. Dra i spolen for å se et annet minutt.</p>${vTimelineW(r, { compact: true, at: P[s.id].start, cur: s.id, pick: true, scrub: true })}${legend()}`
    : v === 'metro' ? vMetroV(r, s.id)
    : v === 'delta' ? `<p class="hint" style="margin:0 0 8px">Steget du er på er uthevet. Trykk på et nummer for å krysse av.</p><div class="dl-wrap side">${skFit(r, false, { cur: s.id, fit: 'side' })}</div>`
    : `<p class="hint" style="margin:0 0 8px">Rull sideveis. Steget du er på har svart ramme.</p>${vTableW(r, { cur: s.id, side: true })}`;
  const tabs = `<div class="seg sidetabs" role="tablist" aria-label="Visning">${Object.entries(SIDE_VIEWS).map(([k, l]) => `<button role="tab" data-side="${k}" aria-selected="${v === k}" aria-pressed="${v === k}">${l}</button>`).join('')}</div>`;
  const side = `<section class="panel pside"><div class="side-h">${tabs}<button class="fsbtn" data-full aria-label="Vis ${SIDE_VIEWS[v].toLowerCase()} i fullskjerm" title="Fullskjerm">⤢</button></div>${body}${ui.full || v === 'delta' ? '' : detailOf(r, ui.sel, 'Trykk på et steg for hele teksten. Valget følger med når du bytter visning.')}</section>`;
  /* Fullskjerm: visningen over hele vinduet, med det samme valgte steget. Esc eller × lukker. */
  const fullBody = v === 'timeline' ? vTimelineW(r, { at: P[s.id].start, cur: s.id, pick: true })
    : v === 'metro' ? vMetroW(r, s.id) : v === 'delta' ? `<div class="dl-wrap"><span class="fx-scale hand"></span>${skFit(r, sketchHorizontal(innerWidth - 64, innerHeight - 120), { cur: s.id })}</div>` : vTableW(r, { cur: s.id });
  const full = ui.full ? `<div class="fsv" role="dialog" aria-modal="true" aria-label="${SIDE_VIEWS[v]} i fullskjerm"><div class="fsv-h">${tabs}<span class="fsv-at">Du er på steg ${ui.idx + 1}: <b>${esc(s.short)}</b></span><button class="xbtn" data-full aria-label="Lukk fullskjerm">×</button></div>

      <ol class="wsteps">${list}</ol>
      <label class="skiprow"><input type="checkbox" id="skip-wide" data-skip ${ui.skipAhead ? 'checked' : ''}> Hopp over det som er gjort i «Gjør klart»</label></div>
    <div class="splitter" data-split role="separator" aria-orientation="vertical" aria-label="Dra for å endre bredden på kolonnene" aria-valuenow="${asideW()}" tabindex="0"><span></span></div>
    <aside class="aside">${status}${side}</aside></div></main>${full}${bar(`<button class="btn sq" data-step="-1" ${ui.idx === 0 ? 'disabled' : ''} aria-label="Forrige steg">←</button><button class="btn primary ${s.phase}" data-advance="1">${primary}</button>`)}`;
}

/* ---------- skisser: bildekort, tre varianter med tegnede piler ----------
   Stegene fortalt med ingrediensbildene og et nøkkelord, og piler som ser tegnet ut. Nøkkelordet kommer fra dataene:
   i prep-steg fra klargjøringen på hver ingrediens («hakk», «kutt i biter»), ellers fra stegets korte navn, og
   «tilsett» når noe legges i noe som allerede er i gang. Pilene følger grafen (after), ikke bare rekkefølgen. */
const KW = [[/hakk|mince|chop/, 'hakk'], [/finrevet|revet|rasp|grate/, 'riv'], [/skive|slice/, 'skjær i skiver'], [/terning|cube|dice/, 'kutt i terninger'],
  [/staver|strip/, 'kutt i staver'], [/biter|piece|chunk/, 'kutt i biter'], [/båt|wedge/, 'kutt i båter'], [/ringer/, 'kutt i ringer'], [/saft|juice/, 'press'],
  [/romtemp|room temp/, 'ta ut i god tid'], [/myk|soft/, 'mykt'], [/sammenpisket|beaten/, 'pisk']];
const KW_EN = [[/mince|chop/, 'mince'], [/grate/, 'grate'], [/slice/, 'slice'], [/cube|dice/, 'dice'], [/strip/, 'cut in strips'], [/piece|chunk/, 'cut'], [/wedge/, 'cut in wedges'], [/juice/, 'squeeze'], [/trim/, 'trim']];

const kwOf = i => { const p = (i.prep || '').toLowerCase(); if (/^(hakkede|knuste|crushed|diced tomatoes)$/.test(p)) return null; const k = (isEnglish(p) ? KW_EN : KW).find(([re]) => re.test(p)); return k ? k[1] : null; };
const lc = t => t.charAt(0).toLowerCase() + t.slice(1);
const realAfter = (r, s) => s.after.filter(a => !isHeader(r.sb[a]) || r.sb[a].uses.length || r.sb[a].eq);
function groupsOf(r, s) {
  const items = s.use.map(u => ({ i: r.ib[u.id], p: u.p }));
  if (!items.length) return [];
  if (s.phase === 'prep') {
    const g = new Map(); items.forEach(x => { const k = kwOf(x.i) || lc(s.short); (g.get(k) || g.set(k, []).get(k)).push(x); });
    return [...g].map(([kw, its]) => ({ kw, items: its }));

}
const sketchSteps = r => r.sch.order.filter(s => !(isHeader(s) && !s.eq));
function rowsOf(r, apart) {
  const P = r.sch.plan, rows = []; let cur = null;
  sketchSteps(r).forEach(s => {
    if (cur && P[s.id].start < cur.end && cur.items.every(x => apart(x, s))) { cur.items.push(s); cur.end = Math.max(cur.end, P[s.id].end); }
    else { cur = { items: [s], start: P[s.id].start, end: P[s.id].end }; rows.push(cur); } });
  return rows;
}
const pic = (x, size) => `<span class="sk-ing">${ingImg(x.i, size, markOf(null, x.i))}<small>${esc(amtOf(x.i, x.p) || 'etter smak')}</small><em>${esc(nameOf(x.i, x.p))}</em></span>`;
const chips = s => [s.mode && s.mode !== 'off' ? `<span class="chip heat">${esc(MODE[s.mode] || s.mode)}</span>` : '', s.temp ? `<span class="chip heat">${s.temp} °C</span>` : '',
  s.active ? `<span class="chip time">${s.active} min</span>` : '', s.passive ? `<span class="chip wait">står ${hm(s.passive)}</span>` : ''].join('');
/* Bildet på et steg: utstyret, med det som går i det lagt oppå. Vi har ikke bilder av mellomresultater, så dette er en haug av ingrediensene. */
const stepPic = (r, s, size = 34) => { const its = s.use.map(u => r.ib[u.id]).slice(0, 3);
  return `<span class="sk-pile">${s.eq ? eqImg(s.eq, size + 6) : ''}${its.map((i, k) => `<span class="pl" style="--k:${k}">${ingImg(i, size)}</span>`).join('')}</span>`; };
const nid = (r, s) => `${r.id}-${s.id}`;

/* Sporoppsett, felles for B1–B3: ett spor (kolonne) per del av retten eller per sted maten er. Steg som skjer samtidig i
   hvert sitt spor, deler rad. Da går pilene innen et spor rett ned gjennom tomt rom, og en pil mellom spor kommer bare der
   delene møtes. Sporet med det siste steget står først, og de andre i den rekkefølgen de går inn i det. */
function laneLayout(r, key) {
  const steps = sketchSteps(r), fin = steps.find(s => !steps.some(t => realAfter(r, t).includes(s.id)));
  const P = r.sch.plan, mergeAt = l => Math.min(...steps.filter(s => key(s) !== l && realAfter(r, s).some(a => key(r.sb[a]) === l)).map(s => P[s.id].start), 1e9);
  const firstUse = l => Math.min(...steps.filter(s => key(s) === l).map(s => P[s.id].start));
  const lanes = key === vesselKey
    ? [...new Set(steps.map(key))].sort((a, b) => (a === 'board' ? -1 : b === 'board' ? 1 : a === 'plate' ? 1 : b === 'plate' ? -1 : firstUse(a) - firstUse(b)))
    : [...new Set(steps.map(key))].sort((a, b) => (a === key(fin) ? -1 : b === key(fin) ? 1 : mergeAt(b) - mergeAt(a)));
  /* Rader: hovedsporet så tidlig som mulig, sidesporene så sent som mulig, altså rett før de trengs. Da blir pilen inn i hovedsporet kort. */

  steps.forEach(s => { L[s.id] = Math.max(0, ...realAfter(r, s).map(a => (L[a] ?? -1) + 1), prevIn[s.id] ? L[prevIn[s.id]] + 1 : 0); });
  [...steps].reverse().forEach(s => { if (key(s) === key(fin) || !succ[s.id].length) return; L[s.id] = Math.max(L[s.id], Math.min(...succ[s.id].map(t => L[t])) - 1); });

let skWidth = 'wide';
function laneGrid(r, key, laneName, cell, cls, edges) {

  const body = rows.map(row => lanes.map(l => { const s = row.items.find(x => key(x) === l); return `<div class="ln-c">${s ? cell(s) : ''}</div>`; }).join('')).join('');
  return `<div class="skv lanes ${cls} ${stack ? 'stack' : 'side-by-side'}" data-edges="${esc(JSON.stringify(edges))}" style="grid-template-columns:repeat(${lanes.length},minmax(0,1fr))"><svg class="sk-arrows" aria-hidden="true"></svg>
    ${lanes.map(l => `<div class="ln-h">${esc(laneName(l))}</div>`).join('')}${body}</div>`;
}
/* Pilene mellom stegene: «down» innen et spor, «elbow» fra ett spor til et annet. */
const stepEdges = (r, key, labels) => sketchSteps(r).flatMap(s => realAfter(r, s).map(a => [nid(r, r.sb[a]), nid(r, s), labels ? (r.sb[a].out || '') : '', key(r.sb[a]) === key(s) ? 'down' : 'elbow']));
const compKey = s => s.c === 'ovn' ? (dishOf().steps.find(t => (t.waits || []).includes(s.id))?.c || s.c) : s.c;
const vesselKey = s => s.phase === 'prep' ? 'board' : s.phase === 'serve' ? 'plate' : (s.eq || 'board');
const vesselName = v => v === 'board' ? 'Benken' : v === 'plate' ? 'Servering' : (EQ[v] || v);

/* B1 · Kortstabel: kortene i sporene, med ingrediensene inne i kortet. */
function skB1(r) {
  let k = 0;
  const card = s => { const gs = groupsOf(r, s), tilt = [-1.1, 0.7, -0.4, 1, -0.8][k++ % 5];
    return `<div class="b1-card ph-${s.phase}" data-n="${nid(r, s)}" style="--tilt:${tilt}deg"><div class="b1-top"><span class="hand b1-v">${esc(s.short)}</span>${s.eq ? `<span class="b1-eq">${eqImg(s.eq, 22)}</span>` : ''}</div>
      <div class="b1-grps">${gs.map(g => `<div class="b1-grp">${g.kw !== lc(s.short) ? `<span class="hand kwh">${esc(g.kw)}</span>` : ''}<span class="syms">${g.items.map(x => pic(x, 46)).join('')}</span></div>`).join('')}</div>
      <div class="chips"><span class="chip at">min ${r.sch.plan[s.id].start}</span>${chips(s)}</div></div>`; };
  return laneGrid(r, compKey, c => compName(r, c), card, 'b1', stepEdges(r, compKey, false));
}

/* B2 · Inn i steget: ingrediensene rett ved steget med nøkkelordet håndskrevet over, og en kort pil inn. Pilen videre bærer resultatet. */
function skB2(r) {
  const edges = stepEdges(r, compKey, true);
  const cell = s => { const gs = groupsOf(r, s);
    if (gs.length) edges.push([`${nid(r, s)}-ings`, nid(r, s), '', 'in']);
    return `<div class="b2-cell"><div class="b2-ings${gs.length > 2 ? ' many' : ''}" data-n="${nid(r, s)}-ings">${gs.map((g, j) => `<div class="b2-grp" data-n="${nid(r, s)}-g${j}">${g.kw !== lc(s.short) ? `<span class="hand kwh">${esc(g.kw)}</span>` : ''}<span class="syms">${g.items.map(x => pic(x, 40)).join('')}</span></div>`).join('')}</div>
      <div class="b2-node ph-${s.phase}" data-n="${nid(r, s)}">${stepPic(r, s, 30)}<span class="hand b2-v">${esc(s.short)}</span><div class="chips"><span class="chip at">min ${r.sch.plan[s.id].start}</span>${chips(s)}</div></div></div>`; };
  const g = laneGrid(r, compKey, c => compName(r, c), cell, 'b2', edges);

}

/* B3 · Stasjoner: ett spor per sted maten er (benken, kjelen, panna, ovnen), med ingrediensene ved steget, som i lammeskissen. */
function skB3(r) {
  const edges = stepEdges(r, vesselKey, false);
  const cell = s => { const gs = groupsOf(r, s);
    if (gs.length) edges.push([`${nid(r, s)}-ings`, nid(r, s), '', 'in']);
    return `<div class="b3-cell2"><div class="b3-ings${gs.length > 2 ? ' many' : ''}" data-n="${nid(r, s)}-ings">${gs.map((g, j) => `<div class="b3-grp" data-n="${nid(r, s)}-g${j}">${g.kw !== lc(s.short) && g.kw !== 'tilsett' ? `<span class="hand kwh">${esc(g.kw)}</span>` : ''}<span class="syms">${g.items.map(x => pic(x, 36)).join('')}</span></div>`).join('')}</div>
      <div class="b3-node ph-${s.phase}" data-n="${nid(r, s)}">${stepPic(r, s, 30)}<span class="hand b3-v">${esc(s.short)}</span><div class="chips"><span class="chip at">min ${r.sch.plan[s.id].start}</span>${chips(s)}</div></div></div>`; };
  return laneGrid(r, vesselKey, vesselName, cell, 'b3', edges);
}

/* Tegnede piler: kubiske kurver med litt skjelving, tegnet to ganger, og et åpent pilhode. Tilfeldigheten er seedet på

  const R = seeded(seed), j = (a = 1.5) => (R() - 0.5) * 2 * a;
  const d = a => `M${x0 + j(a)} ${y0 + j(a)} C${x1 + j(a * 2)} ${y1 + j(a * 2)} ${x2 + j(a * 2)} ${y2 + j(a * 2)} ${x3 + j(a * 0.6)} ${y3 + j(a * 0.6)}`;

  const head = `M${x3 - ux * hl + uy * hw} ${y3 - uy * hl - ux * hw} L${x3} ${y3} L${x3 - ux * hl - uy * hw + j()} ${y3 - uy * hl + ux * hw + j()}`;
  return `<path class="pa" d="${d(1.2)}"/><path class="pa pa2" d="${d(2.2)}"/><path class="pa" d="${head}"/>${label ? `<text class="pl" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(label)}</text>` : ''}`;
}
function drawArrows() {
  document.querySelectorAll('.skv').forEach((box, n) => {
    const svg = box.querySelector('.sk-arrows'), B = box.getBoundingClientRect(), k = +(box.dataset.scale || 1), bw = B.width / k, bh = B.height / k;
    svg.setAttribute('viewBox', `0 0 ${bw} ${bh}`); svg.setAttribute('width', bw); svg.setAttribute('height', bh);
    const rect = el => { const R = el.getBoundingClientRect(); return { l: (R.left - B.left) / k, t: (R.top - B.top) / k, r: (R.right - B.left) / k, b: (R.bottom - B.top) / k, cx: ((R.left + R.right) / 2 - B.left) / k, cy: ((R.top + R.bottom) / 2 - B.top) / k }; };
    let out = '';
    JSON.parse(box.dataset.edges || '[]').forEach(([f, t, label, kind, edgeLane]) => {
      const F0 = box.querySelector(`[data-n="${f}"]`), T0 = box.querySelector(`[data-n="${t}"]`); if (!F0 || !T0) return;
      const F = rect(F0), T = rect(T0), seed = f + t;
      /* Fri vei: buen brukes bare når ingen andre noder ligger der den skal gå */
      const others = () => [...box.querySelectorAll('[data-n]')].filter(e => e !== F0 && e !== T0 && !e.contains(F0) && !e.contains(T0)).map(rect);
      const clear = (a, b, c, d) => { const os = others(); for (let i = 1; i < 24; i++) { const u = i / 24, v = 1 - u;
        const x = v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0], y = v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1];
        if (os.some(o => x > o.l - 6 && x < o.r + 6 && y > o.t - 6 && y < o.b + 6)) return false; } return true; };
      /* Delta: en S-kurve når målet ligger omtrent på linje. Ligger det langt opp eller ned i forhold til avstanden,
         går pila ut fra under (eller over) kilden og svinger i én myk bue inn mot målet, så hodet følger retningen pila faktisk har. */
      if (kind === 'deltaH') {
        const y3 = Math.max(T.t + 14, Math.min(T.b - 14, F.cy)), gap = T.l - F.r, dy = y3 - F.cy, p3 = [T.l - 5, y3];
        const room = dy > 0 ? y3 - F.b : F.t - y3;

          const c1 = [p0[0], p0[1] + (p3[1] - p0[1]) * 0.62], c2 = [p3[0] - (p3[0] - p0[0]) * 0.62, p3[1]];

        }
        const p0 = [F.r + 3, F.cy], dx = Math.max(14, (p3[0] - p0[0]) * 0.5);
        /* Bratt og trangt: pila går ut vannrett og kommer inn på skrå, med hodet i samme retning som streken */
        const c2 = Math.abs(p3[1] - p0[1]) > (p3[0] - p0[0]) * 0.8 ? [p3[0] - (p3[0] - p0[0]) * 0.3, p3[1] - (p3[1] - p0[1]) * 0.3] : [p3[0] - dx, p3[1]];
        out += handCurve(p0, [p0[0] + dx, p0[1]], c2, p3, seed); return;
      }
      if (kind === 'delta') {
        const x3 = Math.max(T.l + 16, Math.min(T.r - 16, F.cx)), gap = T.t - F.b, dx = x3 - F.cx, p3 = [x3, T.t - 5];
        const room = dx > 0 ? x3 - F.r : F.l - x3;
        if (room > 24 && Math.abs(dx) > gap * 1.2) {

          const c1 = [p0[0] + (p3[0] - p0[0]) * 0.62, p0[1]], c2 = [p3[0], p3[1] - (p3[1] - p0[1]) * 0.62];
          if (clear(p0, c1, c2, p3)) { out += handCurve(p0, c1, c2, p3, seed); return; }
        }
        const p0 = [F.cx, F.b + 3], dy = Math.max(14, (p3[1] - p0[1]) * 0.5);
        const c2 = Math.abs(p3[0] - p0[0]) > (p3[1] - p0[1]) * 1.2 ? [p3[0] - (p3[0] - p0[0]) * 0.3, p3[1] - (p3[1] - p0[1]) * 0.3] : [p3[0], p3[1] - dy];
        out += handCurve(p0, [p0[0], p0[1] + dy], c2, p3, seed); return;
      }
      if (kind === 'thread') {
        const p0 = [F.cx, F.cy + 7], p3 = [T.cx, T.cy - 7], dy = (p3[1] - p0[1]) / 3, R = seeded(seed), w = (R() - 0.5) * 6;
        out += `<path class="pa thread" d="M${p0[0]} ${p0[1]} C${p0[0] + w} ${p0[1] + dy} ${p3[0] - w} ${p3[1] - dy} ${p3[0]} ${p3[1]}"/>`; return;

        const gx = F.r + 8 + 7 * (edgeLane ?? 0), y0 = F.cy, y3 = T.cy;
        out += `<path class="pa track" d="M${F.r - 2} ${y0} Q${gx} ${y0} ${gx} ${y0 + 10} L${gx} ${y3 - 10} Q${gx} ${y3} ${T.r + 1} ${y3}"/><path class="pa track" d="M${T.r + 7} ${y3 - 4} L${T.r + 1} ${y3} L${T.r + 7} ${y3 + 4}"/>`; return;
      }
      if (kind === 'twig') {
        const p0 = [F.r + 6, F.cy], p3 = [T.l - 6, T.cy], dx = Math.max(10, (p3[0] - p0[0]) / 2);
        out += handCurve(p0, [p0[0] + dx, p0[1]], [p3[0] - dx, p3[1]], p3, seed); return;
      }
      if (kind === 'pour' || kind === 'twigR' || kind === 'twigL') {
        const p0 = kind === 'twigR' ? [F.l - 3, F.cy] : [F.r + 3, F.cy];
        const p3 = kind === 'twig' ? [T.l - 2, T.cy] : kind === 'pour' ? [T.l - 6, T.t + 26] : kind === 'twigR' ? [T.r + 6, T.t + 22] : [T.l - 6, T.t + 22];
        const dx = (p3[0] - p0[0]) / 2;
        out += handCurve(p0, [p0[0] + dx, p0[1]], [p3[0] - dx, p3[1]], p3, seed); return;
      }
      if (kind === 'bowlnext') {
        const x = Math.min(F.cx, T.cx), p0 = [x, F.b + 2], p3 = [x, T.t + 2], dy = (p3[1] - p0[1]) / 2;
        out += handCurve(p0, [x + 10, p0[1] + dy], [x - 10, p3[1] - dy], p3, seed); return;
      }
      if (kind === 'snake') {
        /* Rett ned i sin egen kolonne til neste rad, så en sving inn i neste steg fra siden. Streken går aldri inn i grenen i raden over. */
        const goRight = T.cx > F.cx, x0 = goRight ? Math.min(F.r - 10, F.l + 40) : Math.max(F.l + 10, F.r - 40);
        const p0 = [x0, F.b + 2], p3 = [goRight ? T.l - 6 : T.r + 6, T.t + 14];
        out += handCurve(p0, [x0, p3[1] - 6], [x0 + (p3[0] - x0) * 0.4, p3[1]], p3, seed); return;
      }
      if (kind === 'branch') {
        const p0 = [F.r + 4, F.cy], p3 = [T.l - 5, Math.min(T.cy, T.t + 34)], dx = (p3[0] - p0[0]) / 2;
        out += handCurve(p0, [p0[0] + dx, p0[1]], [p3[0] - dx, p3[1]], p3, seed);
        return;
      }
      if (kind === 'next' || kind === 'seq') {
        const x = T.l + 26, p0 = [x, F.b + 3], p3 = [x, T.t - 5], dy = (p3[1] - p0[1]) / 2;
        if (kind === 'seq') { out += `<path class="pa seq" d="M${p0[0]} ${p0[1]} C${x + 6} ${p0[1] + dy} ${x - 6} ${p3[1] - dy} ${x} ${p3[1]}"/>`; return; }
        out += handCurve(p0, [x + 7, p0[1] + dy], [x - 7, p3[1] - dy], p3, seed, label, x + 14, (p0[1] + p3[1]) / 2 + 5, 'start');
        return;
      }
      if (kind === 'in') {
        /* Ingrediens inn i steget: kort pil fra siden eller ovenfra, avhengig av hvor gruppen står. */
        if (F.r <= T.l + 4) { const p0 = [F.r + 4, F.cy], p3 = [T.l - 5, T.cy], dx = (p3[0] - p0[0]) / 2;
          out += handCurve(p0, [p0[0] + dx, p0[1] - 10], [p3[0] - dx, p3[1] + 10], p3, seed); }
        else { const p0 = [F.cx, F.b + 3], p3 = [T.cx, T.t - 5], dy = (p3[1] - p0[1]) / 2;
          out += handCurve(p0, [p0[0] + 8, p0[1] + dy], [p3[0] - 8, p3[1] - dy], p3, seed); }
      } else if (kind === 'down') {
        const gx = box.classList.contains('stack') ? Math.min(F.r, T.r) - 22 : null;
        const p0 = [gx ?? F.cx, F.b + 3], p3 = [gx ?? T.cx, T.t - 5], dy = Math.max(12, (p3[1] - p0[1]) * 0.45), w = (seeded(seed)() - 0.5) * (gx ? 14 : 24);
        out += handCurve(p0, [p0[0] + w, p0[1] + dy], [p3[0] - w, p3[1] - dy], p3, seed, label, (p0[0] + p3[0]) / 2 + 12, (p0[1] + p3[1]) / 2 + 5, 'start');
      } else {
        /* Fra ett spor til et annet: ned fra steget, så en sving inn fra siden på steget den går til. */
        const right = T.cx > F.cx, p0 = [F.cx, F.b + 3], p3 = [right ? T.l - 5 : T.r + 5, T.t + Math.min(22, (T.b - T.t) / 2)];
        out += handCurve(p0, [p0[0], p0[1] + (p3[1] - p0[1]) * 0.85], [p0[0] + (p3[0] - p0[0]) * 0.35, p3[1]], p3, seed, label,
          p0[0] + (right ? 10 : -10), p0[1] + (p3[1] - p0[1]) * 0.5, right ? 'start' : 'end');
      }
    });
    svg.innerHTML = `<defs><filter id="rough${n}" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="${n + 3}"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs><g filter="url(#rough${n})">${out}</g>`;
  });
}

/* ---------- stamme med greiner (sidekolonnen i «Lag mat») ----------
   Hovedløpet er stegene i den rekkefølgen du jobber, ovenfra og ned. Ventetid tar ikke plass.
   Greiner: steg som lager én ting til ett senere steg og ikke bygger på noe annet (kutting, marinade, dressing,
   krydderblanding). De står til venstre for steget de går inn i, med en kort pil inn.
   Lang venting: når resultatet av et steg først brukes flere steg senere, tegnes steget rett før der det brukes, med
   «startet min X», og en påminnelse står der du faktisk gjør det. Pilene går bare mellom naboer, så ingen pil krysser noe. */
function trunkModel(r) {
  const P = r.sch.plan, all = r.sch.order.filter(s => !(isHeader(s) && !s.eq && !s.setup));
  const setups = all.filter(s => s.setup && !s.uses.length), steps = all.filter(s => !setups.includes(s));
  const consumers = {}; steps.forEach(s => consumers[s.id] = []);
  steps.forEach(s => realAfter(r, s).forEach(a => consumers[a]?.push(s.id)));
  const isBranch = s => s.phase === 'prep' && !realAfter(r, s).length && consumers[s.id].length === 1;
  const branchOf = {}; steps.filter(isBranch).forEach(s => (branchOf[consumers[s.id][0]] ??= []).push(s));
  let trunk = steps.filter(s => !isBranch(s));
  const moved = {}, reminders = [];
  /* Flytt bare det som står lenge med vilje (marinering, heving, kjøling: minst 30 min) eller der resultatet blir liggende
     og vente i minst 15 min, og som brukes flere steg senere. Det flyttes ned til rett før steget som bruker det. */
  const parked = s => { const cs = consumers[s.id]; if (cs.length !== 1) return false;
    return s.passive >= 30 || P[cs[0]].start - P[s.id].end >= 15; };
  trunk.filter(parked).forEach(s => {
    const i = trunk.indexOf(s), j = trunk.findIndex(t => t.id === consumers[s.id][0]);
    if (j < 0 || j - i - 1 < 2) return;
    moved[s.id] = true; reminders.push({ s, before: trunk[i + 1].id });
    trunk.splice(i, 1); trunk.splice(trunk.findIndex(t => t.id === consumers[s.id][0]), 0, s);
  });
  setups.forEach(s => { const nx = trunk.find(t => P[t.id].start >= P[s.id].start) || trunk[trunk.length - 1]; reminders.push({ s, before: nx.id, setup: true }); });
  const no = {}; trunk.forEach((s, k) => no[s.id] = k + 1);
  return { trunk, branchOf, moved, reminders, no, consumers };
}

function vTrunk(r, style) {
  const { trunk, branchOf, moved, reminders, no } = trunkModel(r), P = r.sch.plan, edges = [];
  const remOf = id => reminders.filter(x => x.before === id);
  const row = (s, k) => {
    const prev = trunk[k - 1], feeds = prev && realAfter(r, s).includes(prev.id);
    if (prev) edges.push([nid(r, prev), nid(r, s), feeds ? (prev.out || '') : '', feeds ? 'next' : 'seq']);
    const brs = branchOf[s.id] || [];
    brs.forEach((b, j) => edges.push([`${nid(r, b)}-br`, nid(r, s), '', 'branch']));
    const far = realAfter(r, s).filter(a => a !== prev?.id && no[a]).map(a => `<span class="tr-in">↳ ${esc(r.sb[a].out || r.sb[a].short.toLowerCase())} <b>fra ${no[a]}</b></span>`).join('');
    const gs = groupsOf(r, s), ings = gs.map(g => `<div class="tr-grp">${g.kw !== lc(s.short) ? `<span class="hand kwh">${esc(g.kw)}</span>` : ''}<span class="syms">${g.items.map(x => pic(x, 30)).join('')}</span></div>`).join('');
    const left = [...remOf(s.id).map(x => `<div class="tr-rem${x.setup ? ' setup' : ''}"><b>min ${P[x.s.id].start}</b> ${x.setup ? esc(x.s.short) + (x.s.temp ? ` ${x.s.temp} °C` : '') : `start «${esc(x.s.short.toLowerCase())}»<br>→ steg ${no[x.s.id]}`}</div>`),
      ...brs.map(b => `<div class="tr-br" data-n="${nid(r, b)}-br"><span class="hand tr-brv">${esc(b.short)}</span>${groupsOf(r, b).map(g => `<div class="tr-grp">${g.kw !== lc(b.short) ? `<span class="hand kwh">${esc(g.kw)}</span>` : ''}<span class="syms">${g.items.map(x => pic(x, 30)).join('')}</span></div>`).join('')}</div>`)].join('');
    const badge = moved[s.id] ? `<span class="chip moved">startet min ${P[s.id].start}</span>` : `<span class="chip at">min ${P[s.id].start}</span>`;
    const node = style === 'card'
      ? `<div class="tr-node card ph-${s.phase}${moved[s.id] ? ' moved' : ''}" data-n="${nid(r, s)}"><div class="tr-h"><span class="tr-no">${no[s.id]}</span><span class="hand tr-v">${esc(s.short)}</span></div>${ings}${far}<div class="chips">${badge}${chips(s)}</div></div>`
      : `<div class="tr-node ph-${s.phase}${moved[s.id] ? ' moved' : ''}" data-n="${nid(r, s)}"><div class="tr-h"><span class="tr-no">${no[s.id]}</span>${stepPic(r, s, 24)}</div><span class="hand tr-v">${esc(s.short)}</span>${ings}${far}<div class="chips">${badge}${chips(s)}</div></div>`;
    return `<div class="tr-row"><div class="tr-left">${left}</div>${node}</div>`;
  };
  const body = trunk.map(row).join('');
  return `<div class="skv trunk ${style}" data-edges="${esc(JSON.stringify(edges))}"><svg class="sk-arrows" aria-hidden="true"></svg>${body}</div>`;
}
const skS1 = r => vTrunk(r, 'node');
const skS2 = r => vTrunk(r, 'card');

/* ---------- minimalisme: tre alternativer (M1–M3) ----------
   Samme grunnlag som stammen: rekkefølgen du jobber, grener for små forberedelser, og det som står lenge vist der det
   brukes. Per steg står bare ett håndskrevet verb, ingrediensbildene med mengden under, og små tegn for varme og venting. */
const VERB_EN = { rinse: 'skyll', prepare: 'gjør klar', cook: 'kok', fry: 'fres', reduce: 'kok inn', simmer: 'småkok', steam: 'damp', season: 'smak til',
  stir: 'rør inn', serve: 'server', add: 'tilsett', bake: 'stek', grill: 'grill', mix: 'bland', whisk: 'pisk', chop: 'hakk', boil: 'kok', rest: 'hvil',
  toss: 'vend', coat: 'dekk', marinate: 'mariner', melt: 'smelt', brown: 'brun' };
const VERB_NO = new Set(['dampstek', 'fres', 'kok', 'skyll', 'bland', 'hakk', 'rør', 'mariner', 'grill', 'stek', 'smelt', 'pisk', 'vend', 'brun', 'kutt', 'skjær', 'riv', 'forvarm',
  'legg', 'spe', 'server', 'smak', 'rist', 'lag', 'skrell', 'press', 'sikt', 'kle', 'avkjøl', 'hvil', 'dekk', 'form', 'pensle', 'hev', 'elt', 'damp', 'ta', 'skyll']);
function verbOf(r, s) {
  const ws = s.short.toLowerCase().split(/\s+/), w = ws[0];
  /* Engelske oppskrifter får engelske verb, med partikkel («stir in»). */
  if (VERB_EN[w]) return ['in', 'off', 'up', 'through', 'out', 'down'].includes(ws[1]) ? w + ' ' + ws[1] : w;
  const PART = new Set(['av', 'ut', 'opp', 'inn', 'til', 'over', 'på', 'sammen', 'ned', 'fra']);
  if (w === 'ha' && ws[1] === 'i') return 'ha i';
  if (PART.has(ws[1]) && ['ta', 'la', 'kok', 'rør', 'legg', 'slå', 'hell', 'smak', 'skru', 'trekk', 'vend', 'spe', 'rist'].includes(w)) return w + ' ' + ws[1];
  if (w === 'la') return 'la ' + ws[ws.length - 1];
  if (VERB_NO.has(w)) return w;
  if (s.phase === 'serve') return 'server';
  /* Ukjent verb: stegets korte navn i sin helhet, heller enn å gjette */
  return lc(s.short);
}
/* Varme: en kokeplate med 1–3 streker over. Tid: et håndtegnet timeglass. Begge i blyantstrek. */
const HEAT = n => `<svg class="ic-heat" viewBox="0 0 24 18" aria-hidden="true"><path class="pl-ring" d="M2.5 16 H21.5"/>${[0, 1, 2].map(k => `<path class="${k < n ? 'on' : 'off'}" d="M${6 + k * 6} 13 C${4 + k * 6} 10 ${8 + k * 6} 8 ${6 + k * 6} 3"/>`).join('')}</svg>`;
const GLASS = '<svg class="ic-glass" viewBox="0 0 12 16" aria-hidden="true"><path d="M2 1.5h8M2 14.5h8M3 2c0 4 6 4 6 6s-6 2-6 6M9 2c0 4-6 4-6 6s6 2 6 6"/></svg>';
const CLOCK = '<svg class="ic-glass" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7.5" r="5.2"/><path d="M7 4.5V7.6l2 1.2M3 1.6l-1.4 1.3M11 1.6l1.4 1.3"/></svg>';
const heatN = s => ({ low: 1, medium_low: 2, medium: 2, medium_high: 3, high: 3 })[s.mode] || 0;
const signs = s => `${heatN(s) ? `<span class="mn-heat" title="${esc(MODE[s.mode] || '')}">${HEAT(heatN(s))}</span>` : ''}${s.temp ? `<span class="hand mn-temp">${s.temp}°</span>` : ''}${s.passive >= 5 ? `<span class="mn-wait" title="står ${hm(s.passive)}">${GLASS}<span class="hand">${s.passive}</span></span>` : ''}`;
const mpic = (x, size) => `<span class="mn-ing" title="${esc(labelOf(x.i, x.p))}">${ingImg(x.i, size, markOf(null, x.i))}<small>${esc(amtOf(x.i, x.p) || '')}</small></span>`;
const ingsOf = (r, s, size) => s.use.map(u => mpic({ i: r.ib[u.id], p: u.p }, size)).join('');
/* Grenens innhold: hvert nøkkelord ett ord, bildene under. */
/* Verb + objekt når bildene ikke sier det: steget har ingen egne bilder, eller samme verb står i nabosteget. Maks tre ord. */
/* Verb som sier for lite alene. De får alltid objektet med («kok risen», ikke «kok»). */
const GENERIC_VERB = new Set(['ha i', 'cook', 'make', 'prepare', 'kok', 'lag', 'tilbered', 'gjør']);
function labelFor(r, s, hasPics, near) {
  const v = verbOf(r, s);
  if (hasPics && !near.includes(v) && !GENERIC_VERB.has(v)) return v;
  const ws = s.short.toLowerCase().split(/\s+/);
  return ws.length <= 4 ? ws.join(' ') : v + ' ' + ws[ws.length - 1];
}
const branchHtml = (r, b, size) => groupsOf(r, b).map(g => `<span class="mn-bg"><span class="hand mn-kw">${esc(g.kw === lc(b.short) ? verbOf(r, b) : g.kw)}</span><span class="mn-syms">${g.items.map(x => mpic(x, size)).join('')}</span></span>`).join('');
const remHtml = (r, x, no) => `<span class="mn-rem${x.setup ? ' setup' : ''}">${x.setup ? `${esc(verbOf(r, x.s))}${x.s.temp ? ` ${x.s.temp}°` : ''}` : `⏰ ${esc(verbOf(r, x.s))} → ${no[x.s.id]}`}</span>`;
const fromHtml = (r, s, prev, no) => realAfter(r, s).filter(a => a !== prev?.id && no[a]).map(a => `<span class="mn-from">← ${no[a]}</span>`).join('');

/* M1 · Tråd: én blyantlinje, et punkt per steg, verbet og bildene ved siden av. Grenene er kvister inn på linjen. */
function skM1(r) {
  const { trunk, branchOf, moved, reminders, no } = trunkModel(r), edges = [];
  const rows = trunk.map((s, k) => { const prev = trunk[k - 1];
    if (prev) edges.push([`${nid(r, prev)}-dot`, `${nid(r, s)}-dot`, '', 'thread']);
    const brs = branchOf[s.id] || []; brs.forEach(b => edges.push([`${nid(r, b)}-br`, `${nid(r, s)}-dot`, '', 'twig']));
    const left = [...reminders.filter(x => x.before === s.id).map(x => remHtml(r, x, no)), ...brs.map(b => `<span class="mn-br" data-n="${nid(r, b)}-br">${branchHtml(r, b, 30)}</span>`)].join('');
    return `<div class="m1-row"><div class="m1-left">${left}</div><div class="m1-dot ph-${s.phase}${moved[s.id] ? ' parked' : ''}" data-n="${nid(r, s)}-dot"><i></i><small>${no[s.id]}</small></div>
      <div class="m1-body"><div class="mn-head"><span class="hand mn-v">${esc(verbOf(r, s))}</span>${signs(s)}${fromHtml(r, s, prev, no)}</div><div class="mn-syms">${ingsOf(r, s, 40)}</div></div></div>`; }).join('');
  return `<div class="skv m1" data-edges="${esc(JSON.stringify(edges))}"><svg class="sk-arrows" aria-hidden="true"></svg>${rows}</div>`;
}

/* T1–T3: videreutviklinger av M1 (tråden). Felles: to-ords verb («ta av», «kok opp»), og det som kommer inn fra et
   tidligere steg vises uten tall. */
/* Hovedingrediensen i et resultat: den første ingrediensen som ikke er en basisvare, i steget eller bakover i kjeden. */
function repOf(r, id, seen = new Set()) {
  const s = r.sb[id]; if (!s || seen.has(id)) return null; seen.add(id);
  const own = s.use.map(u => r.ib[u.id]).find(i => !i.staple) || null;
  if (own) return own;
  for (const a of realAfter(r, s)) { const x = repOf(r, a, seen); if (x) return x; }
  return s.use.map(u => r.ib[u.id])[0] || null;
}
const inWords = (r, s, prev, no) => realAfter(r, s).filter(a => a !== prev?.id && no[a]).map(a => `<span class="hand tn-word">↳ ${esc(r.sb[a].out || lc(r.sb[a].short))}</span>`).join('');
/* Varianten bestemmer innløp (faded / track), grener (true/false) og bildestørrelse. */
function vThread(r, o) {
  const { trunk, branchOf, moved, reminders, no } = trunkModel(r), edges = [];
  const idx = {}; trunk.forEach((s, k) => idx[s.id] = k);
  /* Spor (T2): hvert innløp fra et ikke-nabosteg får en egen smal gate til høyre for tråden, så sporene aldri overlapper. */
  const tracks = []; if (o.incoming === 'track') {
    trunk.forEach((s, k) => realAfter(r, s).forEach(a => { if (idx[a] != null && idx[a] < k - 1) tracks.push({ a, s: s.id, lo: idx[a], hi: k }); }));
    tracks.sort((x, y) => (x.hi - x.lo) - (y.hi - y.lo)).forEach(t => { let lane = 0; while (tracks.some(u => u !== t && u.lane === lane && u.lo < t.hi && t.lo < u.hi)) lane++; t.lane = lane; });
  }
  const gutter = o.incoming === 'track' ? 12 + 7 * Math.max(0, ...tracks.map(t => t.lane + 1)) : 0;
  const rows = trunk.map((s, k) => { const prev = trunk[k - 1];
    if (prev) edges.push([`${nid(r, prev)}-dot`, `${nid(r, s)}-dot`, '', 'thread']);
    const brs = o.branches ? (branchOf[s.id] || []) : [];
    brs.forEach(b => edges.push([`${nid(r, b)}-br`, `${nid(r, s)}-dot`, '', 'twig']));
    const rem = reminders.filter(x => x.before === s.id).map(x => `<span class="mn-rem${x.setup ? ' setup' : ''}">${CLOCK}<span class="hand">${x.setup ? `${esc(labelFor(r, x.s, false, []))}${x.s.temp ? ` ${x.s.temp}°` : ''}` : `${esc(labelFor(r, x.s, false, []))} ↓`}</span></span>`).join('');
    /* Grenen: nøkkelordet over bildene, venstrejustert, og pilen ut fra høyre kant av bildeflaten. Store grener blir en kompakt klynge. */
    const left = o.branches ? `<div class="m1-left">${rem}${brs.map(b => { const big = b.use.length > 5;
      return `<div class="brn${big ? ' big' : ''}">${groupsOf(r, b).map((g, j) => `<div class="brn-g"><span class="hand brn-kw">${esc(g.kw === lc(b.short) ? labelFor(r, b, true, []) : g.kw)}</span><div class="brn-pics"${j === 0 ? ` data-n="${nid(r, b)}-br"` : ''}>${g.items.map(x => mpic(x, big ? 24 : 30)).join('')}</div></div>`).join('')}</div>`; }).join('')}</div>` : '';
    /* Uten grener (T3): forberedelsen ligger i bildet, med klargjøringen som ett ord under. */
    const folded = o.branches ? '' : (branchOf[s.id] || []).flatMap(b => b.use.map(u => { const i = r.ib[u.id], kw = kwOf(i);
      return `<span class="mn-ing" title="${esc(labelOf(i, u.p))}">${ingImg(i, o.size, markOf(null, i))}<small>${esc(amtOf(i, u.p) || '')}</small>${kw ? `<em class="hand">${esc(kw.replace(/^kutt i /, ''))}</em>` : ''}</span>`; })).join('');
    const own = s.use.map(u => mpic({ i: r.ib[u.id], p: u.p }, o.size)).join('');
    const inc = o.incoming === 'faded' ? inWords(r, s, prev, no) : '';
    const near = [trunk[k - 1], trunk[k + 1]].filter(Boolean).map(t => verbOf(r, t)), hasPics = !!(own || folded);

const skT1 = r => vThread(r, { incoming: 'faded', branches: true, size: 40 });

/* ---------- greiner (G1, G2) ----------
   Hovedlinjen er veien til retten med mest aktiv tid. Forberedelser uten forløpere (hakk, riv) brettes inn som kvister. */
function graphOf(r) {
  const steps = sketchSteps(r).filter(s => !(s.setup && !s.uses.length)), setups = sketchSteps(r).filter(s => s.setup && !s.uses.length);
  const ids = new Set(steps.map(s => s.id)), preds = s => realAfter(r, s).filter(a => ids.has(a));
  const cons = {}; steps.forEach(s => cons[s.id] = []); steps.forEach(s => preds(s).forEach(a => cons[a].push(s.id)));
  const fin = steps.find(s => !cons[s.id].length);
  const prepSource = id => r.sb[id].phase === 'prep' && !preds(r.sb[id]).length && cons[id].length === 1;
  const tot = {}; const act = id => tot[id] ??= r.sb[id].active + Math.max(0, ...preds(r.sb[id]).map(act));
  const main = new Set(); for (let cur = fin; cur;) { main.add(cur.id); const ps = preds(cur).filter(a => !prepSource(a)); cur = ps.length ? r.sb[ps.sort((a, b) => act(b) - act(a))[0]] : null; }
  return { steps, setups, preds, cons, fin, prepSource, main };
}

  return `<span class="mn-ing" title="${esc(labelOf(i, u.p))}">${ingImg(i, size, markOf(null, i))}<small>${esc(amtOf(i, u.p) || '')}</small>${kw ? `<em class="hand">${esc(kw.replace(/^kutt i /, ''))}</em>` : ''}</span>`; }).join('');

/* G1 · Greiner av flere steg: hovedlinjen i den rekkefølgen du jobber. Korte løp (1–3 steg) som går inn i hovedlinjen én gang,
   står som en egen liten tråd til venstre og møter hovedlinjen der de brukes. */
function skG1(r) {
  const g = graphOf(r), P = r.sch.plan, { steps, preds, cons, main, prepSource } = g;

  const inChain = new Set(), chainsAt = {};
  steps.forEach(s => {
    if (main.has(s.id) || prepSource(s.id) || cons[s.id].length !== 1 || !main.has(cons[s.id][0])) return;
    const c = [s];
    for (let cur = s; c.length < 3;) { const ps = preds(cur).filter(a => !prepSource(a)); if (ps.length !== 1) break; const p = r.sb[ps[0]];
      if (main.has(p.id) || cons[p.id].length !== 1) break; c.unshift(p); cur = p; }

  g.setups.forEach(s => { const t = trunk.find(t => P[t.id].start >= P[s.id].start) || trunk[trunk.length - 1]; (rem[t.id] ??= []).push(`${CLOCK}<span class="hand">${esc(labelFor(r, s, false, []))}${s.temp ? ` ${s.temp}°` : ''}</span>`); });
  Object.entries(chainsAt).forEach(([at, cs]) => cs.forEach(c => { const t = trunk.find(t => P[t.id].start >= P[c[0].id].start);
    if (t && pos(t.id) < pos(at) - 1) (rem[t.id] ??= []).push(`${CLOCK}<span class="hand">${esc(labelFor(r, c[0], false, []))} ↓</span>`); }));
  const edges = [];
  const rows = trunk.map((s, k) => { const prev = trunk[k - 1];
    if (prev) edges.push([`${nid(r, prev)}-dot`, `${nid(r, s)}-dot`, '', 'thread']);
    const fold = folded[s.id] || [];
    fold.forEach(b => edges.push([`${nid(r, b)}-br`, `${nid(r, s)}-dot`, '', 'twig']));
    const twigs = fold.map(b => `<div class="brn">${groupsOf(r, b).map((gr, j) => `<div class="brn-g"><span class="hand brn-kw">${esc(gr.kw === lc(b.short) ? labelFor(r, b, true, []) : gr.kw)}</span><div class="brn-pics"${j === 0 ? ` data-n="${nid(r, b)}-br"` : ''}>${gr.items.map(x => mpic(x, 30)).join('')}</div></div>`).join('')}</div>`).join('');
    const chains = (chainsAt[s.id] || []).map((c, ci) => { const last = c[c.length - 1];

      return `<div class="chn">${c.map(x => { const fx = folded[x.id] || [], items = [...fx.flatMap(b => b.use), ...x.use];
        return `<div class="chn-step"><div class="chn-b"><div class="chn-h"><span class="hand chn-v">${esc(labelFor(r, x, !!items.length, []))}</span>${signs(x)}</div>${items.length ? `<div class="chn-pics">${kwPics(r, items, 28)}</div>` : ''}</div>
          <i class="chn-dot ph-${x.phase}" data-n="${nid(r, x)}-cdot"></i></div>`; }).join('')}</div>`; }).join('');
    const own = s.use.map(u => mpic({ i: r.ib[u.id], p: u.p }, 40)).join('');
    const near = [trunk[k - 1], trunk[k + 1]].filter(Boolean).map(t => verbOf(r, t));
    const inc = preds(s).filter(a => a !== prev?.id && trunk.some(t => t.id === a)).map(a => `<span class="hand tn-word">↳ ${esc(r.sb[a].out || lc(r.sb[a].short))}</span>`).join('');
    return `<div class="t-row g1-row"><div class="m1-left">${(rem[s.id] || []).map(x => `<span class="mn-rem">${x}</span>`).join('')}${chains}${twigs}</div>
      <div class="m1-dot ph-${s.phase}" data-n="${nid(r, s)}-dot"><i></i></div>
      <div class="m1-body"><div class="mn-head"><span class="hand mn-v">${esc(labelFor(r, s, !!own, near))}</span>${signs(s)}${inc}</div>${own ? `<div class="mn-syms">${own}</div>` : ''}</div></div>`; }).join('');
  return `<div class="skv m1 g1" data-edges="${esc(JSON.stringify(edges))}"><svg class="sk-arrows" aria-hidden="true"></svg>${rows}</div>`;
}

/* G2 · Elvedelta: alle løp starter øverst med ingrediensene sine og flyter sammen nedover mot retten. Hovedløpet står i

   o.order   – et lite nummer ved hvert verb i den rekkefølgen du jobber (G2·1)

  const no = {}; [...steps].sort((a, b) => P[a.id].start - P[b.id].start || P[a.id].aEnd - P[b.id].aEnd).forEach((s, k) => no[s.id] = k + 1);

      ${items.length ? `<div class="g2-pics">${kwPics(r, items, 38)}</div>` : ''}</div>`; };

    return `<div class="skv g2" data-edges="${esc(JSON.stringify(edges))}" style="grid-template-columns:repeat(${leaves(fin.id)},minmax(min-content,1fr));grid-template-rows:repeat(${maxD + 1},auto)"><svg class="sk-arrows" aria-hidden="true"></svg>${cells}</div>`;

  return `<div class="skv g2 compact fit" data-edges="${esc(JSON.stringify(edges))}" style="width:${width}px;grid-template-columns:${width}px;grid-template-rows:repeat(${maxD + 1},auto)"><svg class="sk-arrows" aria-hidden="true"></svg>${cells}</div>`;

/* Skalerer kompakte tegninger ned til bredden de har (nettbrett, A4). Pilene regnes tilbake til uskalert størrelse i drawArrows. */

/* +F · Hele på skjermen: +2 (forberedelser brettet inn), pluss
   1) liggende delta på liggende skjerm: løpene renner fra venstre mot høyre inn i retten,
   2) steg uten egne ingredienser (hvil, avkjøl, form, la dampe) slås sammen med steget før, som et ekstra verb,
   3) tegningen skaleres til den passer i både bredde og høyde, men aldri under 75 %. */
function skFit(r, horizontal, o = {}) {
  const g = graphOf(r), { preds, cons, main } = g;
  const folded = {}, hidden = new Set();
  g.steps.forEach(s => { if (g.prepSource(s.id) && s.id !== g.fin.id) { (folded[cons[s.id][0]] ??= []).push(s); hidden.add(s.id); } });

  const pics = s => { const fs = folded[s.id] || [], bowls = fs.filter(isBowl);
    return bowls.map(b => `<span class="fx-bowl" title="${esc(b.short)}">${kwPics(r, b.use, 28)}</span>`).join('') + kwPics(r, [...fs.filter(b => !isBowl(b)).flatMap(b => b.use), ...s.use], 36); };

  const parent = {}; r.sch.order.forEach(t => ids.has(t.id) && pr(t).forEach(a => { const ra = R(a), rt = R(t.id); if (ra !== rt && !(ra in parent)) { parent[ra] = rt; kids[rt].push(ra); } }));

    if (parent[a] === b) edges.push([`${nid(r, r.sb[a])}-fx`, `${nid(r, r.sb[b])}-fx`, '', horizontal ? 'deltaH' : 'delta']);

    const early = chain.some(x => x.passive >= 30) && !isMain(s.id) ? `<span class="mn-rem">${CLOCK}<span class="hand">start først</span></span>` : '';
    const oven = chain.flatMap(waitsOn).map(x => `<span class="g2-note hand">${esc(labelFor(r, x, false, []))}${x.temp ? ` ${x.temp}°` : ''}</span>`).join('')
      + (also[s.id] || []).map(x => `<span class="g2-note hand fx-also">+ ${esc(resultOf(x))} fra <b class="fx-ref">${no[x.id]}</b></span>`).join('');
    const pos = horizontal ? `grid-column:${maxD - depth[s.id] + 1};grid-row:${span[s.id][0] + 1} / ${span[s.id][1] + 1}` : `grid-row:${maxD - depth[s.id] + 1};grid-column:${span[s.id][0] + 1} / ${span[s.id][1] + 1}`;
    return `<div class="g2-cell" style="${pos}"><div class="g2-node fx-node ph-${s.phase}${isMain(s.id) ? ' main' : ''}${allDone ? ' done' : ''}${chain.some(x => x.id === o.cur) ? ' cur' : ''}" data-n="${nid(r, s)}-fx">${early}${oven}<div class="mn-head fx-head">${head}</div>
      ${its.length ? `<div class="g2-pics">${pics(s)}</div>` : ''}</div></div>`; }).join('');
  const grid = horizontal ? `grid-template-columns:repeat(${maxD + 1},max-content);grid-template-rows:repeat(${leaves(root)},auto)` : `grid-template-columns:repeat(${leaves(root)},minmax(min-content,1fr));grid-template-rows:repeat(${maxD + 1},auto)`;
  return `<div class="skv g2 fx fit2 ${horizontal ? 'horiz' : 'vert'}"${o.fit ? ` data-fit="${o.fit}"` : ''} data-edges="${esc(JSON.stringify(edges))}" style="${grid}"><svg class="sk-arrows" aria-hidden="true"></svg>${cells}</div>`;
}
const PAGE = { portrait: [718, 1047], landscape: [1047, 718] };

  document.querySelectorAll('.skv.fit2').forEach(el => {
    el.style.transform = ''; el.style.zoom = ''; el.style.marginBottom = ''; el.style.marginRight = ''; el.style.marginLeft = ''; el.style.width = '';
    const natW = el.scrollWidth, natH = el.scrollHeight;
