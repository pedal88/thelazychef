{# The password on log in and sign up, with Show: most people arrive from a post, where Google's sign-in is not offered,
   and type it once on a phone. autocomplete: current-password or new-password. #}
{% macro password_field(autocomplete) -%}
<div class="pw-field">
    <label for="password" class="sr-only">Password</label>
    <input id="password" name="password" type="password" autocomplete="{{ autocomplete }}" required
        class="appearance-none rounded-none relative block w-full pl-3 pr-16 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 rounded-b-md focus:outline-none focus:ring-orange-500 focus:border-orange-500 focus:z-10 sm:text-sm"
        placeholder="Password">
    <button type="button" class="pw-show" aria-label="Show password" aria-pressed="false"
        onclick="const on = this.previousElementSibling.type === 'password'; this.previousElementSibling.type = on ? 'text' : 'password'; this.textContent = on ? 'Hide' : 'Show'; this.setAttribute('aria-pressed', on)">Show</button>
</div>
{%- endmacro %}
