{# On every page while an admin views the site as someone else; services/view_as.mark_page puts it first in the body, so
   it needs no layout and carries its own style. The script says why a press did nothing when a fetch was refused. #}
<div id="view-as-bar" role="status">
  <style>
    #view-as-bar { position: sticky; top: 0; z-index: 2147483000; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 8px; padding: 6px 12px; background: #C4422B; color: #fff; font: 500 13px/1.4 system-ui, sans-serif; text-align: center; }
    #view-as-bar form { display: inline; margin: 0; }
    #view-as-bar button { padding: 2px 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }
    #view-as-note { flex-basis: 100%; }
    /* What is pinned to the top of a page moves down by the bar's 34 px */
    body > header.sticky, html.site-menu body:has(.make.has-ovl) > header, .side-card.pagecard { top: 34px; }
    .lbar { top: 98px; }
    .split .side-card { top: 50px; }
    .ovl .fab { top: calc(46px + env(safe-area-inset-top, 0px)); }
    .fab-back, .fab-runs { top: calc(44px + env(safe-area-inset-top, 0px)); }
    @media (max-width: 699px) { .lbar { top: 54px; } }
    @media print { #view-as-bar { display: none; } }
  </style>
  <span>Viewing as {{ seen_as }}</span><span aria-hidden="true">·</span>
  <form method="post" action="{{ url_for('view_as.switch') }}"><input type="hidden" name="role" value="admin"><input type="hidden" name="next" value="{{ request.full_path.rstrip('?') if request.method == 'GET' else '' }}"><button type="submit">Back to admin</button></form>
  <span id="view-as-note" hidden></span>
  <script>
  (function () {
    var send = window.fetch;
    window.fetch = function () {
      return send.apply(this, arguments).then(function (r) {
        if (r.status === 403 && r.headers.get('{{ header }}')) {
          var note = document.getElementById('view-as-note');
          note.textContent = {{ note|tojson }};
          note.hidden = false;
          clearTimeout(window.viewAsNote);  // gone again soon: taller, the bar covers the buttons pinned at the top of a recipe
          window.viewAsNote = setTimeout(function () { note.hidden = true; }, 6000);
        }
        return r;
      });
    };
  })();
  </script>
</div>
