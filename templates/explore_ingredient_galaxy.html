{% extends "base.html" %}

{% block title %}Ingredient galaxy{% endblock %}

{% block head %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/galaxy.css') }}">
{% endblock %}

{% block content %}
<div class="gx">
    <div class="gx-top">
        <div class="gx-panel gx-head">
            <p class="lib-eyebrow">Ingredients</p>
            <h1>Ingredient galaxy</h1>
            <p>Every ingredient in the pantry, around its kind and its group.</p>
            <div class="gx-search">
                <input type="text" id="search-input" placeholder="Find an ingredient" aria-label="Find an ingredient">
                <div id="search-dropdown" class="gx-drop" hidden></div>
            </div>
            <div class="gx-btns">
                <button type="button" id="btn-recenter">Center</button>
                <button type="button" id="btn-physics"><span id="label-physics">Pause</span></button>
            </div>
        </div>
        <div class="gx-panel gx-legend gx-legend-panel">
            <p class="lib-eyebrow">Legend</p>
            <span><i class="m"></i>Group</span>
            <span><i class="s"></i>Kind</span>
            <span><i class="i"></i>Ingredient</span>
        </div>
    </div>
    <div id="galaxy-container" class="gx-map">
        <div id="loading" class="gx-loading">Mapping the pantry…</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('galaxy-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        let simulation, svg, g, zoom;
        let nodesData = [], linksData = [];
        let physicsEnabled = true;

        let cfg = {
            gravity: 0.05,
            repel: -200,
            linkDist: 1.0,
            nodeSize: 1.0,
            linkThick: 1.5,
            fadeStart: 0.3
        };

        // Colours from the design tokens (static/css/tokens.css)
        const css = getComputedStyle(document.documentElement);
        const T = n => css.getPropertyValue(n).trim();
        const C = { paper: T('--color-paper'), ink: T('--color-ink'), muted: T('--color-muted'), line: T('--color-line'),
                    strong: T('--color-line-strong'), accent: T('--color-accent') };
        const strokeOf = d => d.group === 'main_cat' ? C.ink : d.group === 'sub_cat' ? C.muted : C.strong;

        const radiusMap = {
            'main_cat': 44,
            'sub_cat': 30,
            'ingredient': 18
        };

        fetch('/api/graph/ingredient-galaxy')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').remove();
                nodesData = data.nodes;
                linksData = data.links;
                initGraph();
                initSearch();
            });

        function initGraph() {
            zoom = d3.zoom()
                .scaleExtent([0.15, 3])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                    const scale = event.transform.k;
                    let fadeOutPoint = cfg.fadeStart;
                    let fullVisiblePoint = fadeOutPoint + 0.5;
                    let textOpacity = (scale - fadeOutPoint) / (fullVisiblePoint - fadeOutPoint);
                    textOpacity = Math.max(0, Math.min(1, textOpacity));

                    g.selectAll('text').style('opacity', d => {
                        if (d.group !== 'ingredient') {
                            let catOpacity = (scale - 0.1) / (0.4 - 0.1);
                            return Math.max(0, Math.min(1, catOpacity));
                        }
                        return textOpacity;
                    });
                });

            svg = d3.select('#galaxy-container').append('svg')
                .attr('width', width)
                .attr('height', height)
                .call(zoom);

            g = svg.append('g');

            simulation = d3.forceSimulation(nodesData)
                .velocityDecay(0.15) /* Increased from 0.06 to settle faster */
                .force('link', d3.forceLink(linksData).id(d => d.id).distance(d => {
                    let base = (d.source.group === 'main_cat' || d.target.group === 'main_cat') ? 160 : 90;
                    return base * cfg.linkDist;
                }))
                .force('charge', d3.forceManyBody().strength(() => cfg.repel))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collide', d3.forceCollide().radius(d => (radiusMap[d.group] * cfg.nodeSize) + 8).iterations(1))
                .force('x', d3.forceX(width / 2).strength(() => cfg.gravity))
                .force('y', d3.forceY(height / 2).strength(() => cfg.gravity));

            const link = g.append('g')
                .attr('stroke', C.line)
                .attr('stroke-opacity', 0.9)
                .selectAll('line')
                .data(linksData)
                .join('line')
                .attr('stroke-width', d => Math.sqrt(d.weight) * cfg.linkThick)
                .attr('class', 'link');

            const nodeGroup = g.append('g')
                .selectAll('.node')
                .data(nodesData)
                .join('g')
                .attr('class', 'node cursor-pointer')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            nodeGroup.append('circle')
                .attr('r', d => radiusMap[d.group] * cfg.nodeSize)
                .attr('fill', C.paper)
                .attr('stroke', strokeOf)
                .attr('stroke-width', d => d.group === 'ingredient' ? 1.5 : 2);

            nodeGroup.filter(d => d.image)
                .append('image')
                .attr('href', d => (d.image && !d.image.startsWith('http') ? '/' + ('static/' + d.image).replace('//', '/') : d.image))
                .attr('x', d => -(radiusMap[d.group] * cfg.nodeSize))
                .attr('y', d => -(radiusMap[d.group] * cfg.nodeSize))
                .attr('width', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                .attr('height', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                .attr('clip-path', d => `circle(${radiusMap[d.group] * cfg.nodeSize}px at ${radiusMap[d.group] * cfg.nodeSize}px ${radiusMap[d.group] * cfg.nodeSize}px)`);

            nodeGroup.append('text')
                .attr('dy', d => (radiusMap[d.group] * cfg.nodeSize) + 16)
                .attr('text-anchor', 'middle')
                .text(d => d.name)
                .attr('fill', d => d.group === 'ingredient' ? C.muted : C.ink)
                .style('font-family', d => d.group === 'main_cat' ? T('--font-serif') : T('--font-sans'))
                .style('font-size', d => d.group === 'main_cat' ? '16px' : d.group === 'sub_cat' ? '13px' : '12px')
                .style('font-weight', d => d.group === 'ingredient' ? '500' : '600')
                .style('paint-order', 'stroke').style('stroke', C.paper).style('stroke-width', '3px');

            nodeGroup.on('mouseover', function (event, d) {
                nodeGroup.style('opacity', 0.2);
                link.style('stroke-opacity', 0.1);

                const connected = new Set([d.id]);
                link.filter(l => l.source.id === d.id || l.target.id === d.id)
                    .style('stroke-opacity', 1)
                    .style('stroke', C.muted)
                    .each(l => {
                        connected.add(l.source.id);
                        connected.add(l.target.id);
                    });

                nodeGroup.filter(n => connected.has(n.id))
                    .style('opacity', 1)
                    .select('circle')
                    .attr('stroke', C.accent);

                d3.select(this).raise();
            }).on('mouseout', function () {
                nodeGroup.style('opacity', 1)
                    .select('circle')
                    .attr('stroke', strokeOf);
                link.style('stroke-opacity', 0.9).style('stroke', C.line);
            });

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                nodeGroup
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            });

            svg.transition().duration(2000).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.5).translate(-width / 2, -height / 2));
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        document.getElementById('btn-recenter').addEventListener('click', () => {
            svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.5).translate(-width / 2, -height / 2));
        });

        document.getElementById('btn-physics').addEventListener('click', (e) => {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                simulation.alpha(0.1).restart();
                document.getElementById('label-physics').textContent = 'Pause';
            } else {
                simulation.stop();
                document.getElementById('label-physics').textContent = 'Resume';
            }
        });

        function initSearch() {
            const input = document.getElementById('search-input');
            const drop = document.getElementById('search-dropdown');

            input.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                drop.innerHTML = '';
                if (q.length < 2) {
                    drop.hidden = true;
                    return;
                }

                const ings = nodesData.filter(n => n.group === 'ingredient' && n.name.toLowerCase().includes(q)).slice(0, 10);

                if (ings.length === 0) {
                    drop.innerHTML = '<div class="gx-none">No ingredient by that name.</div>';
                } else {
                    ings.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'gx-hit';

                        let parsedImg = r.image;
                        if(parsedImg && !parsedImg.startsWith('http')) {
                            parsedImg = '/' + ('static/' + parsedImg).replace('//', '/');
                        }

                        if (parsedImg) {
                            const img = document.createElement('img');
                            img.src = parsedImg;
                            img.alt = '';
                            div.appendChild(img);
                        } else {
                            div.insertAdjacentHTML('beforeend', '<span class="gx-noimg">{{ icon("carrot") }}</span>');
                        }
                        const label = document.createElement('span');
                        label.textContent = r.name;
                        div.appendChild(label);
                        div.onclick = () => {
                            teleportTo(r);
                            input.value = r.name;
                            drop.hidden = true;
                        };
                        drop.appendChild(div);
                    });
                }
                drop.hidden = false;
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-input') && !e.target.closest('#search-dropdown')) {
                    drop.hidden = true;
                }
            });
        }

        function teleportTo(node) {
            const x = node.x;
            const y = node.y;

            svg.transition().duration(1500)
                .call(zoom.transform, d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(2)
                    .translate(-x, -y)
                );

            g.selectAll('.node').filter(n => n.id === node.id)
                .select('circle')
                .transition().duration(200)
                .attr('stroke', C.accent)
                .attr('stroke-width', 4)
                .transition().duration(2000)
                .attr('stroke', strokeOf)
                .attr('stroke-width', 1.5);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            svg.attr('width', w).attr('height', h);
            simulation.force('center', d3.forceCenter(w / 2, h / 2));
            if (physicsEnabled) simulation.alpha(0.3).restart();
        });
    });
</script>
{% endblock %}
