{% extends "base.html" %}

{% block title %}Recipe galaxy{% endblock %}

{% block head %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/galaxy.css') }}">
{% endblock %}

{% block content %}
<div class="gx">
    <div class="gx-top">
        <div class="gx-panel gx-head">
            <p class="lib-eyebrow">Discover</p>
            <h1>Recipe galaxy</h1>
            <p>Every recipe, around the kitchen it comes from and what it is made with.</p>
            <div class="gx-search">
                <input type="text" id="search-input" placeholder="Find a recipe" aria-label="Find a recipe">
                <div id="search-dropdown" class="gx-drop" hidden></div>
            </div>
            <div class="gx-btns">
                <button type="button" id="btn-recenter">Center</button>
                <button type="button" id="btn-physics"><span id="label-physics">Pause</span></button>
                <button type="button" id="btn-settings" aria-pressed="false" aria-controls="settings-panel">Adjust</button>
            </div>
            <div id="settings-panel" class="gx-adjust" hidden>
            <label><span>Pull to the centre<b id="val-gravity">0.015</b></span><input type="range" id="slide-gravity" min="0" max="0.1" step="0.005" value="0.015"></label>
            <label><span>Push apart<b id="val-repel">-150</b></span><input type="range" id="slide-repel" min="-500" max="-10" step="10" value="-150"></label>
            <label><span>Line length<b id="val-link-dist">1.0x</b></span><input type="range" id="slide-link-dist" min="0.2" max="3.0" step="0.1" value="1.0"></label>
            <label><span>Size<b id="val-node-size">1.0x</b></span><input type="range" id="slide-node-size" min="0.2" max="3.0" step="0.1" value="1.0"></label>
            <label><span>Line thickness<b id="val-link-thick">1.5x</b></span><input type="range" id="slide-link-thick" min="0.1" max="5.0" step="0.1" value="1.5"></label>
            <label><span>Names fade at<b id="val-zoom-fade">0.3</b></span><input type="range" id="slide-zoom-fade" min="0.0" max="1.0" step="0.05" value="0.3"></label>
            </div>
        </div>
        <div class="gx-panel gx-legend gx-legend-panel">
            <p class="lib-eyebrow">Legend</p>
            <span><i class="m"></i>Cuisine</span>
            <span><i class="s"></i>Main protein</span>
            <span><i class="i"></i>Recipe</span>
        </div>
    </div>
    <div id="galaxy-container" class="gx-map">
        <div id="loading" class="gx-loading">Mapping the recipes…</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('galaxy-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        let simulation, svg, g, zoom;
        let nodesData = [], linksData = [];
        let physicsEnabled = true;

        // Mutable Configurations via UI
        let cfg = {
            gravity: 0.015,
            repel: -150,
            linkDist: 1.0,
            nodeSize: 1.0,
            linkThick: 1.5,
            fadeStart: 0.3
        };

        // Colours from the design tokens (static/css/tokens.css)
        const css = getComputedStyle(document.documentElement);
        const T = n => css.getPropertyValue(n).trim();
        const C = { paper: T('--color-paper'), ink: T('--color-ink'), muted: T('--color-muted'), line: T('--color-line'),
                    strong: T('--color-line-strong'), accent: T('--color-accent') };
        const strokeOf = d => d.group === 'cuisine' ? C.ink : d.group === 'protein' ? C.muted : C.strong;

        const radiusMap = {
            'cuisine': 44,
            'protein': 30,
            'recipe': 16
        };

        fetch('/api/graph/galaxy')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').remove();
                nodesData = data.nodes;
                linksData = data.links;
                initGraph();
                initSearch();
            });

        function initGraph() {
            zoom = d3.zoom()
                .scaleExtent([0.15, 3]) // limits zoom
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);

                    // TEXT FADE LOGIC: Map the scale to an opacity (0 out when zoomed out far)
                    const scale = event.transform.k;
                    // Scale fade start based on cfg
                    let fadeOutPoint = cfg.fadeStart;
                    let fullVisiblePoint = fadeOutPoint + 0.5;
                    let textOpacity = (scale - fadeOutPoint) / (fullVisiblePoint - fadeOutPoint);
                    textOpacity = Math.max(0, Math.min(1, textOpacity));

                    // Apply to recipe texts only (keep cuisine/protein visible longer if desired, but here applying to all)
                    g.selectAll('text').style('opacity', d => {
                        // Cuisines/Proteins stay visible longer
                        if (d.group !== 'recipe') {
                            let catOpacity = (scale - 0.2) / (0.5 - 0.2);
                            return Math.max(0, Math.min(1, catOpacity));
                        }
                        return textOpacity;
                    });
                });

            svg = d3.select('#galaxy-container').append('svg')
                .attr('width', width)
                .attr('height', height)
                .call(zoom);

            g = svg.append('g');

            // Force Physics Configuration
            simulation = d3.forceSimulation(nodesData)
                .velocityDecay(0.06)

                // Link force: distance determines target length of lines. 
                // Cuisines push farther away from each other to form distinct zones.
                .force('link', d3.forceLink(linksData).id(d => d.id).distance(d => {
                    let base = (d.source.group === 'cuisine' || d.target.group === 'cuisine') ? 160 : 90;
                    return base * cfg.linkDist;
                }))

                // Repel force: negative strength pushes nodes apart. Keeps clusters breathing.
                .force('charge', d3.forceManyBody().strength(() => cfg.repel))

                // Centering force
                .force('center', d3.forceCenter(width / 2, height / 2))

                // Collide force prevents physical overlaps
                .force('collide', d3.forceCollide().radius(d => (radiusMap[d.group] * cfg.nodeSize) + 8).iterations(2))

                // Gentle X/Y gravitation to stop the network expanding indefinitely
                .force('x', d3.forceX(width / 2).strength(() => cfg.gravity))
                .force('y', d3.forceY(height / 2).strength(() => cfg.gravity));

            const link = g.append('g')
                .attr('stroke', C.line)
                .attr('stroke-opacity', 0.9)
                .selectAll('line')
                .data(linksData)
                .join('line')
                .attr('stroke-width', d => Math.sqrt(d.weight) * cfg.linkThick) // Link thickness
                .attr('class', 'link');

            const nodeGroup = g.append('g')
                .selectAll('.node')
                .data(nodesData)
                .join('g')
                .attr('class', 'node cursor-pointer')
                .on('click', (event, d) => {
                    if (d.group === 'recipe' && d.url) {
                        window.open(d.url, '_blank');
                    }
                })
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            // Base circles
            nodeGroup.append('circle')
                .attr('r', d => radiusMap[d.group] * cfg.nodeSize) // Node Size 
                .attr('fill', C.paper)
                .attr('stroke', strokeOf)
                .attr('stroke-width', d => d.group === 'recipe' ? 1.5 : 2);

            // Images logic (applies to any node with an image)
            nodeGroup.filter(d => d.image)
                .append('image')
                .attr('href', d => d.image)
                .attr('x', d => -(radiusMap[d.group] * cfg.nodeSize))
                .attr('y', d => -(radiusMap[d.group] * cfg.nodeSize))
                .attr('width', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                .attr('height', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                .attr('clip-path', d => `circle(${radiusMap[d.group] * cfg.nodeSize}px at ${radiusMap[d.group] * cfg.nodeSize}px ${radiusMap[d.group] * cfg.nodeSize}px)`)
                .attr('preserveAspectRatio', 'xMidYMid slice');

            // Text configuration
            nodeGroup.append('text')
                .attr('dy', d => (radiusMap[d.group] * cfg.nodeSize) + 16)
                .attr('text-anchor', 'middle')
                .text(d => d.name)
                .attr('fill', d => d.group === 'recipe' ? C.muted : C.ink)
                .style('font-family', d => d.group === 'cuisine' ? T('--font-serif') : T('--font-sans'))
                .style('font-size', d => d.group === 'cuisine' ? '16px' : d.group === 'protein' ? '13px' : '12px')
                .style('font-weight', d => d.group === 'recipe' ? '500' : '600')
                .style('pointer-events', 'none')
                .style('paint-order', 'stroke').style('stroke', C.paper).style('stroke-width', '3px');

            nodeGroup.on('mouseover', function (event, d) {
                nodeGroup.style('opacity', 0.2);
                link.style('stroke-opacity', 0.1);

                const connected = new Set([d.id]);
                link.filter(l => l.source.id === d.id || l.target.id === d.id)
                    .style('stroke-opacity', 1)
                    .style('stroke', C.muted)
                    .each(l => {
                        connected.add(l.source.id);
                        connected.add(l.target.id);
                    });

                nodeGroup.filter(n => connected.has(n.id))
                    .style('opacity', 1)
                    .select('circle')
                    .attr('stroke', C.accent);

                d3.select(this).raise();
            })
                .on('mouseout', function () {
                    nodeGroup.style('opacity', 1)
                        .select('circle')
                        .attr('stroke', strokeOf);
                    link.style('stroke-opacity', 0.9).style('stroke', C.line);
                });

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                nodeGroup
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            });

            // Initial camera entry animation
            svg.transition().duration(2000).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.5).translate(-width / 2, -height / 2));

            initSettings();
        }

        function initSettings() {
            // UI Toggle
            document.getElementById('btn-settings').addEventListener('click', (e) => {
                const panel = document.getElementById('settings-panel');
                panel.hidden = !panel.hidden;
                e.currentTarget.setAttribute('aria-pressed', String(!panel.hidden));
            });

            // Sliders bindings
            const bindSlider = (id, valId, key, updateFn, isForce = true, suffix = '') => {
                const slide = document.getElementById(id);
                const disp = document.getElementById(valId);
                slide.addEventListener('input', (e) => {
                    const v = parseFloat(e.target.value);
                    disp.textContent = v + suffix;
                    cfg[key] = v;
                    if (updateFn) updateFn();
                    if (isForce && physicsEnabled) simulation.alpha(0.3).restart();
                });
            };

            // 1. Center Gravity
            bindSlider('slide-gravity', 'val-gravity', 'gravity', () => {
                simulation.force('x').strength(() => cfg.gravity);
                simulation.force('y').strength(() => cfg.gravity);
            });

            // 2. Repel
            bindSlider('slide-repel', 'val-repel', 'repel', () => {
                simulation.force('charge').strength(() => cfg.repel);
            });

            // 3. Link Distance
            bindSlider('slide-link-dist', 'val-link-dist', 'linkDist', () => {
                simulation.force('link').distance(d => {
                    let base = (d.source.group === 'cuisine' || d.target.group === 'cuisine') ? 160 : 90;
                    return base * cfg.linkDist;
                });
            }, true, 'x');

            // 4. Node Size (Redraw elements)
            bindSlider('slide-node-size', 'val-node-size', 'nodeSize', () => {
                g.selectAll('circle').attr('r', d => radiusMap[d.group] * cfg.nodeSize);
                g.selectAll('image')
                    .attr('x', d => -(radiusMap[d.group] * cfg.nodeSize))
                    .attr('y', d => -(radiusMap[d.group] * cfg.nodeSize))
                    .attr('width', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                    .attr('height', d => (radiusMap[d.group] * cfg.nodeSize) * 2)
                    .attr('clip-path', d => `circle(${radiusMap[d.group] * cfg.nodeSize}px at ${radiusMap[d.group] * cfg.nodeSize}px ${radiusMap[d.group] * cfg.nodeSize}px)`);
                g.selectAll('text').attr('dy', d => (radiusMap[d.group] * cfg.nodeSize) + 16);

                simulation.force('collide', d3.forceCollide().radius(d => (radiusMap[d.group] * cfg.nodeSize) + 8).iterations(2));
            }, true, 'x');

            // 5. Link Thickness
            bindSlider('slide-link-thick', 'val-link-thick', 'linkThick', () => {
                g.selectAll('line').attr('stroke-width', d => Math.sqrt(d.weight) * cfg.linkThick);
            }, false, 'x');

            // 6. Fade Point
            bindSlider('slide-zoom-fade', 'val-zoom-fade', 'fadeStart', () => {
                // To trigger zoom text update manually, dispatch a fake zoom event natively via d3 transform
                const currentTransform = d3.zoomTransform(svg.node());
                g.attr('transform', currentTransform);
                const scale = currentTransform.k;
                let fadeOutPoint = cfg.fadeStart;
                let fullVisiblePoint = fadeOutPoint + 0.5;
                let textOpacity = (scale - fadeOutPoint) / (fullVisiblePoint - fadeOutPoint);
                textOpacity = Math.max(0, Math.min(1, textOpacity));
                g.selectAll('text').style('opacity', d => {
                    if (d.group !== 'recipe') {
                        let catOpacity = (scale - 0.2) / (0.5 - 0.2);
                        return Math.max(0, Math.min(1, catOpacity));
                    }
                    return textOpacity;
                });
            }, false);

        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Controls
        document.getElementById('btn-recenter').addEventListener('click', () => {
            svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.5).translate(-width / 2, -height / 2));
        });

        document.getElementById('btn-physics').addEventListener('click', (e) => {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                simulation.alpha(0.1).restart();
                document.getElementById('label-physics').textContent = 'Pause';
            } else {
                simulation.stop();
                document.getElementById('label-physics').textContent = 'Resume';
            }
        });

        // Search logic
        function initSearch() {
            const input = document.getElementById('search-input');
            const drop = document.getElementById('search-dropdown');

            input.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                drop.innerHTML = '';
                if (q.length < 2) {
                    drop.hidden = true;
                    return;
                }

                const recipes = nodesData.filter(n => n.group === 'recipe' && n.name.toLowerCase().includes(q)).slice(0, 10);

                if (recipes.length === 0) {
                    drop.innerHTML = '<div class="gx-none">No recipe by that name.</div>';
                } else {
                    recipes.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'gx-hit';
                        if (r.image) {
                            const img = document.createElement('img');
                            img.src = r.image;
                            img.alt = '';
                            div.appendChild(img);
                        } else {
                            div.insertAdjacentHTML('beforeend', '<span class="gx-noimg">{{ icon("utensils") }}</span>');
                        }
                        const label = document.createElement('span');
                        label.textContent = r.name;
                        div.appendChild(label);
                        div.onclick = () => {
                            teleportTo(r);
                            input.value = r.name;
                            drop.hidden = true;
                        };
                        drop.appendChild(div);
                    });
                }
                drop.hidden = false;
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-input') && !e.target.closest('#search-dropdown')) {
                    drop.hidden = true;
                }
            });
        }

        function teleportTo(node) {
            const x = node.x;
            const y = node.y;

            svg.transition().duration(1500)
                .call(zoom.transform, d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(1.8) // zoom in close
                    .translate(-x, -y)
                );

            g.selectAll('.node').filter(n => n.id === node.id)
                .select('circle')
                .transition().duration(200)
                .attr('stroke', C.accent)
                .attr('stroke-width', 4)
                .transition().duration(2000)
                .attr('stroke', strokeOf)
                .attr('stroke-width', 1.5);
        }

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            svg.attr('width', w).attr('height', h);
            simulation.force('center', d3.forceCenter(w / 2, h / 2))
                .force('x', d3.forceX(w / 2).strength(0.015))
                .force('y', d3.forceY(h / 2).strength(0.015));
            if (physicsEnabled) simulation.alpha(0.3).restart();
        });
    });
</script>
{% endblock %}
