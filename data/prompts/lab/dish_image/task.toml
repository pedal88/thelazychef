# Dish images: the picture of the whole dish, made first; the component images
# use it as their reference (RECIPE_VISUALIZATIONS.md 9.7). Layers: rules for
# every dish image, the style, and the dish as services/recipe_v2/appearance.py
# describes it. Samples come from scripts/dish_image_samples.py.
kind = "image"
model = "GEMINI_IMAGE"          # constant in services/ai_models.py
layers = ["brief", "style", "dish"]
join = " "
aspect = "4:3"                  # the recipe cards and the top of the recipe page

# The variants the app uses (services/recipe_v2/images.py). The style is provisional
# (21.10.2026) until it is chosen with the recipe page in front of us; changing it
# means making the images again.
[final]
brief = "default"
style = "cutout"
dish = "default"
