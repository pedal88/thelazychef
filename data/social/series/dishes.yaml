# A series card (docs/SOCIAL.md "The series"). The top is the why, for Pål to correct; the rest is what the code reads.
name: Dishes to wash
status: active
purpose: Sell the dinner by how little there is to clean up afterwards, the cost of cooking nobody shows.
message: One dinner, the dishes it leaves shown as they are, the symbols and the steps.
hypothesis: >
  Washing up is what keeps people from cooking on a weeknight; a true small number ("Dishes to wash: 2") is worth a
  share to whoever does the dishes.
signal: Shares per 1000 views.
stop_when: >
  After 10 posts per platform it is below the median of the other series on shares per 1000 views, or the catalog
  runs out (17 dinners with two vessels or fewer on 31.10.2026).

pick:
  filter: dishes          # at most two vessels to wash (cleanup_factor 1)
  count: 1
slides: [cover, wash, ingredients, delta_or_timebar, timers, end]
cta: send
noun: one-pot dinner
hashtags: "#onepot #onepan #easydinner #lessdishes #dinnerideas"
hooks:
  number:
    - text: "Dishes to wash: {vessels}"
      needs: [vessels]
    - text: "{vessels} dishes to wash. {active} min of work."
      needs: [vessels, active]
    - text: "One dinner, {vessels} dishes to wash."
      needs: [vessels]
proposed_hooks: []
retired_hooks: []
